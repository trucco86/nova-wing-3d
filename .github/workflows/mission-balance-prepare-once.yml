name: Prepare mission pacing and difficulty candidate (recheck 3)
on:
  push:
    branches: [feat/p0-mission-pacing-difficulty-20261025]
    paths: ['.github/workflows/mission-balance-prepare-once.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Commit generated web build and remove one-off workflow
        run: |
          git rm .github/workflows/mission-balance-prepare-once.yml
          git add src/ tests/ specs/ docs/ index.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(balance): sync v1.24.6 and validated source formatting'
          git push origin HEAD:refs/heads/feat/p0-mission-pacing-difficulty-20261025
