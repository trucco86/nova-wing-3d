name: QA99 isolated subboss WebGL regression
on:
  push:
    branches: [fix/qa99-free-vertical-overpass-physical-20261107]
    paths: [.github/workflows/qa99-subboss-regression.yml]
permissions:
  contents: read
jobs:
  test-subboss:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:check
      - run: npx playwright install chromium
      - name: Check authentic first-stage subboss with efficient render checkpoints
        run: npx playwright test tests/browser/web-v120.spec.mjs tests/browser/mission-balance.spec.mjs --project=desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qa99-subboss-visual
          path: |
            test-results/
            playwright-report/
