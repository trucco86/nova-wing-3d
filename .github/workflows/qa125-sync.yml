name: QA125 temporary generated candidate
on:
  push:
    branches:
      - perf/qa125-obstacle-idle-prewarm-20261113
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format, test and prepare next candidate
        run: |
          npx prettier --write src/game.js src/obstacle-idle-prewarm.js tests/obstacle-idle-prewarm.test.mjs
          node --test tests/obstacle-idle-prewarm.test.mjs
          npm run release:prepare -- 1.27.124
          npm run build:check
      - name: Commit only the QA125 candidate changes
        shell: bash
        run: |
          git add src/game.js src/obstacle-idle-prewarm.js tests/obstacle-idle-prewarm.test.mjs package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md releases/v1.27.124.md index.html
          if ! git diff --cached --quiet; then
            git -c user.name='Nova Wing QA Bot' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m 'build(QA125): format and sync experimental prewarm candidate'
            git push origin HEAD:perf/qa125-obstacle-idle-prewarm-20261113
          fi
