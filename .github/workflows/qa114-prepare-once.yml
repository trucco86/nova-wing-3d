name: QA114 prepare cinematic skyline once
on:
  push:
    branches:
      - feat/qa114-city40-cinematic-silhouette-20261112
    paths:
      - .github/workflows/qa114-prepare-once.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare Graphics 4.0 version and validate all regression contracts
        run: |
          npm run release:prepare -- 1.27.114
          npm run format
          npm run build
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build(QA114): synchronize 1.27.114 cinematic silhouette candidate"
            git push origin HEAD:feat/qa114-city40-cinematic-silhouette-20261112
          fi
          npm run validate
