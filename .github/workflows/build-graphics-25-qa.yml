name: Prepare Graphics 2.5 reflection QA package
on:
  push:
    branches: [feat/graphics-25-reflections-cinema-v12731-qa-20261030]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  synchronize:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Version, format and quality
        run: |
          npm run release:prepare -- 1.27.31
          npm run format
          npm run build
          npm run build:check
          npm run validate
      - name: Commit synchronized browser candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/cinematic-reflections.js src/visuals.js tools/validate.mjs .github/workflows/ci.yml tests/cinematic-reflections-v12731.test.mjs specs/graphics-25-reflection-and-qa-v12731.md index.html package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md releases/v1.27.31.md
          if git diff --cached --quiet; then
            echo 'Already synchronized'
            exit 0
          fi
          git commit -m 'build(graphics): prepare v1.27.31 cinematic reflection web package'
          git push origin HEAD:feat/graphics-25-reflections-cinema-v12731-qa-20261030
