name: Prepare mecha candidate version and web build (one-off)
on:
  push:
    branches: [feat/mecha-flight-dynamics-dev-20261025]
    paths: ['.github/workflows/mecha-version-prepare-once.yml']
permissions:
  contents: write
concurrency:
  group: mecha-version-prepare
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write CHANGELOG.md releases/v1.25.0.md package.json package-lock.json
      - run: npm run build
      - run: npm run validate
      - name: Commit candidate metadata and generated build, then remove temporary workflow
        run: |
          git rm .github/workflows/mecha-version-prepare-once.yml
          git add CHANGELOG.md releases/v1.25.0.md package.json package-lock.json index.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(mecha): align 1.25.0 candidate build and release checks'
          git push origin HEAD:refs/heads/feat/mecha-flight-dynamics-dev-20261025
