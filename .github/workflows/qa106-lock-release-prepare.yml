name: Prepare QA106 multi-lock focus candidate
on:
  push:
    branches:
      - fix/qa105-lock-focus-v127106
    paths:
      - src/game.js
      - tests/mecha-multi-lock.test.mjs
permissions:
  contents: write
  actions: write
concurrency:
  group: qa106-lock-candidate
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qa105-lock-focus-v127106
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare explicit candidate version and generated artifact
        run: npm run release:prepare -- 1.27.106
      - name: Replace candidate changelog placeholder with scope
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const path = 'CHANGELOG.md';
          const current = readFileSync(path,'utf8');
          const header = '## 1.27.106';
          const start = current.indexOf(header);
          if(start < 0) throw new Error('Missing 1.27.106 heading');
          const next = current.indexOf('\n## ', start + 3);
          const end = next < 0 ? current.length : next;
          const section = current.slice(start,end).replace(
            '- Candidata não homologada; preencher entregas e evidências antes da publicação.',
            '- Cancelamento seguro de multi-lock ao liberar controles, perder foco ou pausar. Regressão determinística incluída. Candidata pendente dos gates browser e homologação.'
          );
          writeFileSync(path,current.slice(0,start)+section+current.slice(end));
          NODE
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - run: git diff --check
      - name: Commit explicit QA106 metadata and reproducible HTML
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md releases/v1.27.106.md index.html src/game.js tests/mecha-multi-lock.test.mjs
          if git diff --cached --quiet; then
            echo 'Candidate already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(qa106): sync release metadata and web bundle for lock fix'
          git push origin HEAD:fix/qa105-lock-focus-v127106
          gh workflow run ci.yml --ref fix/qa105-lock-focus-v127106
          gh workflow run cloudflare-preview.yml --ref fix/qa105-lock-focus-v127106
