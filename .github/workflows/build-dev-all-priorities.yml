name: Build consolidated Nova Wing DEV candidate (temporary)

on:
  push:
    branches:
      - integration/dev-all-priorities-20261028
    paths:
      - .github/workflows/build-dev-all-priorities.yml

permissions:
  contents: write

concurrency:
  group: integration-all-nova-wing-20261028
  cancel-in-progress: false

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Integrate HML foundation and six feature branches with audited merge order
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin \
            hml \
            feat/p1-stage-journey-foundation-20261027 \
            feat/cinematic-audio-v1260 \
            feat/p0-orbit-boss-cover-rank-ui-v12425-20261027 \
            feat/mecha-thruster-dual-aim-20261027 \
            feat/five-cats-formation-plasma-overdrive-20261028 \
            release/hml-score-history-v12425-20261028 \
            fix/p0-mobile-alert-priority-20261028
          merge_one() {
            ref="$1"
            echo "::group::Integrating $ref"
            if ! git merge --no-commit --no-ff -X theirs "origin/$ref"; then
              echo "::error::Unresolved merge in $ref: manual integration required."
              git diff --name-only --diff-filter=U
              exit 2
            fi
            # Untrusted feature branches must not mutate GitHub workflows during
            # an integration run: keep the reviewed DEV pipeline unchanged.
            git restore --source=HEAD --staged --worktree -- .github
            git add --all
            git diff --cached --check
            git commit -m "integrate(dev): $ref"
            echo "::endgroup::"
          }
          merge_one hml
          merge_one feat/p1-stage-journey-foundation-20261027
          merge_one feat/cinematic-audio-v1260
          merge_one feat/p0-orbit-boss-cover-rank-ui-v12425-20261027
          merge_one feat/mecha-thruster-dual-aim-20261027
          merge_one feat/five-cats-formation-plasma-overdrive-20261028
          merge_one release/hml-score-history-v12425-20261028
          merge_one fix/p0-mobile-alert-priority-20261028
          git log --oneline -9
      - name: Prepare one integrated 1.27.0 game build
        run: |
          npm ci
          npm run release:prepare -- 1.27.0
          npm run format
          npm run build
      - name: Verify mandatory independent feature modules are present
        run: |
          test -f src/stage-journey.js
          test -f src/asteroid-interior.js
          test -f src/five-cats-runtime.js
          test -f src/five-cats-squad.js
          test -f src/mecha-thruster-audio.js
          test -f src/mecha-motion.js
          test -f tests/browser/mobile-alert-priority.spec.mjs
          test -f tests/browser/five-cats-formation.spec.mjs
          test -f tests/browser/asteroid-journey.spec.mjs
          test -f tests/immersive-audio.test.mjs
          node -e 'const fs=require("fs"); const files=["src/game.js","src/visuals.js","src/audio.js"]; for(const f of files){if(fs.readFileSync(f,"utf8").includes("<<<<<<<"))throw Error("unresolved conflict in "+f)}'
      - name: Push integrated development candidate; never push DEV/HML/PROD
        run: |
          git add --all
          git diff --cached --check
          git commit -m "release(dev): integrated Nova Wing 1.27.0 all-priorities candidate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Run full static and unit validation on exact integrated tree
        run: npm run validate
