name: Prepare experimental mecha preview (one-off)
on:
  push:
    branches: [feat/nw25-mech-visual-parity]

permissions:
  contents: write

concurrency:
  group: mecha-preview-artifact-sync
  cancel-in-progress: false

jobs:
  prepare:
    if: "!contains(github.event.head_commit.message, '[skip prep]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Format and rebuild real distributed artifact
        run: |
          npm run format
          npm run build
      - name: Validate entire source with fresh generated HTML
        run: npm run validate
      - name: Commit generated preview and remove one-off workflow
        run: |
          git rm .github/workflows/mecha-preview-sync.yml
          git add src/ tests/ index.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(mecha): synchronize preview artifact with geometric source [skip prep]'
          git push origin HEAD:refs/heads/feat/nw25-mech-visual-parity
