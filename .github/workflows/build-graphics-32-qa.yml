name: Prepare Graphics 3.2 NOVA-7 GLB QA
on:
  push:
    branches: [feat/graphics-32-nova7-gltf-asset-v12734-qa-20261030]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  synchronize:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generate actual binary glTF and prepare web version
        run: |
          npm run assets:prepare
          npm run release:prepare -- 1.27.34
          npm run format
          npm run build
          npm run build:check
          npm run validate
      - name: Commit authored GLB and reproducible HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/assets/nova7-hero.glb.base64 src/premium-glb-runtime.js src/game.js tools/generate-nova7-glb.mjs tools/build.mjs tests/nova7-hero-glb-v12734.test.mjs tests/browser/graphics-32-nova7-glb.spec.mjs specs/graphics-32-nova7-authored-glb-v12734.md index.html package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md releases/v1.27.34.md
          if git diff --cached --quiet; then
            echo 'Version, GLB and HTML already synchronized'
            exit 0
          fi
          git commit -m 'build(assets): publish authored NOVA-7 GLB v1.27.34 browser candidate'
          git push origin HEAD:feat/graphics-32-nova7-gltf-asset-v12734-qa-20261030
