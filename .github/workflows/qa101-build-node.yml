name: QA101 camera occlusion build and full Node gate
on:
  push:
    branches: [fix/qa101-camera-occlusion-20261107]
    paths: [.github/workflows/qa101-build-node.yml]
permissions:
  contents: write
jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/qa101-camera-occlusion-20261107
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format, compile, validate and verify reproducibility
        run: |
          npm run format
          npm run build
          npm run check:repo
          npm run build:check
          npm run validate
          git diff --check
      - name: Commit only QA101 tested and generated changes
        run: |
          git add -- src/city-camera-occlusion.js src/visuals.js src/game.js tests/city-camera-occlusion.test.mjs tests/browser/qa101-camera-occlusion.spec.mjs tests/browser/mobile-hud-audit.spec.mjs specs/qa101-bridge-camera-occlusion.md index.html
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(QA101): compile and verify sightline fading with unchanged physics'
          git push origin HEAD:fix/qa101-camera-occlusion-20261107
