name: Final bundle and quality pass for v1.24.9
on:
  push:
    branches: [feat/p0-hud-alert-rail-pause-controls-20261025]
    paths: ['.github/workflows/p78-final-bundle-once.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Sync generated HTML without modifying workflows
        run: |
          git restore --worktree .github/workflows
          git add -A -- . ':!.github/workflows/**'
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(v1.24.9): clean full-screen HUD and pause help preview'
            git push origin HEAD:refs/heads/feat/p0-hud-alert-rail-pause-controls-20261025
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1249-final-quality
          path: artifacts/