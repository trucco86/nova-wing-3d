name: Isolated P0 Mecha first-frame mobile QA
on:
  push:
    branches: [feat/mecha2-clean-dev-v1250-20261027]
permissions:
  contents: read
jobs:
  mobile-regression:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:check
      - run: npm run validate
      - run: npx playwright install chromium
      - name: Verify mobile transformation with screenshot evidence
        env:
          NOVA_BROWSER_SHARD: 4/4
        run: npm run validate -- --browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mecha-first-frame-evidence
          path: |
            artifacts/
            test-results/
            playwright-report/
