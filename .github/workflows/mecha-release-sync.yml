name: Prepare mecha 1.25.0 candidate (one-off)
on:
  push:
    branches: [feat/mecha-shared-wing-dev-rebase]
permissions:
  contents: write
concurrency:
  group: mecha-release-candidate
  cancel-in-progress: false
jobs:
  prepare:
    if: "!contains(github.event.head_commit.message, '[skip mecha-release]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.25.0
      - run: npm run validate
      - name: Commit versioned artifacts and remove one-off workflow
        run: |
          git rm .github/workflows/mecha-release-sync.yml
          git add package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md releases/v1.25.0.md index.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(mecha): prepare v1.25.0 candidate without production promotion [skip mecha-release]'
          git push origin HEAD:refs/heads/feat/mecha-shared-wing-dev-rebase
