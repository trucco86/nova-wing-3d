name: One-shot Europa arena framing correction QA
on:
  push:
    branches: [fix/europa-boss-clear-arena-20261104]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair-and-capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Commit regenerated browser bundle and formatting
        run: |
          git config user.name 'nova-wing-qa-bot'
          git config user.email 'nova-wing-qa-bot@users.noreply.github.com'
          git add index.html src/europa-boss-arena.js src/game.js src/visuals.js tests/europa-boss-arena.test.mjs tests/browser/europa-clear-arena.spec.mjs specs/europa-clear-boss-arena-v12780.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore(build): synchronize centered Europa boss and glacial basin candidate'
            git push origin HEAD:fix/europa-boss-clear-arena-20261104
          fi
      - run: npx playwright install --with-deps chromium
      - name: Capture Europa ground clearance desktop and mobile
        run: npx playwright test tests/browser/europa-clear-arena.spec.mjs --project=desktop --project=mobile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: europa-stage6-framing-proof
          path: |
            test-results/**/europa-wide-clear-arena-*.png
            test-results/**/*.png
          if-no-files-found: warn
          retention-days: 7
