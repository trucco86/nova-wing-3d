name: Stage 04 cannon audio compatibility and full regression sync
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/orbit9-devastador-art-pass-20261120
permissions:
  contents: write
jobs:
  validate:
    if: github.event.pull_request.head.ref == 'feat/devastador-reactor-integrated-access-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format, build, test reactor and legacy audio regression
        run: |
          npx prettier --write src/audio-cues.js src/game.js tests/devastador-reactor-defense.test.mjs
          npm run build
          npm run build:check
          node --test tests/devastador-reactor-defense.test.mjs tests/devastador-grand-hall.test.mjs tests/devastador-sabotage.test.mjs tests/mecha-heavy-fire-v12722.test.mjs tests/qa111-weapon-audio.test.mjs tests/title-audio-mix-v12721.test.mjs
          npm run validate
      - name: Commit validated audio compatibility and remove one-shot workflow
        run: |
          git config user.name "Nova Wing QA Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/audio-cues.js src/game.js tests/devastador-reactor-defense.test.mjs
          git rm .github/workflows/devastador-audio-compat-sync.yml
          git diff --cached --quiet || git commit -m "chore(stage4): sync verified reactor cannon sound and all legacy audio tests"
          git push origin HEAD:feat/devastador-reactor-integrated-access-20261120
