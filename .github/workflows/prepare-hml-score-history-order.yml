name: Prepare isolated HML score history build
on:
  push:
    branches:
      - release/hml-score-history-v12425-20261028
permissions:
  contents: write
concurrency:
  group: hml-score-order-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format, build and validate HML candidate
        run: |
          npm run format
          npm run build
          npm run validate
      - name: Commit reproducible game artifact
        run: |
          git add -- src tests index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(hml): sync v1.24.25 chronological score history'
          git push origin "HEAD:${GITHUB_REF_NAME}"
