name: QA99 versioned full Node gate and bundle sync
# Re-run after restoring maglev visibility and giving the car a durable collision window.
on:
  push:
    branches: [fix/qa99-free-vertical-overpass-physical-20261107]
    paths: [.github/workflows/qa99-build-node.yml]
permissions:
  contents: write
jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/qa99-free-vertical-overpass-physical-20261107
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format, regenerate HTML and run full Node gate
        run: |
          npm run format
          npm run build
          npm run build:check
          npm run validate
          git diff --check
      - name: Commit QA99 sources, tests, spec and generated HTML
        run: |
          git add -- src/game.js src/visuals.js src/styles.css src/city-local-solids.js src/city-destruction.js tests/game.test.mjs tests/city-falling-solids.test.mjs tests/qa99-vertical-overpass.test.mjs tests/browser/qa99-open-flight-and-viaduct.spec.mjs specs/qa99-vertical-flight-overpass-and-hud.md index.html
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'build(QA99): format and bundle vertically open and physically solid city'
            git push origin HEAD:fix/qa99-free-vertical-overpass-physical-20261107
          fi
