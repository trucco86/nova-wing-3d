name: Prepare v1.27.8 tactical gameplay
on:
  push:
    branches:
      - fix/gameplay-combat-camera-rpg-v1278
    paths:
      - .github/workflows/prepare-gameplay-v1278.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.27.8
      - name: Format changed implementation and regression suites
        run: |
          npx prettier --write src/boss-behavior.js src/bosses.js src/flight.js src/stage-variety.js src/game.js src/five-cats-runtime.js src/five-cats-squad.js src/combat.js tests/boss-behavior.test.mjs tests/gameplay-combat-camera-rpg.test.mjs tests/stage-variety.test.mjs tests/stage-combat-variety.test.mjs CHANGELOG.md releases/v1.27.8.md
      - run: npm run build
      - run: npm run build:check
      - run: npm run validate
      - name: Commit reproducible candidate bundle
        run: |
          if git diff --quiet; then
            echo "Already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj index.html src/boss-behavior.js src/bosses.js src/flight.js src/stage-variety.js src/game.js src/five-cats-runtime.js src/five-cats-squad.js src/combat.js tests/boss-behavior.test.mjs tests/gameplay-combat-camera-rpg.test.mjs tests/stage-variety.test.mjs tests/stage-combat-variety.test.mjs CHANGELOG.md releases/v1.27.8.md
          git commit -m "build(dev): verify and version 1.27.8 tactical gameplay"
          git push origin HEAD:fix/gameplay-combat-camera-rpg-v1278
