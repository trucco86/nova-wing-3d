name: Sync P72 generated bundle once
on:
  push:
    branches: [feat/p0-mission-pacing-difficulty-20261025]
    paths: ['.github/workflows/p72-sync-bundle-once.yml']
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Commit only reproducible generated HTML and remove this one-shot job
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --name-only
          if [ -n "$(git diff --name-only -- . ':!index.html')" ]; then
            echo "::error::Unexpected formatted source changes; refusing to commit unreviewed files."
            exit 1
          fi
          git rm .github/workflows/p72-sync-bundle-once.yml
          git add index.html
          git commit -m 'build(P0): synchronize v1.24.6 obstacle-safe gameplay HTML'
          git push origin HEAD:refs/heads/feat/p0-mission-pacing-difficulty-20261025
