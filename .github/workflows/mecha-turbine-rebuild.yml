name: Validate animated mecha turbine (one-off)
on:
  push:
    branches: [feat/mecha-shared-wing-dev-rebase]
permissions:
  contents: write
concurrency:
  group: mecha-turbine-rebuild
  cancel-in-progress: false
jobs:
  rebuild:
    if: "!contains(github.event.head_commit.message, '[skip turbine-build]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/visuals.js src/game.js tests/mecha-design.test.mjs
      - run: npm run build
      - run: npm run validate
      - name: Commit regenerated build and remove one-off workflow
        run: |
          git rm .github/workflows/mecha-turbine-rebuild.yml
          git add src/visuals.js src/game.js tests/mecha-design.test.mjs index.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(mecha): rebuild animated turbine candidate [skip turbine-build]'
          git push origin HEAD:refs/heads/feat/mecha-shared-wing-dev-rebase
