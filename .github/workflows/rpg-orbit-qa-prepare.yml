name: Prepare RPG-orbit mobile QA v1.27.74
on:
  push:
    branches: [fix/rpg-drawer-orbit-touch-20261102]
    paths: ['.github/workflows/rpg-orbit-qa-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/rpg-drawer-orbit-touch-20261102
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare new candidate version, preserving v1.27.73
        run: |
          npm run release:prepare -- 1.27.74
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          t=p.read_text()
          t=t.replace('## 1.27.74 — Candidata em preparação', '## 1.27.74 — RPG mobile fecha e órbita permanece acessível (QA)')
          t=t.replace('- Candidata não homologada; preencher entregas e evidências antes da publicação.', '- O painel RPG preserva o botão de abertura/fechamento no topo; somente o conteúdo tático é expansível/rolável.\n- Removida a regra que ocultava os comandos ORBITAR quando o RPG estava aberto.\n- Iniciar órbita por toque também recolhe o RPG sem perder a pressão do botão. O início de um novo chefe sempre recolhe o painel.\n- Playwright: regressões nos viewports mobile 390x844, 320x568 e 844x390; preserva a órbita real da nave.\n- QA isolada, sem mudanças na arte do boss, mecânicas, saves ou produção.')
          p.write_text(t)
          Path('releases/v1.27.74.md').write_text('## Nova Wing 3D v1.27.74 — candidata QA\n\n- Correção do drawer RPG mobile: resumo sempre fixo e reabrível; conteúdo tático rola separadamente.\n- Botões ORBITAR permanecem visíveis e recebem toque mesmo com RPG aberto. Segurar uma seta recolhe o RPG e move a nave.\n- Ação aplicada a chefe em curso; teclado, desktop, dano, progressão e outras fases não mudam.\n- Testes Playwright para iPhone portrait e landscape e tela estreita 320px.\n\n**Somente QA. Validar os gestos em aparelho real antes de produção.**\n')
          PY
      - name: Format, rebuild and validate
        run: |
          npm run format
          npm run build
          npm run validate
      - name: Commit validated release candidate without touching main
        run: |
          git add -- package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md releases/v1.27.74.md index.html src/shell.html src/styles.css src/game.js tests/browser/rpg-orbit-drawer.spec.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'QA candidate already synchronized'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(qa): mobile RPG/orbit fix v1.27.74'
            git push origin HEAD:fix/rpg-drawer-orbit-touch-20261102
          fi
