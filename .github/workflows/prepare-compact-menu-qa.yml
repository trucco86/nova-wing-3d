name: Prepare compact menu QA candidate
on:
  push:
    branches: [fix/compact-hangar-qa-menus-20261102]
    paths:
      - .github/workflows/prepare-compact-menu-qa.yml

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'trucco86/nova-wing-3d' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.27.70
      - run: npm run format
      - run: npm run build
      - name: Commit reproducible source and generated bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html src tests specs docs package.json package-lock.json CHANGELOG.md ios
          if ! git diff --cached --quiet; then
            git commit -m "build(web): prepare v1.27.70 compact menus QA candidate"
            git push origin HEAD:fix/compact-hangar-qa-menus-20261102
          fi
      - run: npm run validate
      - run: npx playwright install chromium
      - name: Mobile and desktop menu regression tests
        run: npm run test:browser -- tests/browser/compact-menu-smoke-v12721.spec.mjs tests/browser/showroom.spec.mjs tests/browser/developer-scenarios.spec.mjs tests/browser/boss-combat-qa-chain.spec.mjs
