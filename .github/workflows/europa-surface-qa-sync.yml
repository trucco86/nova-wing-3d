name: Europa tunnel and frozen surface QA bundle sync
on:
  push:
    branches:
      - fix/europa-tunnel-surface-polish-20261105
permissions:
  contents: write
concurrency:
  group: europa-tunnel-surface-qa
  cancel-in-progress: true
jobs:
  sync:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format only changed Europa source and tests
        run: |
          npx prettier --write src/europa-surface.js src/destination-arrival.js src/visuals.js src/game.js src/encounters.js tests/europa-surface.test.mjs tests/europa-tunnel-breach.test.mjs tests/destination-arrival.test.mjs tests/browser/europa-surface-transition.spec.mjs
      - name: Validate scene timeline, tunnel aperture and physical debris
        run: |
          node --test tests/europa-surface.test.mjs tests/europa-tunnel-breach.test.mjs tests/destination-arrival.test.mjs tests/europa-boss-arena.test.mjs
      - name: Prepare versioned v1.27.86 candidate
        run: npm run release:prepare -- 1.27.86
      - name: Write truthful release notes and changelog
        run: |
          cat > releases/v1.27.86.md <<'NOTES'
          ## Nova Wing 3D v1.27.86 — Europa: túnel, ruptura e superfície congelante · QA

          - Fase 6: elimina coplanaridade entre piso global e deck físico do túnel. O túnel toma posse da renderização do piso e o solo global retorna após a passagem.
          - Uma abertura real, feita de três seções na parede direita e painel quebrável, permite a entrada planejada de um inimigo sem atravessar paredes intactas. O painel remove sua colisão antes de permitir a entrada; fragmentos congelados caem com movimento próprio.
          - Durante a travessia, ondas genéricas de inimigos e disparos anteriores são removidos/bloqueados para evitar entradas fantasmas.
          - O corpo celeste orbital e o segundo globo desaparecem antes da superfície, sem ficar flutuando atrás do terreno.
          - Nova superfície com texturização de gelo rachado, camadas de placas e cristas congeladas, partículas de neve ao vento e névoa azulada com densidade limitada para manter visibilidade dos inimigos.
          - InstancedMeshes e partículas em lote; neve é desligada em qualidade Média e em arena do chefe. Sem mudanças nas fases 1–5, Saturno, órbita 360, garras do Colosso ou colisões dos demais túneis.
          - Testes determinísticos de estados, painel e colisão, retorno do solo, vista orbital, limpeza da arena e Playwright com screenshots em retrato/paisagem.

          **Somente QA. Não publicar sem validação dos quatro shards e homologação visual no celular.**
          NOTES
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          value = path.read_text()
          value = value.replace(
            '## 1.27.86 — Candidata em preparação\n\n- Candidata não homologada; preencher entregas e evidências antes da publicação.',
            '## 1.27.86 — Europa: túnel e superfície gelada (QA)\n\n- Fase 6: piso do túnel sem z-fighting; quebra física de parede com destroços e entrada coerente de inimigo.\n- Lua e globo orbital desaparecem na transição de superfície, com névoa azul e cenário glacial detalhado.\n- Testes de piso, colisão, estado da superfície, regressão do Colosso e telas retrato/paisagem.\n- Homologação em celular físico pendente; produção inalterada.'
          )
          path.write_text(value)
          PY
      - name: Commit only source, tests and versioned generated build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md releases/v1.27.86.md index.html src/europa-surface.js src/destination-arrival.js src/visuals.js src/game.js src/encounters.js tests/europa-surface.test.mjs tests/europa-tunnel-breach.test.mjs tests/destination-arrival.test.mjs tests/browser/europa-surface-transition.spec.mjs
          if git diff --cached --quiet; then
            echo 'Already synchronized.'
            exit 0
          fi
          git commit -m 'build(europa): prepare frozen tunnel and surface QA v1.27.86'
          git push origin HEAD:fix/europa-tunnel-surface-polish-20261105
