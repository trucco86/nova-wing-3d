name: Format ranking migration tests (one-off)
on:
  push:
    branches: [feat/ranking-d1-schema-review]
permissions:
  contents: write
concurrency:
  group: ranking-schema-formatter
  cancel-in-progress: false
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[skip ranking-format]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/ranking-d1-schema.test.mjs workers/ranking/SCHEMA-REVIEW.md
      - run: npm run validate
      - name: Commit formatted test and remove one-off workflow
        run: |
          git rm .github/workflows/ranking-format-once.yml
          git add tests/ranking-d1-schema.test.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(ranking): format migration regression tests [skip ranking-format]'
          git push origin HEAD:refs/heads/feat/ranking-d1-schema-review
