name: Europa stage-6 generated QA build sync
on:
  push:
    branches:
      - fix/europa-colossus-camera-framing-20261105
permissions:
  contents: write
concurrency:
  group: europa-framing-qa-sync
  cancel-in-progress: true
jobs:
  sync:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format changed Europa source and tests
        run: npx prettier --write src/europa-boss-arena.js src/game.js tests/europa-boss-arena.test.mjs tests/browser/europa-clear-arena.spec.mjs
      - name: Build generated web
        run: npm run build
      - name: Commit exactly Europa files and the generated artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html src/europa-boss-arena.js src/game.js tests/europa-boss-arena.test.mjs tests/browser/europa-clear-arena.spec.mjs
          if git diff --cached --quiet; then
            echo 'Already synchronized.'
            exit 0
          fi
          git commit -m 'build(europa): sync stage-6 framing QA bundle'
          git push origin HEAD:fix/europa-colossus-camera-framing-20261105
