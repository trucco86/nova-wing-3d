name: One-time Mecha V4.1 candidate release
on:
  pull_request:
  push:
    branches: [feat/mars-storm-moons-warp-exit]
    paths:
      - .github/workflows/mecha-v41-candidate.yml
permissions:
  contents: write
jobs:
  synchronize:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/mars-storm-moons-warp-exit
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.27.65
      - name: Record candidate scope and limitations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          notes = Path("releases/v1.27.65.md")
          notes.write_text("""## Nova Wing 3D v1.27.65 — Mecha Premium V4.1 QA candidate

          - Reforça a leitura visual de BOOST na câmera traseira com cones de exaustão vetorial estáticos, visíveis somente durante propulsão e apagando suavemente.
          - Ombros, cabeça, asas e conjunto dorsal vinculados ao mesmo pivô do tronco; preserva a posição em repouso e corrige a referência local da mira esquerda.
          - Amortecimento do movimento do tronco, pernas estabilizadas em voo parado e transições suaves, responsivas a 30/60 FPS.
          - Cores da propulsão trocam apenas na mudança do estado do BOOST, reduzindo custo por frame.
          - Novos testes: coesão do esqueleto, pausa/reset de chama e comprimento da propulsão.

          **Não aprovada para produção.** Ainda requer screenshots de navegador e revisão real do enquadramento mobile e da performance em hardware.
          """)
          ch = Path("CHANGELOG.md")
          old = ch.read_text()
          ch.write_text(old.replace("- Candidata não homologada; preencher entregas e evidências antes da publicação.", "- Mecha V4.1: afterburners legíveis na câmera, upper-body rig conectado, mira em coordenadas do torso, idle estável e redução de trabalho no hot path; homologação visual pendente.", 1))
          PY
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - run: npm run build:check
      - name: Commit reproducible source and generated web output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md index.html package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj releases/v1.27.65.md specs/mecha-premium-v4.md src/mecha-motion.js src/visuals.js tests/mecha-premium-motion.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "build(mecha): synchronize reproducible V4.1 candidate v1.27.65"
            git push origin HEAD:feat/mars-storm-moons-warp-exit
          fi
