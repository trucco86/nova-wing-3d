name: City 2.4 isolated QA build
on:
  push:
    branches:
      - feat/graphics-2-city-high-medium-20261030
permissions:
  contents: write
concurrency:
  group: city-2-4-build
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format City 2.4
        run: npx prettier --write src/visuals.js src/city-districts.js tests/graphics.test.mjs tests/city-2-4-districts.test.mjs specs/city-2-4-districts.md
      - name: Rebuild web browser artifact
        run: npm run build
      - name: Execute quality gates
        run: |
          npm run lint
          npm run validate
          npm run build:check
      - name: Publish reproducible candidate to QA branch
        run: |
          git add src/visuals.js src/city-districts.js tests/graphics.test.mjs tests/city-2-4-districts.test.mjs specs/city-2-4-districts.md index.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(city): sync City 2.4 architectural districts browser preview"
            git push origin HEAD:feat/graphics-2-city-high-medium-20261030
          fi
