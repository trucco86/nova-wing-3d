name: QA170 Europa cave approach build sync
on:
  push:
    branches:
      - feat/alien-worlds-visual-identity-20261120
    paths:
      - .github/workflows/qa170-europa-cave-sync.yml
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: feat/alien-worlds-visual-identity-20261120
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format and validate physical cave approach
        run: |
          npx prettier --write src/europa-ice-cavern.js src/europa-cave-approach.js src/encounters.js src/game.js src/marvin-rival.js tests/europa-ice-cavern-and-enemies.test.mjs tests/europa-cave-approach.test.mjs tests/developer-scenarios.test.mjs tests/browser/qa168-alien-worlds.spec.mjs
          npm run lint
          node --test tests/europa-ice-cavern-and-enemies.test.mjs tests/europa-cave-approach.test.mjs tests/europa-surface.test.mjs tests/europa-descent.test.mjs tests/developer-scenarios.test.mjs
          npm run build
          npm run build:check
      - name: Commit only formatted cave sources and built HTML into draft branch
        run: |
          git add -- index.html src/europa-ice-cavern.js src/europa-cave-approach.js src/encounters.js src/game.js src/marvin-rival.js tests/europa-ice-cavern-and-enemies.test.mjs tests/europa-cave-approach.test.mjs tests/developer-scenarios.test.mjs tests/browser/qa168-alien-worlds.spec.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Cave build and test fixture already synchronized'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(europa): sync distant fjord and long physical ice cave'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

# Retry after correcting a deterministic value-equality assertion

