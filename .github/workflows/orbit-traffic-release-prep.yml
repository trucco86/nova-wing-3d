name: Prepare isolated orbital traffic v1.24.7
on:
  push:
    branches: [fix/p0-orbital-traffic-after-climb-20261025]
    paths: ['.github/workflows/orbit-traffic-release-prep.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.24.7
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Commit synchronized release artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md index.html releases/v1.24.7.md specs/mission-pacing-difficulty.md src/game.js tests/browser/launch-orbit.spec.mjs
          git diff --cached --quiet && { echo 'No release diff'; exit 1; }
          git commit -m 'build(release): synchronize generated v1.24.7 orbital traffic candidate'
          git push origin HEAD:fix/p0-orbital-traffic-after-climb-20261025
