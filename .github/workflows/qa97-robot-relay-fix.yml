name: Prepare QA v1.27.97 - robot module and damaged craft
on:
  push:
    branches: [feat/cockpit-five-cats-relay-v12796-20261107]
    paths: [.github/workflows/qa97-robot-relay-fix.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/cockpit-five-cats-relay-v12796-20261107
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare v1.27.97 before changing source
        run: npm run release:prepare -- 1.27.97
      - name: Fix real current ship module visibility, mecha lock and retreat paint with regression test
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          function replaceOnce(src, before, after, label) {
            const pieces = src.split(before);
            if (pieces.length !== 2) throw new Error(label + ' expected one occurrence, saw ' + (pieces.length - 1));
            return pieces.join(after);
          }
          let game = readFileSync('src/game.js', 'utf8');
          game = replaceOnce(game,
            "    for (const part of shipParts) part.visible = !robotMode;\n    $('robotTouch').ariaPressed",
            "    for (const part of shipParts) part.visible = !robotMode;\n    // shipParts captured the original module; every replacement must also follow the transformation.\n    shipModule.visible = !robotMode;\n    $('robotTouch').ariaPressed",
            'toggleRobot fresh module visibility');
          game = replaceOnce(game,
            "    robotMode = false;\n    robotTransition = 0;\n    dashRemaining = dashCooldown = 0;",
            "    robotMode = false;\n    robotTransition = 0;\n    robotCooldown = 0;\n    resetMechaLock();\n    dashRemaining = dashCooldown = 0;",
            'commander swap resets mecha target/transform state');
          game = replaceOnce(game,
            "          damagedCraft.rotation.copy(player.rotation);\n          damagedCraft.visible = true;",
            "          damagedCraft.rotation.copy(player.rotation);\n          // A broken craft retains the actual pilot's selected livery.\n          const livePaint = player.userData.paint ?? [];\n          damagedCraft.userData.paint?.forEach((material, i) => {\n            if (livePaint[i]) material.color.copy(livePaint[i].color);\n          });\n          damagedCraft.visible = true;",
            'damaged craft inherits current ship paint');
          game = replaceOnce(game,
            "      shipScale: shipModule.scale.x,",
            "      shipScale: shipModule.scale.x,\n      shipModuleVisible: shipModule.visible,\n      robotVisible: robot.visible,",
            'expose real transformation visibility in QA snapshot');
          writeFileSync('src/game.js', game);
          let tests = readFileSync('tests/pilot-relay-cockpit.test.mjs', 'utf8');
          tests += `
          test('transforming after pilot replacement hides the actual new ship module', (t) => {
            const h = harness();
            t.after(() => h.close());
            h.game.start();
            h.advance(0.3);
            h.key('KeyT');
            h.advance(1.3);
            const firstRobot = h.game.snapshot();
            assert.equal(firstRobot.mecha.active, true);
            assert.equal(firstRobot.shipModuleVisible, false);
            assert.equal(firstRobot.robotVisible, true);
            h.key('KeyT', false);
            assert.equal(h.game.switchPilot(), true);
            const replacedShip = h.game.snapshot();
            assert.equal(replacedShip.loadout.ship, 'aegis');
            assert.equal(replacedShip.mecha.active, false);
            assert.equal(replacedShip.shipModuleVisible, true);
            assert.equal(replacedShip.robotVisible, false);
            h.key('KeyT');
            h.advance(1.3);
            const nextRobot = h.game.snapshot();
            assert.equal(nextRobot.mecha.active, true);
            assert.equal(nextRobot.shipModuleVisible, false);
            assert.equal(nextRobot.robotVisible, true);
          });
          `;
          writeFileSync('tests/pilot-relay-cockpit.test.mjs', tests);
          let spec = readFileSync('specs/cockpit-five-cats-relay-v12796.md', 'utf8');
          spec += '\n## Correção complementar QA v1.27.97\n\n- Após cada troca, a transformação em robô deve ocultar o **módulo de nave atual** e restaurá-lo na volta; o módulo original removido nunca substitui essa lógica.\n- A troca encerra lock-on e cooldown de transformação ligados ao chassi anterior.\n- A nave que sai avariada preserva a paleta real escolhida pelo jogador.\n- Node regression verifica as duas transformações e o chassi substituto.\n';
          writeFileSync('specs/cockpit-five-cats-relay-v12796.md', spec);
          let changelog = readFileSync('CHANGELOG.md', 'utf8');
          const heading = changelog.indexOf('## 1.27.97');
          if (heading < 0) throw new Error('Missing v1.27.97 changelog');
          const placeholder = '- Candidata não homologada; preencher entregas e evidências antes da publicação.';
          const at = changelog.indexOf(placeholder, heading);
          if (at < 0) throw new Error('Missing v1.27.97 placeholder');
          changelog = changelog.slice(0, at) +
            '- QA cockpit e relay: módulo atual da nave não sobrepõe o robô após troca, lock e cooldown reiniciam com o novo chassi e a nave avariada preserva pintura escolhida. Testes browser ainda necessários.' +
            changelog.slice(at + placeholder.length);
          writeFileSync('CHANGELOG.md', changelog);
          writeFileSync('releases/v1.27.97.md', [
            '## Nova Wing 3D v1.27.97 — Cockpit / Mecha relay hardening (QA)',
            '',
            '- Correct visible ship-module ownership across pilot replacement and robot transformations.',
            '- Clear previous mecha targeting/transition on commander handoff.',
            '- Damaged craft inherits selected pilot livery while withdrawing.',
            '- Node regression covers fighter to robot, handoff and new fighter to robot.',
            '- Maintains the v1.27.96 cockpit, role-specific cats, radar and manual swap.',
            '',
            '**Isolated QA candidate only. Browser gates and physical visual review required before merge.**',
            '',
          ].join('\n'));
          NODE
      - name: Format, build and validate current source
        run: |
          npm run format
          npm run build
          npm run build:check
          npm run validate
          git diff --check
      - name: Commit validated QA candidate
        run: |
          git add -- src/game.js tests/pilot-relay-cockpit.test.mjs specs/cockpit-five-cats-relay-v12796.md package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md releases/v1.27.97.md index.html
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(qa97): current ship module follows new commander mecha, retire painted craft'
          git push origin HEAD:feat/cockpit-five-cats-relay-v12796-20261107
