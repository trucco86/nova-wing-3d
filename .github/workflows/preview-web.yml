name: Preview web build (manual / PR)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'package*.json'
      - 'index.html'
      - '.github/workflows/preview-web.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:check
      - name: Prepare portable preview
        run: |
          mkdir -p preview
          cp index.html preview/index.html
          printf 'Commit: %s\nPR: %s\n' "$GITHUB_SHA" "${{ github.event.pull_request.number }}" > preview/BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nova-wing-preview-${{ github.sha }}
          path: preview/
          retention-days: 7
