name: Prepare isolated sector palettes v1.24.20
on:
  push:
    branches: [feat/p0-sector-palettes-clean-v12420-20261027]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'trucco86/nova-wing-3d' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.24.20
      - run: npm run format
      - run: npm run validate
      - name: Commit synchronized isolated version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json CHANGELOG.md releases/v1.24.20.md index.html ios/App/App.xcodeproj/project.pbxproj src/campaign.js src/visuals.js tests/sector-palette.test.mjs tests/browser/sector-visual-audit.spec.mjs specs/sector-palette-clean-v12420.md
          if ! git diff --cached --quiet; then
            git commit -m 'build(arte): prepare reproducible sector palette v1.24.20'
            git push origin HEAD:feat/p0-sector-palettes-clean-v12420-20261027
          fi
