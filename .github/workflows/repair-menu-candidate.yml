name: Repair Nova Wing menu candidate
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/menu-uniform-ranking-bottom-20261028
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:check
      - run: npm run validate
      - name: Commit generated artifact to candidate
        run: |
          if git diff --quiet -- index.html; then
            echo "Already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "build: synchronize generated menu candidate"
          git push origin HEAD:fix/menu-uniform-ranking-bottom-20261028
