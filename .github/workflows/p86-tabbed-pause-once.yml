name: Rebuild v1.24.13 tabbed pause QA
on:
  push:
    branches: [feat/p0-device-fps-audit-pause-20261026]
    paths: ['.github/workflows/p86-tabbed-pause-once.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Commit formatted QA and deterministic WebGL bundle
        run: |
          git restore --worktree .github/workflows
          git add -A -- . ':!.github/workflows/**'
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(v1.24.13): verify FPS/controls pause tabs in portrait and landscape'
            git push origin HEAD:refs/heads/feat/p0-device-fps-audit-pause-20261026
          fi