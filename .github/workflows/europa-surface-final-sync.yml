name: Europa v1.27.86 final QA source sync
on:
  push:
    branches:
      - fix/europa-tunnel-surface-polish-20261105
permissions:
  contents: write
concurrency:
  group: europa-surface-final-sync
  cancel-in-progress: true
jobs:
  sync:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format precise orbit-surface boundary and collision regression
        run: npx prettier --write src/europa-surface.js src/destination-arrival.js tests/europa-surface.test.mjs tests/europa-tunnel-breach.test.mjs
      - name: Verify critical Europa regression suite
        run: node --test tests/europa-surface.test.mjs tests/europa-tunnel-breach.test.mjs tests/destination-arrival.test.mjs tests/europa-boss-arena.test.mjs
      - name: Generate reproducible v1.27.86 web bundle
        run: npm run build
      - name: Commit changed sources, tests and HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/europa-surface.js src/destination-arrival.js tests/europa-surface.test.mjs tests/europa-tunnel-breach.test.mjs index.html
          if git diff --cached --quiet; then
            echo 'Already synchronized'
            exit 0
          fi
          git commit -m 'build(europa): synchronize no-moon landing boundary and collision tests'
          git push origin HEAD:fix/europa-tunnel-surface-polish-20261105
