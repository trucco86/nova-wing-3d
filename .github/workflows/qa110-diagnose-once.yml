name: QA110 diagnose media layout once
on:
  push:
    branches:
      - feat/qa110-premium-city-ads-physics-20261111
    paths:
      - .github/workflows/qa110-diagnose-once.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Count real slots and draw calls
        run: |
          node --input-type=module <<'EOF'
          import * as T from 'three';
          import { createWorld } from './src/visuals.js';
          const scene = new T.Scene();
          createWorld(scene, () => 0.43, true);
          let batches = 0;
          scene.traverse(o => { if (o.isInstancedMesh) batches++; });
          console.log('QA110_BATCH_COUNT=' + batches);
          for (const name of ['launch-city','launch-city-far']) {
            const tile=scene.getObjectByName(name);
            const ads=tile.getObjectByName('city-premium-ad-inventory');
            console.log('QA110_SLOTS_' + name + '=' + JSON.stringify({total:ads.userData.total,counts:ads.userData.counts,hostIds:ads.userData.slots.map(x=>x.hostIndex),ids:ads.userData.slots.map(x=>x.id)}));
          }
          EOF
