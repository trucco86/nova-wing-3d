name: Sync generated web
on:
  push:
    branches:
      - feat/nw09-cinematic-3d
      - feat/p0-orbit-boss-cover-rank-ui-v12425-20261027
permissions:
  contents: write
  actions: write
jobs:
  sync:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Synchronize v1.24.25 source and generated web on isolated branch
        if: github.ref == 'refs/heads/feat/p0-orbit-boss-cover-rank-ui-v12425-20261027'
        run: |
          git add -- index.html src/game.js src/visuals.js src/boss-departure.js src/shell.html src/styles.css src/i18n.js tests/orbit-boss-v12425.test.mjs tests/boost-mission-objective-v12425.test.mjs specs/orbit-boss-mobile-rank-v12425.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(web): format and sync v1.24.25 visual candidate'
            git push origin HEAD:feat/p0-orbit-boss-cover-rank-ui-v12425-20261027
          fi
      - name: Commit only generated web artifact
        if: github.ref == 'refs/heads/feat/nw09-cinematic-3d'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- index.html; then
            echo 'Generated index is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'build(web): sync generated index for v1.23.0'
          git push origin HEAD:feat/nw09-cinematic-3d
          gh workflow run ci.yml --ref feat/nw09-cinematic-3d
