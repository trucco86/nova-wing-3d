name: Sync generated web
on:
  push:
    branches:
      - feat/nw09-cinematic-3d
      - feat/qa135-premium-fractured-moon-perf-20261115
      - feat/qa136-boss-learning-mars-combat-20261115
      - fix/qa137-mobile-rpg-accordion-hud-20261115
      - feat/qa140-radial-rpg-tactical-pause-20261115
permissions:
  contents: write
  actions: write
concurrency:
  group: sync-generated-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sync:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Commit only generated web artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          # QA137: keep source/contract formatting synced with the built artifact.
          if [ "${GITHUB_REF_NAME}" = "fix/qa137-mobile-rpg-accordion-hud-20261115" ]; then
            git add -- src/shell.html src/styles.css src/main.js src/mobile-rpg.js tests/qa137-mobile-rpg-accordion.test.mjs specs/qa137-mobile-rpg-accordion.md tests/browser/qa-menu-berserk.spec.mjs tests/browser/boss-combat-qa-chain.spec.mjs tests/browser/dynamic.spec.mjs tests/browser/mobile-hud-audit.spec.mjs tests/browser/subboss-edge-hud.spec.mjs tests/browser/rpg-top-hud.spec.mjs
          fi
          if [ "${GITHUB_REF_NAME}" = "feat/qa140-radial-rpg-tactical-pause-20261115" ]; then
            git add -- src/shell.html src/styles.css src/main.js src/mobile-rpg.js src/game.js tests/qa140-radial-rpg.test.mjs specs/qa140-radial-rpg-tactical-pause.md tests/browser/qa-menu-berserk.spec.mjs tests/browser/boss-combat-qa-chain.spec.mjs tests/browser/dynamic.spec.mjs tests/browser/five-cats-formation.spec.mjs tests/dynamic-scene.js tests/browser/rpg-top-hud.spec.mjs tests/browser/rpg-orbit-drawer.spec.mjs tests/browser/omega-flank-qa.spec.mjs tests/browser/game.spec.mjs package.json package-lock.json CHANGELOG.md releases/v1.27.135.md .github/workflows/sync-generated-web.yml
          fi
          if git diff --cached --quiet; then
            echo 'Generated web and scoped QA sources already synchronized.'
            exit 0
          fi
          git commit -m 'build(web): sync QA candidate and generated HTML'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_NAME}" = "feat/qa136-boss-learning-mars-combat-20261115" ]; then
            gh workflow run cloudflare-preview.yml --ref "${GITHUB_REF_NAME}"
          fi
