name: Sync generated web
on:
  push:
    branches:
      - fix/web-v1-23-aim-roll-controls
permissions:
  contents: write
  actions: write
jobs:
  sync:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Commit only generated web artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- index.html; then
            echo 'Generated index is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'build(web): sync generated index for v1.23.1'
          git push origin HEAD:fix/web-v1-23-aim-roll-controls
          gh workflow run ci.yml --ref fix/web-v1-23-aim-roll-controls
