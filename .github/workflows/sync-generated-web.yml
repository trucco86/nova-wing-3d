name: Sync generated web
on:
  push:
    branches:
      - feat/nw09-cinematic-3d
      - feat/ranking-data-deletion-control-20261027
permissions:
  contents: write
  actions: write
jobs:
  sync:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Synchronize versioned Web privacy candidate only on isolated branch
        if: github.ref == 'refs/heads/feat/ranking-data-deletion-control-20261027'
        run: |
          git add -- index.html src/ranking-client.js src/shell.html tests/ranking-data-deletion.test.mjs specs/ranking-data-deletion-p0.md
          if git diff --cached --quiet; then
            echo 'HTML and source already synchronized.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(web): sync v1.24.23 ranking deletion distribution'
            git push origin HEAD:feat/ranking-data-deletion-control-20261027
          fi
      - name: Commit only generated web artifact
        if: github.ref == 'refs/heads/feat/nw09-cinematic-3d'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- index.html; then
            echo 'Generated index is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'build(web): sync generated index for v1.23.0'
          git push origin HEAD:feat/nw09-cinematic-3d
          gh workflow run ci.yml --ref feat/nw09-cinematic-3d
