name: City 2.6 versioned isolated QA preparation
on:
  push:
    branches:
      - feat/city-2-6-maglev-sculpted-20261031
    paths:
      - .github/workflows/qa-city-26-version.yml
permissions:
  contents: write
jobs:
  versioned-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOVA_BASE_SHA: 6247541ead8821f562f8aa5f27d0debd9efb1597
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/city-2-6-maglev-sculpted-20261031
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.27.35
      - run: npm run format
      - run: npm run build
      - run: npm run build:check
      - run: npm run lint
      - run: npm run test
      - run: npm run validate
      - name: Commit versioned assets to isolated QA branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md releases/v1.27.35.md ios/App/App.xcodeproj/project.pbxproj index.html src/city-premium.js src/visuals.js tests/city-2-6-transit.test.mjs specs/city-2-6-transit-polish.md
          if ! git diff --cached --quiet; then
            git commit -m "build(city): prepare v1.27.35 for City 2.6 QA"
            git push origin HEAD:feat/city-2-6-maglev-sculpted-20261031
          fi
