name: HML ranking configuration readiness (read-only)
on:
  push:
    branches:
      - ops/hml-ranking-readiness-20261028
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report prerequisite presence, never values
        env:
          NOVA_FIREBASE_HML_CONFIG_JSON: ${{ vars.NOVA_FIREBASE_HML_CONFIG_JSON }}
          NOVA_RANKING_HML_D1_ID: ${{ vars.NOVA_RANKING_HML_D1_ID }}
          NOVA_RANKING_HML_FIREBASE_PROJECT_ID: ${{ vars.NOVA_RANKING_HML_FIREBASE_PROJECT_ID }}
          NOVA_RANKING_HML_API_URL: ${{ vars.NOVA_RANKING_HML_API_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf 'HML ranking readiness (configuration presence only; NO secret values):\n'
          for key in NOVA_FIREBASE_HML_CONFIG_JSON NOVA_RANKING_HML_D1_ID NOVA_RANKING_HML_FIREBASE_PROJECT_ID NOVA_RANKING_HML_API_URL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -n "${!key}" ]]; then
              echo "${key}: CONFIGURED"
            else
              echo "${key}: MISSING"
            fi
          done
          echo 'OAuth domain authorization and real score writes are NOT verified.'
      - name: Inspect Cloudflare for HML D1 database without changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOVA_RANKING_HML_D1_ID: ${{ vars.NOVA_RANKING_HML_D1_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Cloudflare credentials missing; no database was changed."
            exit 1
          fi
          output="$RUNNER_TEMP/nova-d1-list.json"
          if ! npx --yes wrangler@4 d1 list --json > "$output" 2> "$RUNNER_TEMP/nova-d1-stderr.txt"; then
            echo "::error::Cannot list Cloudflare D1 with configured token. Verify D1 permissions. No database was changed."
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const response = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const databases = Array.isArray(response) ? response : response.result;
            if (!Array.isArray(databases)) throw new Error("Unexpected Cloudflare response");
            const matching = databases.filter((entry) => entry.name === "nova-wing-ranking-hml");
            if (matching.length !== 1) throw new Error("HML D1 not found exactly once in Cloudflare account");
            console.log("HML D1 exists in the connected Cloudflare account.");
            const configured = process.env.NOVA_RANKING_HML_D1_ID;
            if (!configured) {
              console.log("GITHUB_REPOSITORY_VARIABLE: MISSING. Add NOVA_RANKING_HML_D1_ID to repository Actions Variables.");
            } else {
              if (!/^[0-9a-fA-F-]{36}$/.test(configured) ||
                  (matching[0].uuid !== configured && matching[0].id !== configured))
                throw new Error("Configured HML D1 ID does not match the named Cloudflare database");
              console.log("GITHUB_REPOSITORY_VARIABLE: VERIFIED (matches HML database UUID).");
            }
            console.log("No remote migrations or writes were performed.");
          ' "$output"
