name: Regenerate v1.24.10 after map landscape QA
on:
  push:
    branches: [feat/intermission-arsenal-campaign-map-20261025]
    paths: ['.github/workflows/intermission-release-prep.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.24.10
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Commit synchronized artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles.css src/game.js tests/browser/intermission-map.spec.mjs index.html package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md
          git diff --cached --quiet && { echo 'No release changes'; exit 1; }
          git commit -m 'build(release): synchronize landscape map and v1.24.10 web bundle'
          git push origin HEAD:feat/intermission-arsenal-campaign-map-20261025
