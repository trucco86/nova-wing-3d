name: Prepare intermission hangar campaign map v1.24.10
on:
  push:
    branches: [feat/intermission-arsenal-campaign-map-20261025]
    paths: ['.github/workflows/intermission-release-prep.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.24.10
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Commit synchronized release artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md index.html releases/v1.24.10.md specs/intermission-hangar-campaign-map.md src/campaign.js src/campaign-map.js src/game.js src/shell.html src/styles.css tests/intermission-campaign-map.test.mjs
          git diff --cached --quiet && { echo 'No release diff'; exit 1; }
          git commit -m 'build(release): sync generated v1.24.10 hangar campaign map candidate'
          git push origin HEAD:feat/intermission-arsenal-campaign-map-20261025
