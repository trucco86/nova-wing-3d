name: Native 4K60 latest-main replacement samples
on:
  push:
    branches: [media/gameplay-native-4k60-v3]
    paths:
      - 'tools/media-capture.mjs'
      - '.github/workflows/gameplay-native-4k60-v3.yml'
permissions:
  contents: read
concurrency:
  group: native-gameplay-v3-sample
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - { sector: 2, boss: '0', warmup: 12, seconds: 8 }
          - { sector: 2, boss: '1', warmup: 0, seconds: 8 }
          - { sector: 3, boss: '0', warmup: 22, seconds: 12 }
          - { sector: 3, boss: '1', warmup: 4, seconds: 8 }
          - { sector: 7, boss: '0', warmup: 20, seconds: 12 }
          - { sector: 7, boss: '1', warmup: 0, seconds: 8 }
    env:
      SOURCE_COMMIT: f481c31cd93349c972b9f1c0099f5e140db0dc42
      SAMPLE_SECONDS: ${{ matrix.seconds }}
      WARMUP_SECONDS: ${{ matrix.warmup }}
      SECTOR: ${{ matrix.sector }}
      BOSS: ${{ matrix.boss }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Verify gameplay source provenance
        run: git diff --exit-code "$SOURCE_COMMIT" HEAD -- src package.json package-lock.json tests/dynamic-scene.js tools/visual-fixture.mjs
      - run: npm ci
      - run: npm run agent:context -- --mapa
      - run: node --check tools/media-capture.mjs
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: node tools/visual-fixture.mjs
      - name: Capture native gameplay segment and original audio
        run: |
          NOVA_VISUAL_TEST=1 node tools/serve.mjs --port 4187 > /tmp/nova-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4187/__dynamic.html -o /dev/null; then break; fi
            sleep 1
          done
          node tools/media-capture.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-v3-sample-${{ matrix.sector }}-${{ matrix.boss }}
          path: |
            artifacts/native-4k60/*.mp4
            artifacts/native-4k60/*.json
            artifacts/native-4k60/*.png
          retention-days: 14
