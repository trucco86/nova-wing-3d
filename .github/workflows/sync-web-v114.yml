name: Synchronize Nova Wing 1.14 web release
on:
  push:
    branches:
      - feat/web-v1-14-audio-story-foundation
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-web-v114
  cancel-in-progress: true
jobs:
  bundle:
    if: github.repository == 'trucco86/nova-wing-3d' && github.ref == 'refs/heads/feat/web-v1-14-audio-story-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/web-v1-14-audio-story-foundation
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format and bundle single-file browser game
        run: |
          npm run format
          npm run build
      - name: Push generated web artifact
        run: |
          git add index.html src/ tests/ specs/ .github/workflows/sync-web-v114.yml CHANGELOG.md package.json package-lock.json releases/v1.14.0.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(web): sync v1.14 mobile cinematic fix'
            git push origin HEAD:feat/web-v1-14-audio-story-foundation
          fi
      - run: npm run validate
      - name: Confirm touch interaction in mobile safe-area layout
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/browser/game.spec.mjs --project=mobile --grep 'offline Android interface'
