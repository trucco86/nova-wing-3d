name: Synchronize Nova Wing 1.14 web release
on:
  push:
    branches:
      - feat/web-v1-14-audio-story-foundation
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-web-v114
  cancel-in-progress: true
jobs:
  bundle:
    # Never mutate a release, default branch or a fork PR.
    if: github.repository == 'trucco86/nova-wing-3d' && github.ref == 'refs/heads/feat/web-v1-14-audio-story-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/web-v1-14-audio-story-foundation
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format and create deterministic static build
        run: |
          npm run format
          npm run build
      - name: Save bundled artifact on the feature branch
        run: |
          git add index.html src/ tests/ specs/ .github/workflows/sync-web-v114.yml
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(web): synchronize v1.14.0 single-file bundle'
            git push origin HEAD:feat/web-v1-14-audio-story-foundation
          fi
      - name: Validate quality after bundle refresh
        run: npm run validate
