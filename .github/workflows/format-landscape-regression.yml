name: Format landscape regression
on:
  push:
    branches:
      - fix/dev-landscape-scroll-20261028
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/browser/menu-uniform-ranking.spec.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet -- tests/browser/menu-uniform-ranking.spec.mjs; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/menu-uniform-ranking.spec.mjs
          git commit -m "style(bot): format landscape browser regression"
          git push origin HEAD:fix/dev-landscape-scroll-20261028
