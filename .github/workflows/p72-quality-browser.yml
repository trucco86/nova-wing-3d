name: Validate P72 orbital balance and difficulty round 2
on:
  push:
    branches: [feat/p0-mission-pacing-difficulty-20261025]
    paths: ['.github/workflows/p72-quality-browser.yml']
permissions:
  contents: read
concurrency:
  group: p72-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p72-quality
          path: artifacts/
  browser:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 23
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      NOVA_BROWSER_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run validate -- --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p72-browser-evidence-${{ matrix.shard }}
          path: |
            artifacts/
            test-results/
            playwright-report/
