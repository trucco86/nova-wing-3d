name: QA168 temporary crystal-composition sync
on:
  push:
    branches: [feat/alien-worlds-visual-identity-20261120]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alien-worlds-visual-identity-20261120
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format Europa art and regression tests
        run: npx prettier --write src/europa-crystal-canyon.js src/europa-surface.js src/destination-landmarks.js src/visuals.js tests/europa-crystal-canyon.test.mjs
      - name: Build synchronized preview
        run: npm run build
      - name: Validate foreground and boss regressions
        run: node --test tests/europa-crystal-canyon.test.mjs tests/europa-surface.test.mjs tests/qa119-geology-and-caverns.test.mjs tests/europa-boss-arena.test.mjs tests/qa140-premium-biomes-budget.test.mjs
      - name: Commit QA-only source and generated web build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/europa-crystal-canyon.js src/europa-surface.js src/destination-landmarks.js src/visuals.js tests/europa-crystal-canyon.test.mjs index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(QA168): build sharper cinematic Europa crystal corridor"
            git push origin HEAD:feat/alien-worlds-visual-identity-20261120
          fi
