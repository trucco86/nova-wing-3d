name: QA168 temporary scenic hero sync
on:
  push:
    branches:
      - feat/alien-worlds-visual-identity-20261120
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alien-worlds-visual-identity-20261120
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format only the edited hero landmark source and tests
        run: npx prettier --write src/alien-architecture.js tests/alien-worlds-visual-identity.test.mjs tests/dynamic-scene.js tests/browser/qa168-alien-worlds.spec.mjs
      - name: Rebuild synchronized candidate HTML
        run: npm run build
      - name: Commit generated preview bundle to QA branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/alien-architecture.js tests/alien-worlds-visual-identity.test.mjs tests/dynamic-scene.js tests/browser/qa168-alien-worlds.spec.mjs index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(QA168): format and rebuild stable Europa hero landmark"
            git push origin HEAD:feat/alien-worlds-visual-identity-20261120
          fi