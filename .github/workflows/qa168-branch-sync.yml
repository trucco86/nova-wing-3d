name: QA168 temporary final browser-spec format sync
on:
  push:
    branches: [feat/alien-worlds-visual-identity-20261120]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alien-worlds-visual-identity-20261120
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format changed QA browser tests and scene helpers
        run: npx prettier --write src/encounters.js tests/dynamic-scene.js tests/browser/qa168-alien-worlds.spec.mjs tests/europa-surface.test.mjs tests/europa-crystal-canyon.test.mjs
      - run: npm run build
      - name: Commit formatted QA source and generated preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/encounters.js tests/dynamic-scene.js tests/browser/qa168-alien-worlds.spec.mjs tests/europa-surface.test.mjs tests/europa-crystal-canyon.test.mjs index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(Europa): format cave scene capture and synchronize QA preview"
            git push origin HEAD:feat/alien-worlds-visual-identity-20261120
          fi
