name: QA168 temporary Europa cave art bundle
on:
  push:
    branches: [feat/alien-worlds-visual-identity-20261120]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alien-worlds-visual-identity-20261120
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format adjusted icy gate and regression tests
        run: npx prettier --write src/europa-ice-cavern.js src/encounters.js tests/europa-ice-cavern-and-enemies.test.mjs tests/browser/qa168-alien-worlds.spec.mjs
      - name: Validate collisions, ice cave and moon transition
        run: node --test tests/europa-ice-cavern-and-enemies.test.mjs tests/europa-descent.test.mjs tests/europa-crystal-canyon.test.mjs
      - name: Build QA distribution
        run: npm run build
      - name: Commit only QA source and rebuilt index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/europa-ice-cavern.js src/encounters.js tests/europa-ice-cavern-and-enemies.test.mjs tests/browser/qa168-alien-worlds.spec.mjs index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(Europa): bundle crystalline cave gates and preserve collision contracts"
            git push origin HEAD:feat/alien-worlds-visual-identity-20261120
          fi
