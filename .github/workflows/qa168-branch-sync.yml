name: QA168 temporary vault review bundle sync
on:
  push:
    branches:
      - feat/alien-worlds-visual-identity-20261120
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alien-worlds-visual-identity-20261120
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format QA168 Europa vault changes
        run: npx prettier --write src/alien-monument-geometry.js src/alien-architecture.js src/visuals.js src/destination-landmarks.js tests/alien-worlds-visual-identity.test.mjs tests/alien-monument-geometry.test.mjs
      - name: Update bundled game HTML
        run: npm run build
      - name: Commit generated QA branch bundle only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/alien-monument-geometry.js src/alien-architecture.js src/visuals.js src/destination-landmarks.js tests/alien-worlds-visual-identity.test.mjs tests/alien-monument-geometry.test.mjs index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(QA168): format and rebuild Europa hero vault candidate"
            git push origin HEAD:feat/alien-worlds-visual-identity-20261120
          fi
