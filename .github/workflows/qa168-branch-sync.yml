name: QA168 temporary canyon regression sync
on:
  push:
    branches:
      - feat/alien-worlds-visual-identity-20261120
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alien-worlds-visual-identity-20261120
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format updated QA168 files
        run: npx prettier --write src/europa-crystal-canyon.js src/europa-surface.js tests/destination-arrival.test.mjs tests/qa119-geology-and-caverns.test.mjs tests/qa140-premium-biomes-budget.test.mjs
      - name: Rebuild game HTML
        run: npm run build
      - name: Run focused regression tests
        run: node --test tests/europa-crystal-canyon.test.mjs tests/europa-surface.test.mjs tests/destination-arrival.test.mjs tests/qa119-geology-and-caverns.test.mjs tests/qa140-premium-biomes-budget.test.mjs
      - name: Commit the QA-only source and compiled bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/europa-crystal-canyon.js src/europa-surface.js tests/destination-arrival.test.mjs tests/qa119-geology-and-caverns.test.mjs tests/qa140-premium-biomes-budget.test.mjs index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(QA168): synchronize crisp Europa canyon and legacy regression budgets"
            git push origin HEAD:feat/alien-worlds-visual-identity-20261120
          fi
