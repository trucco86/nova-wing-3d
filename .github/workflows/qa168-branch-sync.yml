name: QA168 temporary final source sync
on:
  push:
    branches:
      - feat/alien-worlds-visual-identity-20261120
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alien-worlds-visual-identity-20261120
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format QA168 files
        run: npx prettier --write src/alien-architecture.js src/visuals.js src/destination-arrival.js src/destination-vista.js tests/europa-surface.test.mjs tests/alien-worlds-visual-identity.test.mjs tests/dynamic-scene.js tests/browser/qa168-alien-worlds.spec.mjs
      - name: Prepare isolated QA candidate version 1.27.160
        run: npm run release:prepare -- 1.27.160
      - name: Sync generated files to QA branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/alien-architecture.js src/visuals.js src/destination-arrival.js src/destination-vista.js tests/europa-surface.test.mjs tests/alien-worlds-visual-identity.test.mjs tests/dynamic-scene.js tests/browser/qa168-alien-worlds.spec.mjs index.html package.json package-lock.json CHANGELOG.md ios/App/App.xcodeproj/project.pbxproj releases/v1.27.160.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(QA168): prepare 1.27.160 QA build and version parity"
            git push origin HEAD:feat/alien-worlds-visual-identity-20261120
          fi
