name: QA168 temporary Europa cave + enemy source sync
on:
  push:
    branches:
      - feat/alien-worlds-visual-identity-20261120
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alien-worlds-visual-identity-20261120
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format Europa source and tests
        run: npx prettier --write src/europa-descent.js src/europa-ice-cavern.js src/europa-enemy-ice-skin.js src/europa-crystal-canyon.js src/visuals.js src/encounters.js src/game.js tests/europa-descent.test.mjs tests/europa-surface.test.mjs tests/alien-worlds-visual-identity.test.mjs tests/browser/qa168-alien-worlds.spec.mjs tests/europa-crystal-canyon.test.mjs tests/europa-ice-cavern-and-enemies.test.mjs
      - name: Generate production-shaped HTML only for QA preview
        run: npm run build
      - name: Commit source and preview distribution to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/europa-descent.js src/europa-ice-cavern.js src/europa-enemy-ice-skin.js src/europa-crystal-canyon.js src/visuals.js src/encounters.js src/game.js tests/europa-descent.test.mjs tests/europa-surface.test.mjs tests/alien-worlds-visual-identity.test.mjs tests/browser/qa168-alien-worlds.spec.mjs tests/europa-crystal-canyon.test.mjs tests/europa-ice-cavern-and-enemies.test.mjs index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(Europa): sync orbital ice curtain, frozen cave, enemy styling and preview bundle"
            git push origin HEAD:feat/alien-worlds-visual-identity-20261120
          fi
