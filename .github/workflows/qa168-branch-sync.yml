name: QA168 temporary Europa arrival sequence sync
on:
  push:
    branches: [feat/alien-worlds-visual-identity-20261120]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alien-worlds-visual-identity-20261120
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format authored arrival and targeted tests
        run: npx prettier --write src/europa-descent.js src/europa-surface.js src/destination-arrival.js src/destination-vista.js src/visuals.js src/game.js tests/europa-descent.test.mjs tests/europa-surface.test.mjs tests/alien-worlds-visual-identity.test.mjs tests/browser/qa168-alien-worlds.spec.mjs
      - name: Validate Mars parity and full Europa scene transitions
        run: node --test tests/europa-descent.test.mjs tests/europa-surface.test.mjs tests/destination-arrival.test.mjs tests/alien-worlds-visual-identity.test.mjs tests/europa-crystal-canyon.test.mjs tests/europa-boss-arena.test.mjs
      - name: Rebuild production-shaped HTML strictly for QA preview
        run: npm run build
      - name: Commit QA branch source and distribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/europa-descent.js src/europa-surface.js src/destination-arrival.js src/destination-vista.js src/visuals.js src/game.js tests/europa-descent.test.mjs tests/europa-surface.test.mjs tests/alien-worlds-visual-identity.test.mjs tests/browser/qa168-alien-worlds.spec.mjs index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(QA168): verify and sync Europa Mars-parity transition preview"
            git push origin HEAD:feat/alien-worlds-visual-identity-20261120
          fi
