name: QA168 temporary ice transition sync
on:
  push:
    branches: [feat/alien-worlds-visual-identity-20261120]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alien-worlds-visual-identity-20261120
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format updated Europa code and regressions
        run: npx prettier --write src/visuals.js src/destination-vista.js tests/europa-crystal-canyon.test.mjs tests/browser/europa-surface-transition.spec.mjs
      - name: Rebuild QA preview HTML
        run: npm run build
      - name: Run focused regressions on the real world and transition
        run: node --test tests/europa-crystal-canyon.test.mjs tests/europa-descent.test.mjs tests/europa-surface.test.mjs tests/europa-ice-cavern-and-enemies.test.mjs
      - name: Commit only formatted QA changes and generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/visuals.js src/destination-vista.js tests/europa-crystal-canyon.test.mjs tests/browser/europa-surface-transition.spec.mjs index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(Europa): bundle natural ice fissures and visible orbital mist"
            git push origin HEAD:feat/alien-worlds-visual-identity-20261120
          fi
