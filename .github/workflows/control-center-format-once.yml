name: Format Control Center candidate once

on:
  push:
    branches:
      - feat/nova-control-center-20261109
    paths:
      - .github/workflows/control-center-format-once.yml
      - tests/control-center.behavior.test.mjs
      - tests/control-center.test.mjs
      - specs/control-center-observability.md

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format only candidate spec and tests
        run: |
          npx prettier --write tests/control-center.behavior.test.mjs tests/control-center.test.mjs specs/control-center-observability.md
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/control-center.behavior.test.mjs tests/control-center.test.mjs specs/control-center-observability.md
          if ! git diff --cached --quiet; then
            git commit -m "style(control-center): apply Prettier to candidate files"
            git push origin HEAD:feat/nova-control-center-20261109
          fi
