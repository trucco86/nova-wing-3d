name: Prepare FPS evidence QA
on:
  push:
    branches: [fix/fps-evidence-context-20261102]
    paths:
      - src/frame-audit.js
      - src/game.js
      - tests/frame-audit.test.mjs
      - tests/browser/device-fps-pause.spec.mjs
      - .github/workflows/fps-evidence-qa-prepare.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/fps-evidence-context-20261102
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format, build and run Node validation
        run: |
          npm run format
          npm run build
          npm run validate
      - name: Commit synchronized HTML
        run: |
          git add -- index.html src/frame-audit.js src/game.js tests/frame-audit.test.mjs tests/browser/device-fps-pause.spec.mjs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(qa): synchronize FPS evidence report and HTML'
            git push origin HEAD:fix/fps-evidence-context-20261102
          fi
