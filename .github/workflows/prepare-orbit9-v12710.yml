name: Prepare Orbit-9 playable release v1.27.10
on:
  push:
    branches: [feat/five-cats-orbit9-3d-prototype]
    paths: [.github/workflows/prepare-orbit9-v12710.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.27.10
      - run: npx prettier --write CHANGELOG.md releases/v1.27.10.md
      - run: npm run build
      - run: npm run build:check
      - run: npm run validate
      - name: Commit release version and bundle
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj index.html CHANGELOG.md releases/v1.27.10.md
          git commit -m "build(explore): publish isolated v1.27.10 candidate assets"
          git push origin HEAD:feat/five-cats-orbit9-3d-prototype
