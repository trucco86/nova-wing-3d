name: Sync cinematic QA generated bundle
on:
  push:
    branches: [integration/five-cats-opening-v12725-qa-20261030]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  sync:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Recreate bundle from source
        run: |
          npm run format
          npm run build
          npm run build:check
          npm run validate
      - name: Commit formatted QA spec and generated index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- index.html specs/cinematic-realtime-qa-v12725.md; then
            echo 'Bundle already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html specs/cinematic-realtime-qa-v12725.md
          git commit -m 'build(qa): sync cinematic real-time bundle'
          git push origin HEAD:integration/five-cats-opening-v12725-qa-20261030
          gh workflow run ci.yml --ref integration/five-cats-opening-v12725-qa-20261030
          gh workflow run cloudflare-preview.yml --ref integration/five-cats-opening-v12725-qa-20261030
