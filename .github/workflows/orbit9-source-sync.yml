name: One-shot Orbit-9 source synchronization
on:
  push:
    branches:
      - feat/orbit9-walk-and-gamepad-20261120
    paths:
      - .github/workflows/orbit9-source-sync.yml
permissions:
  contents: write
jobs:
  format-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format touched source and tests
        run: npx prettier --write src/orbit9-locomotion.js src/exploration-preview.js src/shell.html src/styles.css tests/orbit9-locomotion.test.mjs tests/browser/exploration-vertical-slice.spec.mjs
      - name: Regenerate synchronized single-file game
        run: npm run build
      - name: Validate sources and gait tests
        run: |
          npm run build:check
          node --test tests/orbit9-locomotion.test.mjs
      - name: Commit source synchronization and remove temporary workflow
        run: |
          git config user.name "Nova Wing QA Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/orbit9-locomotion.js src/exploration-preview.js src/shell.html src/styles.css tests/orbit9-locomotion.test.mjs tests/browser/exploration-vertical-slice.spec.mjs
          git rm .github/workflows/orbit9-source-sync.yml
          git diff --cached --quiet || git commit -m "chore(orbit9): format, rebuild and validate locomotion candidate"
          git push origin HEAD:feat/orbit9-walk-and-gamepad-20261120
