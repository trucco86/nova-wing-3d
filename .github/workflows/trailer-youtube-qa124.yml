name: QA124 | Nova Wing 60s YouTube 4K60
on:
  push:
    branches:
      - feat/qa124-youtube-trailer-4k60-20261113
    paths:
      - trailer/capture-youtube.mjs
      - .github/workflows/trailer-youtube-qa124.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nova-wing-trailer-qa124-${{ github.ref }}
  cancel-in-progress: true
jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NOVA_VISUAL_TEST: '1'
      TRAILER_FPS: '15'
    steps:
      - name: Checkout immutable game source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build latest real game engine and local WebGL fixture
        run: |
          npm run build
          node tools/visual-fixture.mjs
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Install FFmpeg for 4K encoding
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -version | head -n 1
      - name: Serve game locally without public deploy
        run: |
          (npm run dev > /tmp/nova-wing-youtube-server.log 2>&1 &)
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4173/__dynamic.html?sector=0 > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nova-wing-youtube-server.log
          exit 1
      - name: Film 12 genuine WebGL sequences and encode a 60s YouTube cut
        run: node trailer/capture-youtube.mjs
      - name: Verify 4K 60fps / 60s container and provenance
        run: |
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,avg_frame_rate -of json artifacts/nova-wing-trailer-youtube/nova-wing-youtube-4k60-60s.mp4
          node --input-type=module -e "import fs from 'node:fs';let d=JSON.parse(fs.readFileSync('artifacts/nova-wing-trailer-youtube/provenance.json'));if(d.scenes.length!==12||d.outputWidth!==3840||d.outputHeight!==2160||d.outputFps!==60||!d.upscaled||d.frames<750)process.exit(1)"
      - name: Upload YouTube cut and capture provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nova-wing-youtube-4k60-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/nova-wing-trailer-youtube/nova-wing-youtube-4k60-60s.mp4
            artifacts/nova-wing-trailer-youtube/provenance.json
