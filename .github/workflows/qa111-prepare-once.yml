name: QA111 prepare cinematic sound preview once
on:
  push:
    branches:
      - feat/qa111-cinematic-shot-plasma-audio-20261111
    paths:
      - .github/workflows/qa111-prepare-once.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Version, build and validate cinematic shots plus premium city
        run: |
          npm run release:prepare -- 1.27.111
          npm run format
          npm run build
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build(QA111): synchronize premium audio candidate 1.27.111"
            git push origin HEAD:feat/qa111-cinematic-shot-plasma-audio-20261111
          fi
          npm run validate
