name: QA102 premium city real WebGL and mobile acceptance
on:
  push:
    branches: [feat/qa102-premium-city-life-20261107]
    paths: [.github/workflows/qa102-browser-premium.yml]
permissions:
  contents: read
jobs:
  premium-city:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:check
      - run: npx playwright install chromium
      - name: Validate new details, independent motion, free flight and camera occlusion
        run: npx playwright test tests/browser/qa102-premium-city-life.spec.mjs tests/browser/qa101-camera-occlusion.spec.mjs tests/browser/qa100-upper-bridge-approach.spec.mjs --project=${{ matrix.project }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qa102-premium-metropolis-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
