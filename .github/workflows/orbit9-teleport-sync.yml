name: Orbit-9 teleport QA snapshot synchronization
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/orbit9-walk-and-gamepad-20261120
permissions:
  contents: write
jobs:
  synchronize:
    if: github.event.pull_request.head.ref == 'feat/orbit9-devastador-art-pass-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Rebuild QA screenshot fix
        run: |
          npx prettier --write src/exploration-preview.js tests/browser/orbit9-stage-art.spec.mjs
          npm run build
          npm run build:check
          node --test tests/orbit9-stage-art.test.mjs
      - name: Commit generated build and delete temporary workflow
        run: |
          git config user.name "Nova Wing QA Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/exploration-preview.js tests/browser/orbit9-stage-art.spec.mjs
          git rm .github/workflows/orbit9-teleport-sync.yml
          git diff --cached --quiet || git commit -m "chore(orbit9): synchronize deterministic QA teleport screenshots"
          git push origin HEAD:feat/orbit9-devastador-art-pass-20261120
