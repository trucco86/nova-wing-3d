name: Sync integrated DEV asteroid game bundle
on:
  push:
    branches:
      - integration/dev-all-priorities-20261028
    paths:
      - .github/workflows/sync-integrated-dev-asteroid.yml
permissions:
  contents: write
concurrency:
  group: sync-dev-asteroid-v127
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Rebuild integrated v1.27.0 and run all unit/contract validations
        run: |
          npm run format
          npm run build
          npm run validate
      - name: Publish synchronized assets only on integrated branch
        run: |
          git add -- src tests tools specs docs package.json package-lock.json CHANGELOG.md releases/v1.27.0.md ios/App/App.xcodeproj/project.pbxproj index.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(dev): restore asteroid stage runtime in unified v1.27.0'
          git push origin "HEAD:${GITHUB_REF_NAME}"
