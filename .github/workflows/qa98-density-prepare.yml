name: QA98 debris density rebuild and test
on:
  push:
    branches: [fix/stage1-falling-collisions-iss-v12798-20261107]
    paths: [.github/workflows/qa98-density-prepare.yml]
permissions:
  contents: write
jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/stage1-falling-collisions-iss-v12798-20261107
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format, regenerate and run Node release gate
        run: |
          npm run format
          npm run build
          npm run build:check
          npm run validate
          git diff --check
      - name: Update only QA98 generated HTML and tested sources
        run: |
          git add -- src/orbital-ascent-encounter.js tests/orbital-ascent-encounter.test.mjs specs/stage1-falling-iss-v12798.md index.html
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'polish(QA98): smooth random orbital debris density with regression'
          git push origin HEAD:fix/stage1-falling-collisions-iss-v12798-20261107
