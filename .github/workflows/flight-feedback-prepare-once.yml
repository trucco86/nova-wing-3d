name: Prepare slower orbital chase feedback (one-off)
on:
  push:
    branches: [feat/p0-sector-flight-orbit-dev-20261025]
    paths: ['.github/workflows/flight-feedback-prepare-once.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/game.js src/visuals.js src/route.js src/flight.js src/campaign.js tests/launch-pacing-and-fighters.test.mjs
      - run: npm run build
      - run: npm run validate
      - name: Commit generated build and remove temporary workflow
        run: |
          git rm .github/workflows/flight-feedback-prepare-once.yml
          git add src/game.js src/visuals.js src/route.js src/flight.js src/campaign.js tests/launch-pacing-and-fighters.test.mjs index.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(flight): prepare slower launch and flying enemy robot candidate'
          git push origin HEAD:refs/heads/feat/p0-sector-flight-orbit-dev-20261025
