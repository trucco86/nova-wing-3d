name: Prepare isolated shop and premium city candidate v1.27.47
# Retest v2 after DOM fake classList compatibility fix
on:
  push:
    branches:
      - fix/shop-intermission-city-polish-20261031
    paths:
      - .github/workflows/qa-prepare-shop-v12747.yml
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.27.47
      - run: npm run format
      - run: npm run build
      - run: npm run build:check
      - run: npm run lint
      - run: npm run test
      - run: npm run check:repo
      - name: Commit generated QA bundle only to its isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md releases/v1.27.47.md index.html src tests
          if ! git diff --cached --quiet; then
            git commit -m "build(qa): prepare v1.27.47 for shop isolation and premium city"
            git push origin HEAD:fix/shop-intermission-city-polish-20261031
          fi
