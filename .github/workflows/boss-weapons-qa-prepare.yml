name: One-shot Boss Weapon QA release preparation
on:
  push:
    branches: [feat/boss-weapon-readability-20261103]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.27.76
      - name: Write reviewed release documentation
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'CHANGELOG.md';
          let s = readFileSync(file, 'utf8');
          const old = '## 1.27.76 — Candidata em preparação\n\n- Candidata não homologada; preencher entregas e evidências antes da publicação.';
          const next = '## 1.27.76 — Boss Weapon Readability 1.0 · canhões e tiros legíveis (QA)\n\n- Dez identidades de cor para projéteis dos chefes, com rastros luminosos e cabeça maior, usando a mesma física, dano e velocidade de antes.\n- Bocais reais das duas baterias de cada chefe e do canhão emergencial: geometria mais marcada, aros, indicador de carga e flash a cada disparo real.\n- Destruir gerador desativa a arma; núcleo só acende depois que as duas baterias foram desativadas. Muzzle, flash e posição de tiro compartilham a mesma transformada física.\n- Contraste das famílias de projétil sem reescrever a IA nem perder a estratégia de flancos, radar e pontos fracos já aprovada.\n- Testes Node de bocais e pool, imagens reais de combate via Playwright desktop/mobile, especificação P1 por chefe; QA isolada, sem merge de produção.';
          if (!s.includes(old)) throw new Error('Missing changelog heading placeholder');
          writeFileSync(file, s.replace(old, next));
          writeFileSync('releases/v1.27.76.md', '## Nova Wing 3D v1.27.76 — candidata QA\n\n- Canhões dos chefes com bocais físicos maiores, anéis coloridos, preparação crescente e flash na saída real do tiro.\n- Projéteis com rastro e cor distintiva para os dez chefes, mantendo o dano, acerto, velocidade e orçamento de tiros aprovados.\n- Destruição das baterias remove seu disparo e carregamento; canhão de emergência central só age após perder ambos os geradores.\n- Nova especificação para ataques ainda mais distintos por chefe, inspirada em leitura por quadrantes de Panzer Dragoon Saga (sem copiar conteúdo).\n- Regressões Node e Playwright; falta inspeção física em celular e validação de desempenho Alto/Médio.\n\n**Somente QA. Não publicar em produção antes de homologação.**\n');
          NODE
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Commit generated artifacts
        run: |
          git config user.name 'nova-wing-qa-bot'
          git config user.email 'nova-wing-qa-bot@users.noreply.github.com'
          git add package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj index.html CHANGELOG.md releases/v1.27.76.md src/boss-weapon-vfx.js src/hostile-projectile-pool.js src/bosses.js src/game.js tests/boss-weapon-vfx.test.mjs tests/hostile-projectile-pool.test.mjs tests/browser/boss-weapon-readability.spec.mjs specs/boss-weapon-readability-v12776.md
          git commit -m 'chore(release): prepare boss weapon readability v1.27.76'
          git push origin HEAD:feat/boss-weapon-readability-20261103
