name: Stage 04 GPU freeze source and QA sync
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/orbit9-devastador-art-pass-20261120
permissions:
  contents: write
jobs:
  sync:
    if: github.event.pull_request.head.ref == 'feat/devastador-reactor-integrated-access-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format and rebuild reactor access stage
        run: |
          npx prettier --write src/game.js src/exploration-preview.js tests/browser/exploration-vertical-slice.spec.mjs tests/browser/five-cats-gallery.spec.mjs tests/browser/game.spec.mjs
          npm run build
          npm run build:check
          node --test tests/devastador-reactor-access.test.mjs tests/orbit9-locomotion.test.mjs
      - name: Commit generated release and delete temporary helper
        run: |
          git config user.name "Nova Wing QA Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/game.js src/exploration-preview.js tests/browser/exploration-vertical-slice.spec.mjs tests/browser/five-cats-gallery.spec.mjs tests/browser/game.spec.mjs
          git rm .github/workflows/stage4-reactor-gpu-sync.yml
          git diff --cached --quiet || git commit -m "chore(stage4): synchronize reactor GPU freeze and browser regressions"
          git push origin HEAD:feat/devastador-reactor-integrated-access-20261120
