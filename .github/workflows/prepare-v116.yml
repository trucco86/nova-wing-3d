name: Prepare v1.16 web build

on:
  push:
    branches:
      - feat/web-v1-16-i18n-aim-pickup

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format and compile from editable source only
        run: |
          npm run format
          npm run build
      - name: Commit deterministic build and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests specs package.json package-lock.json CHANGELOG.md releases index.html
          if ! git diff --cached --quiet; then
            git commit -m "build(v1.16): format sources and generate synchronized HTML"
            git push origin HEAD:refs/heads/feat/web-v1-16-i18n-aim-pickup
          fi
