name: Prepare QA108 candidate once

on:
  push:
    branches:
      - fix/qa108-visible-debris-collision-20261110
    paths:
      - .github/workflows/qa108-release-once.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare versioned QA108 bundle and source formatting
        run: |
          npm run release:prepare -- 1.27.108
          cat > releases/v1.27.108.md <<'EOF'
          ## Nova Wing 3D v1.27.108 | QA108 candidata

          - Corrige colisores invisíveis dos destroços urbanos quando a malha ou um de seus grupos ancestrais está oculto.
          - Mantém colisões somente para as partes realmente visíveis dos objetos que caem.
          - Testes QA108 cobrem invisibilidade em nós descendentes e grupos pais, além de restauração de colisão sem obstáculos fantasmas.
          - Não altera arte, física de outros setores, controles ou movimentação já aprovada da QA107.

          **Pendências:** CI FULL, quatro shards Playwright e homologação visual fase 1. A candidata está empilhada sobre QA107 e não pode ir para produção antes da homologação da base.
          EOF
          node --input-type=module -e 'import{readFileSync,writeFileSync}from"node:fs";const p="CHANGELOG.md";const s=readFileSync(p,"utf8").replace("- Candidata não homologada; preencher entregas e evidências antes da publicação.","- QA108: colisores dos destroços usam apenas malhas visíveis na hierarquia da cena; testes de regressão adicionados. CI FULL e homologação pendentes.");writeFileSync(p,s)'
          npm run format
          npm run build
          npm run validate
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build(QA108): prepare versioned candidate and validated generated bundle"
            git push origin HEAD:fix/qa108-visible-debris-collision-20261110
          fi
