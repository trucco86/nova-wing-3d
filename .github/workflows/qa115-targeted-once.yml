name: QA115 targeted audio and WebGL quality once
on:
  push:
    branches:
      - feat/qa115-refined-charge-and-city-detail-20261112
    paths:
      - .github/workflows/qa115-targeted-once.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build:check
      - run: npm run build
      - name: Real original-audio RMS, 3D pilot and mobile Europa camera
        run: npx playwright test tests/browser/immersive-audio.spec.mjs tests/browser/qa113-premium-pbr-performance.spec.mjs tests/browser/qa114-silhouette-performance.spec.mjs tests/browser/europa-clear-arena.spec.mjs --project=desktop --project=mobile --workers=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qa115-audio-graphics-evidence
          path: |
            test-results/
            playwright-report/

# Rerun after reducing charge gain and optimizing invisible structural faces.
