name: Prepare QA183 boss counterplay candidate
on:
  push:
    branches: [feat/qa183-boss-counter-rpg-tuning]
    paths:
      - .github/workflows/prepare-qa183-counter.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare version 1.27.159
        run: npm run release:prepare -- 1.27.159
      - name: Format scope
        run: |
          npx prettier --write src/game.js tests/qa183-boss-counter-rpg.test.mjs CHANGELOG.md releases/v1.27.159.md
      - run: npm run build
      - run: npm run build:check
      - run: npm run validate
      - name: Commit reproducible preview artifact
        run: |
          if git diff --quiet; then
            echo "Already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj index.html src/game.js tests/qa183-boss-counter-rpg.test.mjs CHANGELOG.md releases/v1.27.159.md
          git commit -m "build(qa183): version and validate boss counterplay candidate"
          git push origin HEAD:feat/qa183-boss-counter-rpg-tuning
