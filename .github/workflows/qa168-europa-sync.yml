name: QA168 Europa format and bundle (temporary)
on:
  push:
    branches:
      - feat/alien-worlds-visual-identity-20261120
    paths:
      - .github/workflows/qa168-europa-sync.yml
permissions:
  contents: write
jobs:
  synchronize:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format Europa sources and rebuild browser bundle
        run: |
          npm run format
          npm run build
          npm run build:check
          npm run validate
      - name: Commit only QA Europa changes
        run: |
          git add -- index.html src/europa-descent.js src/game.js src/europa-ice-cavern.js tests/europa-ice-cavern-and-enemies.test.mjs tests/browser/qa168-alien-worlds.spec.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "QA Europa bundle already synchronized"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(europa): sync QA arrival boost and sculpted cave'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
