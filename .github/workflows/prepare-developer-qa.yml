name: Prepare developer QA candidate
on:
  push:
    branches:
      - feat/dev-qa-scenarios-mission-menu-20261028
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref_name == 'feat/dev-qa-scenarios-mission-menu-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare v1.27.5 version and all platform metadata
        run: npm run release:prepare -- 1.27.5
      - name: Format all touched sources and documentation
        run: |
          npx prettier --write src/game.js src/shell.html src/styles.css src/developer-mode.js src/i18n.js tests/harness.mjs tests/developer-mode.test.mjs tests/developer-scenarios.test.mjs tests/browser/developer-scenarios.spec.mjs CHANGELOG.md releases/v1.27.5.md
      - run: npm run build
      - run: npm run build:check
      - run: npm run validate
      - name: Commit reproducible candidate
        run: |
          if git diff --quiet; then
            echo "Candidate is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj src/game.js src/shell.html src/styles.css src/developer-mode.js src/i18n.js tests/harness.mjs tests/developer-mode.test.mjs tests/developer-scenarios.test.mjs tests/browser/developer-scenarios.spec.mjs CHANGELOG.md releases/v1.27.5.md index.html
          git commit -m "build(dev): synchronize Nova Wing v1.27.5 QA scenario candidate"
          git push origin HEAD:feat/dev-qa-scenarios-mission-menu-20261028
