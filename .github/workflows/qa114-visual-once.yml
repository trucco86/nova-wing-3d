name: QA114 targeted real WebGL visual once
on:
  push:
    branches:
      - feat/qa114-city40-cinematic-silhouette-20261112
    paths:
      - .github/workflows/qa114-visual-once.yml
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build:check
      - run: npm run build
      - name: Compare QA112, QA113 and QA114 in real WebGL on desktop and portrait
        run: npx playwright test tests/browser/qa112-graphics40-ab.spec.mjs tests/browser/qa113-premium-pbr-performance.spec.mjs tests/browser/qa114-silhouette-performance.spec.mjs --project=desktop --project=mobile --workers=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qa114-visual-targeted-evidence
          path: |
            test-results/
            playwright-report/
