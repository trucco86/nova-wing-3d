name: One-time stage1 solid collision candidate
on:
  pull_request:
  push:
    branches: [feat/mars-storm-moons-warp-exit]
    paths:
      - .github/workflows/city-solid-collision-candidate.yml
permissions:
  contents: write
jobs:
  synchronize:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/mars-storm-moons-warp-exit
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.27.68
      - name: Document verified fix and review gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          notes=Path("releases/v1.27.68.md")
          notes.write_text("""## Nova Wing 3D v1.27.68 — Physical Ship-vs-City Collision Candidate

          - Corrigido: o impacto nas estruturas da cidade não pode mais causar somente dano e deixar a nave atravessar o modelo intacto.
          - Novo resolvedor de colisão contínua por deslocamento relativo à geometria visual, com deflexão lateral ou vertical; respeita centro da nave e limites da avenida.
          - Outdoors caindo, hovercars, fachadas e maglev pendurado passam a ter colisores físicos inclusive durante movimento/queda.
          - Antigos obstacles de fase 1 (gantry/reactor) deixam de ter somente impacto de dano e passam a impedir atravessamento.
          - Corrimãos e limites laterais da avenida (x=±47) impedem que as asas da nave entrem em prédios e guardrails (limite do centro = ±36).
          - Esquiva do robô, invulnerabilidade temporária e giro da nave não desabilitam a física de colisão; apenas alteram cálculo de dano.
          - Testes de regressão do posicionamento físico após impacto, geometria em movimento, 30/60/120 FPS, dash com tunneling, bloqueio lateral, cenário ativo e render WebGL.

          **Apenas QA:** browser screenshots, FPS físico, aprovação visual e jogo em mobile pendentes; nenhum merge ou produção autorizado.
          """)
          ch=Path("CHANGELOG.md")
          s=ch.read_text()
          s=s.replace("## 1.27.68 — Candidata em preparação\n\n- Candidata não homologada; preencher entregas e evidências antes da publicação.",
            "## 1.27.68 — Candidata em preparação\n\n- Fase 1: colisão sólida da nave com destroços, estruturas, obstáculos e guardrails; CCD com deflexão real, mantendo i-frames apenas para dano. Browser/QA visual pendente.")
          ch.write_text(s)
          PY
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - run: npm run build:check
      - name: Commit generated distribution only after all checks pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md index.html package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj releases/v1.27.68.md specs/city-phase1-premium-destruction.md src/city-collision.js src/city-catastrophe.js src/visuals.js src/game.js tests/city-solid-collision.test.mjs tests/browser/city-premium-destruction.spec.mjs
          if ! git diff --cached --quiet; then
            git commit -m "build(city): prepare reproducible v1.27.68 solid collision QA candidate"
            git fetch origin feat/mars-storm-moons-warp-exit
            git rebase origin/feat/mars-storm-moons-warp-exit
            git push origin HEAD:feat/mars-storm-moons-warp-exit
          fi
