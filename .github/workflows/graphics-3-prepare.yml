name: Graphics 3 QA release preparation
on:
  push:
    branches:
      - feat/graphics-3-premium-city-20261030
permissions:
  contents: write
concurrency:
  group: graphics-3-qa-prepare
  cancel-in-progress: true
jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[graphics3-built]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Version, build, format and structural validation
        run: |
          npm run release:prepare -- 1.27.27
          npm run format
          npm run build
          npm run validate
      - name: Record actual QA scope, not acceptance
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const changelog = 'CHANGELOG.md';
          const original = readFileSync(changelog, 'utf8');
          const placeholder = '## 1.27.27 — Candidata em preparação\n\n- Candidata não homologada; preencher entregas e evidências antes da publicação.';
          if (!original.includes(placeholder)) throw new Error('Changelog heading mismatch');
          const update = '## 1.27.27 — Graphics 3.0 Premium Detail (QA)\n\n- Alto: detalhes PBR e instanciados nas fachadas e coberturas da cidade, nas três naves do jogador e na nave-mãe.\n- Médio mantém o orçamento anterior, e Automático continua a usar perfil adaptativo.\n- Visuais decorativos sem alterações em colisões, física, saves, ranking ou conteúdo de gameplay.\n- Etapa de arte procedural, não igual à imagem conceitual; validação de FPS e homologação humana pendentes.';
          writeFileSync(changelog, original.replace(placeholder, update));
          writeFileSync('releases/v1.27.27.md',
            '## Nova Wing v1.27.27 — Graphics 3.0 (QA isolado)\n\n' +
            '- Mais detalhes no perfil Alto: city skyline, starfighter micro-panels e flagship.\n' +
            '- Geometria instanciada; sem novas hitboxes, texturas externas ou alterações em saves.\n' +
            '- Comparação Alto/Médio, FPS mobile, Playwright e aceite visual são gates antes da promoção.\n' +
            '- O alvo de qualidade da imagem-conceito ainda demanda modelos e materiais autorais.\n\n' +
            '**Não promover DEV, HML ou produção sem validação.**\n');
          NODE
          npm run format
          npm run build
          npm run validate
      - name: Commit deterministic QA bundle and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/graphics-3-prepare.yml
          git add -A
          git commit -m "chore(graphics3): release 1.27.27 bundle and formatting [graphics3-built]"
          git push
