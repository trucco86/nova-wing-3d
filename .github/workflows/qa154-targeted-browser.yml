name: QA154 targeted mobile browser
on:
  push:
    branches:
      - fix/qa154-cockpit-hud-victory-radio-20261115
      - feat/qa153-stage-score-and-cat-loot-20261115
    paths:
      - src/styles.css
      - src/shell.html
      - src/game.js
      - src/warp-departure.js
      - tests/browser/qa154-cockpit-radio-layout.spec.mjs
      - tests/warp-departure.test.mjs
      - .github/workflows/qa154-targeted-browser.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa154-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Build sources for isolated QA tests
        run: npm run build
      - name: QA154 cockpit, radio and hangar mobile regression
        run: npm run test:browser -- --project=mobile --grep QA154
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qa154-targeted-browser-evidence
          path: |
            test-results/
            playwright-report/
            artifacts/
