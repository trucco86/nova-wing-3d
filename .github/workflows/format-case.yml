name: Format case documentation once

on:
  push:
    branches:
      - docs/agentic-sdlc-case-professional-20261021

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply the repository Prettier rules to the case files
        run: npx prettier --write README.md docs/case docs/HARNESS.md docs/APRENDIZADOS.md
      - name: Commit formatted documentation only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/case docs/HARNESS.md docs/APRENDIZADOS.md
          if ! git diff --cached --quiet; then
            git commit -m "style(case): apply Prettier to case documentation"
            git push origin HEAD:refs/heads/docs/agentic-sdlc-case-professional-20261021
          fi
