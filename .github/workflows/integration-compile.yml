name: Compile isolated Nova Wing integration bundle
on:
  push:
    branches: ['integration/physics-rpg-orbit9-v12712-20261028']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nova-integration-compiler-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-bundle:
    if: github.repository == 'trucco86/nova-wing-3d' && github.ref == 'refs/heads/integration/physics-rpg-orbit9-v12712-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: integration/physics-rpg-orbit9-v12712-20261028
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build deterministic WebGL bundle
        run: npm run build
      - name: Commit only the generated index on the isolated branch
        run: |
          git add index.html
          if git diff --cached --quiet; then
            echo 'Bundle already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(integration): regenerate WebGL bundle from combined sources'
          git push origin HEAD:refs/heads/integration/physics-rpg-orbit9-v12712-20261028
