name: Prepare ten-boss v1.27.8 gameplay candidate
on:
  push:
    branches: [feat/all-boss-signatures-v1278]
    paths:
      - .github/workflows/prepare-ten-bosses.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.27.8
      - name: Normalize source and test formatting
        run: |
          npx prettier --write src/boss-signature.js src/bosses.js tests/boss-signature.test.mjs tests/boss-complete-roster.test.mjs releases/v1.27.8.md CHANGELOG.md
      - run: npm run build
      - run: npm run build:check
      - run: npm run validate
      - name: Commit synchronized source, versions and HTML
        run: |
          if git diff --quiet; then
            echo "Nothing to synchronize"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj index.html src/boss-signature.js src/bosses.js tests/boss-signature.test.mjs tests/boss-complete-roster.test.mjs releases/v1.27.8.md CHANGELOG.md
          git commit -m "build(dev): synchronize ten-boss v1.27.8 candidate"
          git push origin HEAD:feat/all-boss-signatures-v1278
