name: Prepare asteroid preview candidate
on:
  push:
    branches:
      - feat/p1-stage-journey-foundation-20261027
permissions:
  contents: write
concurrency:
  group: asteroid-release-prep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare v1.24.20 candidate and validate
        run: |
          npm run release:prepare -- 1.24.20
          npm run format
          npm run build
          npm run validate
      - name: Commit verified candidate without bypassing CI
        run: |
          git add -- package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md releases/v1.24.20.md index.html src tests
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release(web): prepare v1.24.20 asteroid journey candidate'
          git push origin "HEAD:${GITHUB_REF_NAME}"
