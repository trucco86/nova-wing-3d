name: Prepare mecha DEV parity preview (one-off)
on:
  push:
    branches: [feat/mecha-flight-dynamics-dev-20261025]
    paths: ['.github/workflows/mecha-prepare-once.yml']
permissions:
  contents: write
concurrency:
  group: mecha-flight-prepare
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/visuals.js src/game.js tests/mecha-design.test.mjs tests/browser/mecha-visual.spec.mjs
      - run: npm run build
      - run: npm run validate
      - name: Commit build and formatted sources; remove temporary workflow
        run: |
          git rm .github/workflows/mecha-prepare-once.yml
          git add src/visuals.js src/game.js tests/mecha-design.test.mjs tests/browser/mecha-visual.spec.mjs index.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(mecha): prepare isolated DEV preview and remove one-off automation'
          git push origin HEAD:refs/heads/feat/mecha-flight-dynamics-dev-20261025
