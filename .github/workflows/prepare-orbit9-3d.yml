name: Build and validate Orbit-9 playable QA slice
on:
  push:
    branches: [feat/five-cats-orbit9-3d-prototype]
    paths: [.github/workflows/prepare-orbit9-3d.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format standalone exploration and browser QA
        run: |
          npx prettier --write src/exploration-preview.js src/main.js src/shell.html src/styles.css tests/browser/exploration-vertical-slice.spec.mjs docs/design/FIVE-CATS-QUEST-FOUNDATION.md releases/v1.27.9.md
      - run: npm run build
      - run: npm run build:check
      - run: npm run validate
      - name: Commit generated web artifact and formatted files
        run: |
          if git diff --quiet; then
            echo "No generated drift"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/exploration-preview.js src/main.js src/shell.html src/styles.css tests/browser/exploration-vertical-slice.spec.mjs docs/design/FIVE-CATS-QUEST-FOUNDATION.md releases/v1.27.9.md
          git commit -m "build(explore): sync playable Orbit-9 QA prototype"
          git push origin HEAD:feat/five-cats-orbit9-3d-prototype
