name: Stage 04 deterministic portrait QA camera sync
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/orbit9-devastador-art-pass-20261120
permissions:
  contents: write
jobs:
  sync:
    if: github.event.pull_request.head.ref == 'feat/devastador-reactor-integrated-access-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build and validate viewport orientation sync
        run: |
          npx prettier --write src/exploration-preview.js
          npm run build
          npm run build:check
          node --test tests/orbit9-stage-art.test.mjs tests/orbit9-camera-and-dialogue.test.mjs tests/devastador-reactor-access.test.mjs
          npx eslint src/exploration-preview.js
      - name: Commit generated build and self-remove
        run: |
          git config user.name "Nova Wing QA Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/exploration-preview.js
          git rm .github/workflows/stage4-portrait-teleport-sync.yml
          git diff --cached --quiet || git commit -m "chore(stage4): sync deterministic portrait reactor QA"
          git push origin HEAD:feat/devastador-reactor-integrated-access-20261120
