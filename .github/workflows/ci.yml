name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # New PR commits supersede stale browser checks; no redundant native builds.
  # Main deliveries remain serialized to prevent stale Pages deployments.
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'delivery' }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOVA_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Verify the checked-in distribution before a build can overwrite it.
      - run: npm run build:check
      - run: npm run build
      - run: npm run validate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quality-evidence
          path: artifacts/
  browser-shard:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    # Keep all WebGL/SwiftShader assertions: six independent shards reduce the
    # slowest release gate without skipping expensive browser scenarios.
    timeout-minutes: 40
    env:
      NOVA_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      NOVA_BROWSER_SHARD: ${{ matrix.shard }}/6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Keep the browser gate strict; avoid repeating apt dependency installation on each
      # hosted runner. Missing runtime libraries still fail the real Playwright tests.
      - run: npx playwright install chromium
      # The quality job already ran format, lint, Node tests, invariants and
      # reproducible build. Never re-run that full suite in each browser shard.
      - run: npm run build:check
      # Rebuild after verifying committed HTML: existing security contract retained.
      - run: npm run build
      - name: Run browser-only shard (full release assertions preserved)
        run: npm run test:browser -- --shard="$NOVA_BROWSER_SHARD"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-evidence-${{ matrix.shard }}
          path: |
            artifacts/
            test-results/
            playwright-report/
  browser:
    # Branch protection requires this stable check name.
    # Success means every browser shard and the quality gate succeeded.
    if: ${{ always() }}
    needs: [quality, browser-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify all browser shards and quality
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SHARDS_RESULT: ${{ needs.browser-shard.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$SHARDS_RESULT" = "success"
  android:
    # Native builds are opt-in. Web-first development never requires store accounts.
    if: ${{ vars.NOVA_BUILD_NATIVE == 'true' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Install Android API 36
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - run: npm run android:sync
      - name: Compile installable debug APK and unsigned release AAB
        run: |
          set -o pipefail
          mkdir -p artifacts/android
          (cd android && ./gradlew --no-daemon assembleDebug bundleRelease) | tee artifacts/android/gradle.log
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk assets/public/index.html | cmp - android-web/index.html
          unzip -p android/app/build/outputs/bundle/release/app-release.aab base/assets/public/index.html | cmp - android-web/index.html
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/bundle/release/app-release.aab > artifacts/android/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-builds
          path: |
            artifacts/android/
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab

  ios:
    # Re-enable when the web game is accepted and native work resumes.
    if: ${{ vars.NOVA_BUILD_NATIVE == 'true' }}
    needs: quality
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: xcodebuild -version
      - run: npm ci
      - name: Build iOS simulator app
        run: |
          set -o pipefail
          mkdir -p artifacts/ios
          npm run ios:build 2>&1 | tee artifacts/ios/xcodebuild.log
          ditto -c -k --keepParent artifacts/ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app artifacts/ios/Nova-Wing-iOS-Simulator.zip
      - name: Install and launch in iPhone simulator
        run: npm run ios:smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ios-simulator
          path: |
            artifacts/ios/*.zip
            artifacts/ios/*.png
            artifacts/ios/*.json
            artifacts/ios/*.log

  delivery-scope:
    # GitHub Pages is a public publication. Keep full CI on every push, but
    # publish only when the files copied into public-site actually changed.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      deploy: ${{ steps.evaluate.outputs.deploy }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Detect published-site changes (fail open on unknown history)
        id: evaluate
        env:
          NOVA_BEFORE_SHA: ${{ github.event.before }}
        run: node tools/deployment-scope.mjs

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.delivery-scope.outputs.deploy == 'true'
    needs: [browser, delivery-scope]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Prepare public files
        run: |
          mkdir public-site
          cp index.html .nojekyll LICENSE docs/THREE-LICENSE.txt public-site/
          mkdir -p public-site/control-center
          cp docs/control-center/index.html public-site/control-center/index.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: public-site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  production-smoke:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: pages
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Browser smoke on published production
        env:
          NOVA_PRODUCTION_URL: https://trucco86.github.io/nova-wing-3d/
        run: node tools/production-smoke.mjs

  production-checkpoint:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: production-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Record successful production SHA as immutable checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Never overwrite a checkpoint. A successful browser smoke is required.
          tag="production-good-$SHA"
          if gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Checkpoint already exists"
          else
            gh api "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$SHA" >/dev/null
            echo "Recorded healthy production: $tag"
          fi

  production-rollback:
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.pages.result == 'success' && needs.production-smoke.result == 'failure' }}
    needs: [pages, production-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Select last proven healthy production version
        env:
          FAILED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$FAILED_SHA" || { echo "Main advanced; skip stale rollback"; exit 1; }
          previous=""
          # Checkpoints are created only after successful production browser smoke.
          # GitHub's ref update is intentionally never used: checkpoints are immutable.
          while read -r tag; do
            sha=$(git rev-list -n 1 "$tag")
            if [ "$sha" != "$FAILED_SHA" ] && git merge-base --is-ancestor "$sha" "$FAILED_SHA"; then
              previous="$sha"
              echo "Healthy rollback checkpoint: $tag ($sha)"
              break
            fi
          done < <(git tag -l 'production-good-*' --sort=-creatordate)
          test -n "$previous" || { echo "No verified healthy checkpoint; cannot safely roll back"; exit 1; }
          git checkout --detach "$previous"
          test -f index.html && test -f docs/control-center/index.html
      - name: Prepare previous static build
        run: |
          set -euo pipefail
          mkdir -p public-site/control-center
          cp index.html .nojekyll LICENSE docs/THREE-LICENSE.txt public-site/
          cp docs/control-center/index.html public-site/control-center/index.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: public-site
      - name: Restore previous GitHub Pages version
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  release:
    # Skipped native jobs must not block a successful web-only release.
    if: >-
      ${{ always() && github.ref == 'refs/heads/main'
          && github.event_name != 'pull_request'
          && needs.production-checkpoint.result == 'success'
          && (vars.NOVA_BUILD_NATIVE != 'true'
              || (needs.android.result == 'success' && needs.ios.result == 'success')) }}
    needs: [production-checkpoint, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: vars.NOVA_BUILD_NATIVE == 'true'
        with:
          name: android-builds
          path: artifacts/native-release
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserving it."
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Nova Wing 3D $tag" --notes-file "releases/$tag.md"
          fi
          if [ "$(node -p "require('./package.json').releaseChannel || 'all'")" = "web" ]; then
            echo "Web validation release: native packages remain CI evidence only."
            exit 0
          fi
          mkdir -p artifacts/release-android
          cp artifacts/native-release/android/app/build/outputs/apk/debug/app-debug.apk "artifacts/release-android/Nova-Wing-$tag-debug.apk"
          cp artifacts/native-release/android/app/build/outputs/bundle/release/app-release.aab "artifacts/release-android/Nova-Wing-$tag-unsigned.aab"
          (cd artifacts/release-android && sha256sum *.apk *.aab) > "artifacts/release-android/Nova-Wing-$tag-Android-SHA256SUMS.txt"
          for artifact in artifacts/release-android/*; do
            name=$(basename "$artifact")
            if ! gh release view "$tag" --json assets --jq '.assets[].name' | rg --fixed-strings --line-regexp --quiet "$name"; then
              gh release upload "$tag" "$artifact"
            fi
          done
