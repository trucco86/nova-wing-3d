name: Format Saturn Omega QA Docs
on:
  push:
    branches: [feat/nasa-saturn-omega-hunt-20261102]
    paths:
      - .github/workflows/saturn-docs-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/nasa-saturn-omega-hunt-20261102
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format docs and verify unchanged compiled source
        run: |
          npx prettier --write specs/saturn-omega-realism-v12772.md docs/PLANET-REALISM-GUIDELINES.md CHANGELOG.md
          npm run format:check
          npm run build:check
      - name: Commit formatted acceptance criteria
        run: |
          git add -- specs/saturn-omega-realism-v12772.md docs/PLANET-REALISM-GUIDELINES.md CHANGELOG.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'docs(qa): format Saturn NASA and Omega release guidance'
            git push origin HEAD:feat/nasa-saturn-omega-hunt-20261102
          fi
