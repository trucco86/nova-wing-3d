name: Prepare v1.24.10 HUD edge candidate
on:
  push:
    branches: [feat/p0-hud-impact-subboss-edge-20261025]
    paths: ['.github/workflows/p79-release-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.24.10
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Commit release metadata, never workflow edits
        run: |
          git restore --worktree .github/workflows
          git add -A -- . ':!.github/workflows/**'
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(release): prepare v1.24.10 center-safe HUD candidate'
            git push origin HEAD:refs/heads/feat/p0-hud-impact-subboss-edge-20261025
          fi