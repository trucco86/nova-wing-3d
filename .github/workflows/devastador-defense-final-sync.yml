name: Stage 04 reactor defense final sync and QA build
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/orbit9-devastador-art-pass-20261120
permissions:
  contents: write
jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feat/devastador-reactor-integrated-access-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Reformat and synchronize current QA gameplay build
        run: |
          npx prettier --write src/audio-cues.js src/game.js src/main.js src/devastador-grand-hall.js src/devastador-sabotage.js src/devastador-reactor-defense.js tests/devastador-reactor-defense.test.mjs tests/browser/devastador-reactor-defense.spec.mjs
          npm run build
          npm run build:check
          npm run validate
      - name: Commit current branch without losing parallel changes
        run: |
          git config user.name "Nova Wing QA Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/audio-cues.js src/game.js src/main.js src/devastador-grand-hall.js src/devastador-sabotage.js src/devastador-reactor-defense.js tests/devastador-reactor-defense.test.mjs tests/browser/devastador-reactor-defense.spec.mjs
          git rm .github/workflows/devastador-audio-compat-sync.yml .github/workflows/devastador-defense-final-sync.yml
          git diff --cached --quiet || git commit -m "chore(stage4): synchronize reactor combat and QA visual evidence, full tests green"
          git pull --rebase origin feat/devastador-reactor-integrated-access-20261120
          npm run build:check
          git push origin HEAD:feat/devastador-reactor-integrated-access-20261120
