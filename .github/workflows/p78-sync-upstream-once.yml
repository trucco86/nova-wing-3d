name: Sync P78 with corrected mobile controls
on:
  push:
    branches: [feat/p0-hud-alert-rail-pause-controls-20261025]
    paths: ['.github/workflows/p78-sync-upstream-once.yml']
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Merge P77 corrections without replacing newer HUD code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin feat/p0-mobile-boss-thumb-ship-details-20261025
          git merge --no-ff --no-edit -X ours origin/feat/p0-mobile-boss-thumb-ship-details-20261025
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Commit generated files and push updated ancestry
        run: |
          git restore --worktree .github/workflows
          git add -A -- . ':!.github/workflows/**'
          if ! git diff --cached --quiet; then
            git commit -m 'build: synchronize P78 HUD with P77 scanner fix'
          fi
          git push origin HEAD:refs/heads/feat/p0-hud-alert-rail-pause-controls-20261025