name: QA184 mobile HUD source-sync and focused viewport verification
on:
  push:
    branches:
      - integration/qa178-europa-premium-all-improvements-20261122
permissions:
  contents: write
concurrency:
  group: qa184-mobile-hud-fix
  cancel-in-progress: false
jobs:
  normalize-and-mobile-smoke:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/qa178-europa-premium-all-improvements-20261122
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format and regenerate game HTML
        run: |
          npm run format
          npm run build
          npm run build:check
          npm run format:check
      - name: Save deterministic browser bundle to PR branch only
        run: |
          git add -- src/styles.css index.html
          if ! git diff --cached --quiet; then
            git -c user.name='nova-wing-qa-bot' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(QA184): sync narrow-screen boss HUD build'
            git push origin HEAD:refs/heads/integration/qa178-europa-premium-all-improvements-20261122
          fi
      - run: npx playwright install --with-deps chromium
      - name: Mobile priority, small-phone HUD and reactor boss HUD
        run: npx playwright test tests/browser/mobile-alert-priority.spec.mjs tests/browser/mobile-hud-audit.spec.mjs tests/browser/reactor-hud-lanes.spec.mjs --project=mobile --workers=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa184-mobile-hud-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
