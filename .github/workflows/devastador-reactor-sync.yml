name: Stage 04 integrated reactor one-shot QA preparation
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/orbit9-devastador-art-pass-20261120
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'feat/devastador-reactor-integrated-access-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format and validate embedded reactor stage
        run: |
          npx prettier --write src/devastador-reactor-access.js src/exploration-preview.js src/game.js src/main.js src/shell.html tests/devastador-reactor-access.test.mjs tests/browser/exploration-vertical-slice.spec.mjs tests/browser/orbit9-stage-art.spec.mjs docs/qa/devastador-reactor-integrated-stage-20261120.md releases/v1.27.158.md CHANGELOG.md package.json package-lock.json
          npm run build
          npm run build:check
          node --test tests/devastador-reactor-access.test.mjs tests/orbit9-locomotion.test.mjs tests/orbit9-stage-art.test.mjs
          npx eslint src/devastador-reactor-access.js src/exploration-preview.js src/game.js src/main.js
      - name: Commit synchronized build and remove one-shot workflow
        run: |
          git config user.name "Nova Wing QA Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/devastador-reactor-access.js src/exploration-preview.js src/game.js src/main.js src/shell.html tests/devastador-reactor-access.test.mjs tests/browser/exploration-vertical-slice.spec.mjs tests/browser/orbit9-stage-art.spec.mjs docs/qa/devastador-reactor-integrated-stage-20261120.md releases/v1.27.158.md CHANGELOG.md package.json package-lock.json
          git rm .github/workflows/devastador-reactor-sync.yml
          git diff --cached --quiet || git commit -m "chore(stage4): synchronize integrated reactor QA build and sources"
          git push origin HEAD:feat/devastador-reactor-integrated-access-20261120
