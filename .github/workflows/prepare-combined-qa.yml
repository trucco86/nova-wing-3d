name: Prepare Nova Wing v1.27.11 combined QA preview
on:
  push:
    branches: [feat/nova-wing-combined-adlc-preview]
    paths: [.github/workflows/prepare-combined-qa.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.27.11
      - name: Format newly combined sources and release
        run: |
          npx prettier --write src/exploration-quests.js src/exploration-preview.js src/main.js src/shell.html src/styles.css tests/exploration-quests.test.mjs tests/browser/exploration-vertical-slice.spec.mjs docs/design/FIVE-CATS-QUEST-FOUNDATION.md releases/v1.27.11.md CHANGELOG.md
      - run: npm run build
      - run: npm run build:check
      - run: npm run validate
      - name: Commit generated bundle and version
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj index.html src/exploration-quests.js src/exploration-preview.js src/main.js src/shell.html src/styles.css tests/exploration-quests.test.mjs tests/browser/exploration-vertical-slice.spec.mjs docs/design/FIVE-CATS-QUEST-FOUNDATION.md releases/v1.27.11.md CHANGELOG.md
          git commit -m "build(dev): compose v1.27.11 AI SDLC game experience candidate"
          git push origin HEAD:feat/nova-wing-combined-adlc-preview
