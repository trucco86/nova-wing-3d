name: Integrate city subboss retreat into reviewed HUD candidate once
on:
  push:
    branches: [feat/p0-unified-subboss-hud-dev-20261026]
    paths: ['.github/workflows/p82-subboss-integration-once.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare release before functional changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run release:prepare -- 1.24.11
          git add -A -- . ':!.github/workflows/**'
          git commit -m 'chore(release): prepare v1.24.11 unified subboss HUD preview'
      - name: Merge validated P0 retreat without replacing newer HUD design
        run: |
          git fetch origin fix/p0-subboss-withdrawal-unblock-orbit-20261025
          git merge --no-ff --no-edit -X ours origin/fix/p0-subboss-withdrawal-unblock-orbit-20261025
          git show --stat --oneline -1
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Push candidate and generated HTML only if all quality gates pass
        run: |
          git restore --worktree .github/workflows
          git add -A -- . ':!.github/workflows/**'
          if ! git diff --cached --quiet; then
            git commit -m 'build(v1.24.11): validate city subboss withdrawal with HUD edge'
          fi
          git push origin HEAD:refs/heads/feat/p0-unified-subboss-hud-dev-20261026
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p82-retreat-integration-quality
          path: artifacts/