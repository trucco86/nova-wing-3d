name: Release Train formatting repair
on:
  push:
    branches: [ops/release-train-smoke-rollback-20261122]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ops/release-train-smoke-rollback-20261122
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write tools/production-smoke.mjs .github/workflows/ci.yml
      - name: Commit formatting correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/production-smoke.mjs .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "Already formatted"
          else
            git commit -m "style(release-train): apply repository Prettier rules"
            git push origin HEAD:ops/release-train-smoke-rollback-20261122
          fi
