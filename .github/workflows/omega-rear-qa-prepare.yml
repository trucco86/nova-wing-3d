name: Prepare Omega rear-turn QA candidate
on:
  push:
    branches: [fix/omega-rear-delay-stationary-saturn-20261102]
    paths: ['.github/workflows/omega-rear-qa-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/omega-rear-delay-stationary-saturn-20261102
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format, regenerate web bundle and validate
        run: |
          npm run format
          npm run build
          npm run validate
      - name: Commit exactly the prepared source and generated HTML
        run: |
          git add -- index.html src/omega-hunt.js tests/omega-hunt.test.mjs src/game.js specs/saturn-omega-realism-v12772.md docs/PLANET-REALISM-GUIDELINES.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Already synchronized.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(omega): format rear-turn implementation and synchronize HTML'
            git push origin HEAD:fix/omega-rear-delay-stationary-saturn-20261102
          fi
