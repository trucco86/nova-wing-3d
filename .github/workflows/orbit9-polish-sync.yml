name: Orbit-9 polish one-shot source sync
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/orbit9-walk-and-gamepad-20261120
permissions:
  contents: write
jobs:
  synchronize:
    if: github.event.pull_request.head.ref == 'feat/orbit9-devastador-art-pass-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format, regenerate and validate the visual polish
        run: |
          npx prettier --write src/compact-menu.js src/exploration-preview.js src/orbit9-camera.js src/orbit9-stage-art.js tests/orbit9-stage-art.test.mjs
          npm run build
          npm run build:check
          node --test tests/orbit9-stage-art.test.mjs tests/orbit9-locomotion.test.mjs
          npx eslint src/compact-menu.js src/exploration-preview.js src/orbit9-camera.js src/orbit9-stage-art.js
      - name: Commit synchronized QA build and self-remove
        run: |
          git config user.name "Nova Wing QA Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/compact-menu.js src/exploration-preview.js src/orbit9-camera.js src/orbit9-stage-art.js tests/orbit9-stage-art.test.mjs
          git rm .github/workflows/orbit9-polish-sync.yml
          git diff --cached --quiet || git commit -m "chore(orbit9): sync polished QA build and menu event fix"
          git push origin HEAD:feat/orbit9-devastador-art-pass-20261120
