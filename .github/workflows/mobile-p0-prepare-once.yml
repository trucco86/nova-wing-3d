name: Prepare P0 mobile HUD build (one-off)
on:
  push:
    branches: [fix/p0-mobile-robot-button-20261025]
    paths: ['.github/workflows/mobile-p0-prepare-once.yml']
permissions:
  contents: write
concurrency:
  group: mobile-p0-prepare
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/styles.css tests/browser/mobile-hud-audit.spec.mjs package.json package-lock.json CHANGELOG.md releases/v1.24.4.md
      - run: npm run build
      - run: npm run validate
      - name: Commit deterministic web build and remove preparatory workflow
        run: |
          git rm .github/workflows/mobile-p0-prepare-once.yml
          git add src/styles.css tests/browser/mobile-hud-audit.spec.mjs package.json package-lock.json CHANGELOG.md releases/v1.24.4.md ios/App/App.xcodeproj/project.pbxproj index.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(mobile): prepare P0 cockpit candidate and remove one-off automation'
          git push origin HEAD:refs/heads/fix/p0-mobile-robot-button-20261025
