name: QA127 temporary premium enemy candidate
on:
  push:
    branches:
      - feat/qa127-enemy-premium-silhouettes-20261114
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format changed code and verify new enemy silhouettes
        run: |
          npx prettier --write src/visuals.js src/encounters.js src/enemy-premium-identity.js tests/qa127-enemy-identity.test.mjs
          node --test tests/qa127-enemy-identity.test.mjs
      - name: Prepare QA127 candidate and synchronized bundle
        run: |
          npm run release:prepare -- 1.27.126
          npm run build:check
      - name: Save candidate artifacts only to experimental branch
        shell: bash
        run: |
          git add src/visuals.js src/encounters.js src/enemy-premium-identity.js tests/qa127-enemy-identity.test.mjs package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md releases/v1.27.126.md index.html
          if ! git diff --cached --quiet; then
            git -c user.name='Nova Wing QA Bot' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m 'build(QA127): synchronize experimental premium enemy candidate'
            git push origin HEAD:feat/qa127-enemy-premium-silhouettes-20261114
          fi
