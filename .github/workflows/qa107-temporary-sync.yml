name: QA107 temporary source sync
on:
  push:
    branches:
      - fix/city-phase1-coherence-20261110
permissions:
  contents: write
jobs:
  synchronize:
    if: github.repository == 'trucco86/nova-wing-3d' && github.ref == 'refs/heads/fix/city-phase1-coherence-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Commit deterministic generated output only to isolated QA branch
        run: |
          git add -- index.html src/visuals.js specs/qa107-city-spatial-coherence.md
          if git diff --cached --quiet; then
            echo 'QA107 source and bundle already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(qa107): sync formatted source and generated bundle'
          git push origin HEAD:fix/city-phase1-coherence-20261110
