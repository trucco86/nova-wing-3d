name: QA112 Graphics 4.0 prepare once
on:
  push:
    branches:
      - feat/qa112-graphics40-hero-district-20261111
    paths:
      - .github/workflows/qa112-prepare-once.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare versioned Graphics 4.0 build and run full Node validation
        run: |
          npm run release:prepare -- 1.27.112
          npm run format
          npm run build
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build(QA112): synchronize 1.27.112 Graphics 4.0 pilot"
            git push origin HEAD:feat/qa112-graphics40-hero-district-20261111
          fi
          npm run validate

# QA112 second run: verify explicit four-layer cannon body invariant.
