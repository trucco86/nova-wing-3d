name: Prepare Saturn rings QA
on:
  push:
    branches: [feat/saturn-rings-icefield-premium-20261102]
    paths:
      - .github/workflows/saturn-qa-prepare.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/saturn-rings-icefield-premium-20261102
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format, build and validate Saturn QA bundle
        run: |
          npm run format
          npm run build
          npm run validate
      - name: Commit generated HTML and formatted sources
        run: |
          git add -- index.html src/destination-vista.js src/destination-arrival.js src/destination-landmarks.js src/stage-journey.js src/stage-variety.js src/campaign.js src/visuals.js src/game.js src/encounters.js src/breakable-encounters.js src/sector-waves.js tests/destination-arrival.test.mjs tests/destination-landmarks.test.mjs tests/late-world-landmarks.test.mjs tests/flight-environments.test.mjs tests/stage-combat-variety.test.mjs tests/sector-waves.test.mjs specs/saturn-rings-ice-battle.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(qa): synchronize Saturn ring battle source and HTML'
            git push origin HEAD:feat/saturn-rings-icefield-premium-20261102
          fi
