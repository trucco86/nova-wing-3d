name: City 2.5 premium QA bundle
on:
  push:
    branches:
      - feat/graphics-2-city-high-medium-20261030
permissions:
  contents: write
concurrency:
  group: city-2-5-premium-qa
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format premium assets and tests
        run: npx prettier --write src/visuals.js src/city-premium.js tests/graphics.test.mjs tests/city-2-3-horizon-traffic.test.mjs tests/city-2-5-premium.test.mjs specs/city-2-5-premium.md
      - name: Rebuild playable HTML
        run: npm run build
      - name: Verify bundled source and scene
        run: |
          npm run lint
          npm run validate
          npm run build:check
      - name: Commit reproducible preview candidate
        run: |
          git add src/visuals.js src/city-premium.js tests/graphics.test.mjs tests/city-2-3-horizon-traffic.test.mjs tests/city-2-5-premium.test.mjs specs/city-2-5-premium.md index.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(city): sync premium maglev and advertising preview"
            git push origin HEAD:feat/graphics-2-city-high-medium-20261030
          fi
