name: Prepare Nova Wing mobile boss and orbital ships v1.24.8
on:
  push:
    branches: [feat/p0-mobile-boss-thumb-ship-details-20261025]
    paths: ['.github/workflows/p76-version-once.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.24.8
      - run: npm run format
      - run: npm run build
      - name: Store release preparation in isolated branch only
        run: |
          git rm .github/workflows/p76-version-once.yml
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(release): prepare isolated v1.24.8 mobile and orbital design candidate'
          git push origin HEAD:refs/heads/feat/p0-mobile-boss-thumb-ship-details-20261025
