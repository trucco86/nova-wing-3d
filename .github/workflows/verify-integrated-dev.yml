name: Verify consolidated Nova Wing DEV candidate (temporary)
on:
  push:
    branches:
      - integration/dev-all-priorities-20261028
    paths:
      - .github/workflows/verify-integrated-dev.yml
      - src/game.js
      - tests/harness.mjs
      - src/visuals.js
permissions:
  contents: write
concurrency:
  group: integration-candidate-check-20261028
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generate unified 1.27.0 artifact and format integrated features
        run: |
          npm run release:prepare -- 1.27.0
          npm run format
          npm run build
      - name: Push exact reproducible candidate to integration branch ONLY
        run: |
          git add -- src tests tools specs docs package.json package-lock.json CHANGELOG.md releases/v1.27.0.md ios/App/App.xcodeproj/project.pbxproj index.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'release(dev): synchronize integrated v1.27.0 browser candidate'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Validate integrated source, build and all node tests
        run: npm run validate
