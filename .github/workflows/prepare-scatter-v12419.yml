name: Prepare isolated scatter weapon candidate v1.24.19
on:
  push:
    branches:
      - feat/p1-scatter-cannon-hangar-20261027
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'trucco86/nova-wing-3d' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generate reproducible v1.24.19 bundle
        run: npm run release:prepare -- 1.24.19
      - name: Format all touched modules
        run: npm run format
      - name: Check static and unit gates
        run: npm run validate
      - name: Commit verified candidate metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json CHANGELOG.md releases/v1.24.19.md index.html ios/App/App.xcodeproj/project.pbxproj src/campaign.js src/game.js src/shell.html src/styles.css src/i18n.js src/scatter-cannon.js tests/scatter-cannon.test.mjs tests/arsenal-game.test.mjs tests/browser/scatter-hangar.spec.mjs tests/i18n.test.mjs specs/scatter-cannon-p1.md
          if ! git diff --cached --quiet; then
            git commit -m 'build(armory): prepare reproducible v1.24.19 scatter weapon preview'
            git push origin HEAD:feat/p1-scatter-cannon-hangar-20261027
          fi
