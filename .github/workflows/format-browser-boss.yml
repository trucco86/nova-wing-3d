name: Format v1.27.6 browser contract
on:
  push:
    branches: [feat/stage-diversity-boss-combat-v1276]
    paths:
      - .github/workflows/format-browser-boss.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/browser/dynamic.spec.mjs
      - run: npm run validate
      - name: Save formatted browser assertions
        run: |
          if git diff --quiet -- tests/browser/dynamic.spec.mjs; then
            echo "Browser test already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/dynamic.spec.mjs
          git commit -m "style(tests): format armored-hit browser regression"
          git push origin HEAD:feat/stage-diversity-boss-combat-v1276
