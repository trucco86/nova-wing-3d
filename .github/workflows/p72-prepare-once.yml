name: Prepare integrated mission balancing (one-off)
on:
  push:
    branches: [feat/p0-mission-pacing-difficulty-20261025]
    paths: ['.github/workflows/p72-prepare-once.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Save candidate after quality gates and discard one-off trigger
        run: |
          git rm .github/workflows/p72-prepare-once.yml
          git add src tests specs index.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(balance): integrate first-sub-boss encounter gate and deterministic browser coverage'
          git push origin HEAD:refs/heads/feat/p0-mission-pacing-difficulty-20261025
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p72-validation
          path: artifacts/
