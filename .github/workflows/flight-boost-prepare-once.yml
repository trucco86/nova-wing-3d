name: Prepare BOOST powered orbital ascent preview (one-off)
on:
  push:
    branches: [feat/p0-sector-flight-orbit-dev-20261025]
    paths: ['.github/workflows/flight-boost-prepare-once.yml']
permissions:
  contents: write
concurrency:
  group: flight-boost-prepare
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format changed code, tests and release notes
        run: |
          npx prettier --write src/game.js src/route.js src/orbital-launch.js src/visuals.js tests/orbital-launch.test.mjs tests/dynamic-flight.test.mjs tests/flight-launch-visual.test.mjs tests/launch-pacing-and-fighters.test.mjs tests/browser/launch-orbit.spec.mjs tests/browser/dynamic.spec.mjs releases/v1.24.5.md
      - run: npm run build
      - run: npm run lint
      - name: Execute focused orbital launch and renderer tests
        run: node --test tests/orbital-launch.test.mjs tests/flight-launch-visual.test.mjs tests/launch-pacing-and-fighters.test.mjs
      - run: npm run build:check
      - name: Commit generated build, remove temporary workflow and stale preparation
        run: |
          git rm .github/workflows/flight-boost-prepare-once.yml
          git rm -f .github/workflows/flight-feedback-prepare-once.yml
          git add src/game.js src/route.js src/orbital-launch.js src/visuals.js tests/orbital-launch.test.mjs tests/dynamic-flight.test.mjs tests/flight-launch-visual.test.mjs tests/launch-pacing-and-fighters.test.mjs tests/browser/launch-orbit.spec.mjs tests/browser/dynamic.spec.mjs releases/v1.24.5.md index.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(flight): sync playable BOOST orbital ascent and targeted regression tests'
          git push origin HEAD:refs/heads/feat/p0-sector-flight-orbit-dev-20261025
