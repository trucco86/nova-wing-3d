name: Unified premium ten-sector release validation
on:
  pull_request:
permissions:
  contents: write
jobs:
  validate-union:
    if: github.event.pull_request.number == 288
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: qa/integrated-premium-v12794-20261107
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.27.94
      - name: Write accurate unified candidate notes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("releases/v1.27.94.md")
          p.write_text("""## Nova Wing v1.27.94 — QA integrada, dez fases + premium

          - Consolidação da linha completa v1.27.93: chefes e ataques próprios, Europa (túnel, superfície, colosso), Saturno e Ômega, nave orbitando núcleo na fase 4, HUD, áudio, ritmo da fase 1, Super Boost e controles.
          - Integração da linha Mecha/City/Mars v1.27.69: robot Premium V4.1, esquiva lateral, skyline aprimorada da fase 1, colisão localizada e liberdade de exploração, fachada que reage aos tiros, tempestade e luas de Marte, salto warp.
          - Regras de não regressão em specs/qa-integrated-v1.27.94.md.

          **Status:** candidata de QA apenas; não é aceite de produção. Validar CI Node+Playwright, imagens reais e FPS de dispositivos físicos.
          """)
          ch=Path("CHANGELOG.md")
          s=ch.read_text()
          s=s.replace("## 1.27.94 — Candidata em preparação\n\n- Candidata não homologada; preencher entregas e evidências antes da publicação.", "## 1.27.94 — Candidata em preparação\n\n- União das linhas completas de fases 1–10, boss, Europa, Saturno, HUD, áudio e mecânicas v1.27.93 com Mecha Premium, física da cidade e Marte v1.27.69. Homologação ainda pendente.")
          ch.write_text(s)
          PY
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - run: npm run build:check
      - name: Commit synchronized candidate only after all gates are green
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md index.html package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj releases/v1.27.94.md specs/qa-integrated-v1.27.94.md src tests
          if ! git diff --cached --quiet; then
            git commit -m "build(unified): validated v1.27.94 premium ten-sector QA candidate"
            git fetch origin qa/integrated-premium-v12794-20261107
            git rebase origin/qa/integrated-premium-v12794-20261107
            git push origin HEAD:qa/integrated-premium-v12794-20261107
          fi
