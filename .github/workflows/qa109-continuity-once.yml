name: QA109 continuity candidate sync once
on:
  push:
    branches:
      - fix/qa109-city-layout-transit-anchors-20261111
    paths:
      - .github/workflows/qa109-continuity-once.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format, build and verify the continuity release candidate
        run: |
          npm run release:prepare -- 1.27.109
          npm run format
          npm run build
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/city-tile-identity.js src/city-32-living.js src/visuals.js tests/qa109-city-continuity.test.mjs tests/browser/qa109-city-coherence.spec.mjs specs/qa109-city-layout-and-grounding.md releases/v1.27.109.md CHANGELOG.md index.html package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj
          if ! git diff --cached --quiet; then
            git commit -m "build(QA109): synchronize anchored tile variety and skyline continuity"
            git push origin HEAD:fix/qa109-city-layout-transit-anchors-20261111
          fi
          npm run validate

# Retrigger after correcting invalid optional-chain assignment in city identity
