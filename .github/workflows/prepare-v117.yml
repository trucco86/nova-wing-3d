name: Prepare web v1.17 from source
on:
  push:
    branches:
      - feat/web-v1-17-combat-feedback-and-backlog
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: |
          npm run format
          npm run build
      - name: Commit formatted source and generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests specs docs releases index.html README.md CHANGELOG.md package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(v1.17): format feedback and generate web bundle"
            git push origin HEAD:refs/heads/feat/web-v1-17-combat-feedback-and-backlog
          fi
