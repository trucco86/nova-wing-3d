name: Targeted cockpit and legacy browser regressions
on:
  push:
    branches: [feat/cockpit-five-cats-relay-v12796-20261107]
    paths: [.github/workflows/cockpit-relay-browser-regressions.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:check
      - run: npm run format:check
      - run: npx playwright install chromium
      - name: Validate changed browser scenarios
        run: npx playwright test tests/browser/game.spec.mjs tests/browser/web-v120.spec.mjs tests/browser/hero-dash-mobile.spec.mjs tests/browser/pilot-relay-cockpit.spec.mjs --project=${{ matrix.project }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cockpit-regressions-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
