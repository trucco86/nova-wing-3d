name: Sync QA183 gameplay artifact
on:
  push:
    branches: [feat/qa183-boss-counter-rpg-tuning]
    paths:
      - .github/workflows/sync-qa183-gameplay.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/game.js tests/qa183-boss-counter-rpg.test.mjs
      - run: npm run build
      - run: npm run build:check
      - run: npm run validate
      - name: Save source and identical generated web
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game.js tests/qa183-boss-counter-rpg.test.mjs index.html
          git commit -m "build(qa183): sync visible counter window and generated HTML"
          git push origin HEAD:feat/qa183-boss-counter-rpg-tuning
