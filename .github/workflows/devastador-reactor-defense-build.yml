name: Stage 04 reactor defense and cannon audio QA builder
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/orbit9-devastador-art-pass-20261120
permissions:
  contents: write
jobs:
  build:
    if: github.event.pull_request.head.ref == 'feat/devastador-reactor-integrated-access-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build and validate reactor defensive systems and audio cues
        run: |
          npx prettier --write src/devastador-grand-hall.js src/devastador-sabotage.js src/devastador-reactor-defense.js src/game.js src/audio-cues.js tests/devastador-reactor-defense.test.mjs tests/devastador-grand-hall.test.mjs CHANGELOG.md releases/v1.27.159.md package.json package-lock.json
          npm run build
          npm run build:check
          node --test tests/devastador-reactor-defense.test.mjs tests/devastador-grand-hall.test.mjs tests/devastador-sabotage.test.mjs
          npx eslint src/devastador-grand-hall.js src/devastador-sabotage.js src/devastador-reactor-defense.js src/game.js src/audio-cues.js tests/devastador-reactor-defense.test.mjs
      - name: Commit generated game and remove temporary workflow
        run: |
          git config user.name "Nova Wing QA Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/devastador-grand-hall.js src/devastador-sabotage.js src/devastador-reactor-defense.js src/game.js src/audio-cues.js tests/devastador-reactor-defense.test.mjs tests/devastador-grand-hall.test.mjs CHANGELOG.md releases/v1.27.159.md package.json package-lock.json
          git rm .github/workflows/devastador-reactor-defense-build.yml
          git diff --cached --quiet || git commit -m "chore(stage4): synchronize sentinels, reactor combat and new weapon audio"
          git push origin HEAD:feat/devastador-reactor-integrated-access-20261120
