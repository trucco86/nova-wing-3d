name: Format PR branch
on:
  push:
    branches:
      - docs/master-backlog-2026-10
      - chore/qa-skill-sonar-plan
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'trucco86/nova-wing-3d' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatted files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- '*.md'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style: apply project Prettier formatting'
          git push origin HEAD:${GITHUB_REF_NAME}
