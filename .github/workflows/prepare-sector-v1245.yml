name: Prepare orbital visual separation candidate
on:
  push:
    branches:
      - feat/sector-lighting-dev-rebase-20261026
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'trucco86/nova-wing-3d' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generate v1.24.5 bundle
        run: npm run release:prepare -- 1.24.5
      - name: Format changed sources
        run: npm run format
      - name: Validate release candidate
        run: npm run validate
      - name: Commit version metadata and generated HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json CHANGELOG.md releases/v1.24.5.md index.html ios/App/App.xcodeproj/project.pbxproj src/campaign.js src/visuals.js tests/sector-palette.test.mjs tests/browser/sector-visual-audit.spec.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'build(art): prepare v1.24.5 city/orbit preview'
            git push origin HEAD:feat/sector-lighting-dev-rebase-20261026
          fi
