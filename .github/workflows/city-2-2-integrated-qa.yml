name: City 2.2 integrated QA build
on:
  push:
    branches:
      - feat/graphics-2-city-high-medium-20261030
permissions:
  contents: write
concurrency:
  group: city-2-2-integrated
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Format integrated graphics
        run: npx prettier --write src/visuals.js tests/graphics.test.mjs tests/city-premium-facades.test.mjs specs/city-2-2-visual-backlog.md
      - name: Build browser artifact
        run: npm run build
      - name: Validate integrated City 2.2 candidate
        run: |
          npm run lint
          npm run validate
          npm run build:check
      - name: Commit reproducible candidate
        run: |
          git add src/visuals.js tests/graphics.test.mjs tests/city-premium-facades.test.mjs specs/city-2-2-visual-backlog.md index.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(city): sync elevated crossings and restored avenue rails"
            git push origin HEAD:feat/graphics-2-city-high-medium-20261030
          fi
