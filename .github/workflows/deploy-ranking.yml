name: Deploy ranking Worker and D1 migrations (manual approval)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Isolated target environment'
        type: choice
        options:
          - hml
          - prod
        required: true
      confirm:
        description: 'Enter DEPLOY-HML or DEPLOY-PROD exactly; affects a remote D1 database'
        type: string
        required: true
      enable_experimental_writes:
        description: 'Allow consented, unverified score submissions'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ranking-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ (inputs.target == 'hml' && inputs.confirm == 'DEPLOY-HML') || (inputs.target == 'prod' && inputs.confirm == 'DEPLOY-PROD') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.target == 'prod' && 'nova-ranking-prod' || 'nova-ranking-hml' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NOVA_RANKING_TARGET: ${{ inputs.target }}
      NOVA_RANKING_D1_ID: ${{ inputs.target == 'prod' && vars.NOVA_RANKING_PROD_D1_ID || vars.NOVA_RANKING_HML_D1_ID }}
      NOVA_RANKING_FIREBASE_PROJECT_ID: ${{ inputs.target == 'prod' && vars.NOVA_RANKING_PROD_FIREBASE_PROJECT_ID || vars.NOVA_RANKING_HML_FIREBASE_PROJECT_ID }}
      NOVA_RANKING_ENABLE_WRITES: ${{ inputs.enable_experimental_writes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Require Cloudflare credentials and environment IDs
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$NOVA_RANKING_D1_ID"
          test -n "$NOVA_RANKING_FIREBASE_PROJECT_ID"
      - name: Generate isolated Worker configuration
        run: node tools/write-ranking-worker-config.mjs
      - name: Validate migrations locally before remote changes
        working-directory: workers/ranking
        run: |
          npx --yes wrangler@4 d1 migrations apply DB --local --config wrangler.toml
      - name: Apply reviewed D1 migrations remotely
        working-directory: workers/ranking
        run: |
          npx --yes wrangler@4 d1 migrations apply DB --remote --config wrangler.toml
      - name: Deploy and report URL for the environment variable
        working-directory: workers/ranking
        run: |
          npx --yes wrangler@4 deploy --config wrangler.toml
          echo 'Register the HTTPS Worker origin in NOVA_RANKING_HML_API_URL or NOVA_RANKING_PROD_API_URL.'
