name: Prepare City 2.8 Adaptive Performance QA — validated
on:
  push:
    branches:
      - feat/city-28-adaptive-fps-dynamic-traffic-20261031
    paths:
      - .github/workflows/qa-city-28-prepare.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/city-28-adaptive-fps-dynamic-traffic-20261031
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.27.39
      - run: npm run format
      - run: npm run build
      - run: npm run build:check
      - run: npm run lint
      - run: npm run test
      - run: npm run validate
      - run: npm run check:repo
      - name: Commit synchronized City 2.8 QA HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj index.html src/game.js src/graphics-quality.js src/city-traffic.js src/city-urban-drones.js src/visuals.js tests/graphics.test.mjs tests/graphics-quality.test.mjs tests/city-2-7-active-traffic.test.mjs tests/graphics-3-3-premium-models.test.mjs tests/city-2-8-performance-and-detail.test.mjs specs/city-2-8-adaptive-performance-and-realism.md CHANGELOG.md releases/v1.27.39.md
          if ! git diff --cached --quiet; then
            git commit -m "build(city): prepare City 2.8 adaptive mobile rendering QA v1.27.39"
            git push origin HEAD:feat/city-28-adaptive-fps-dynamic-traffic-20261031
          fi
