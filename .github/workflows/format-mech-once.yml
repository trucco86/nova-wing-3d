name: Format mech candidate once
on:
  push:
    branches: [feat/nw25-mech-visual-parity]
    paths:
      - .github/workflows/format-mech-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nw25-mech-visual-parity
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/game.js src/styles.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game.js src/styles.css
          if ! git diff --cached --quiet; then
            git commit -m "style(mech): format gameplay and mobile HUD"
            git push
          fi
