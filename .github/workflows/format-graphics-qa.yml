name: Temporary format Graphics QA backlog

on:
  push:
    branches:
      - feat/graphics-2-city-high-medium-20261030

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply project Markdown formatter
        run: npx prettier --write docs/BACKLOG.md
      - name: Commit formatted backlog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BACKLOG.md
          if ! git diff --cached --quiet; then
            git commit -m "style(graphics): format current QA backlog"
            git push origin HEAD:refs/heads/feat/graphics-2-city-high-medium-20261030
          fi
