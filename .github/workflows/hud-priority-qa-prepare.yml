name: One-shot Compact HUD final QA sync
on:
  push:
    branches: [feat/hud-priority-message-triage-20261104]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Commit final formatted source and browser bundle
        run: |
          git config user.name 'nova-wing-qa-bot'
          git config user.email 'nova-wing-qa-bot@users.noreply.github.com'
          git add index.html src/game.js src/styles.css src/hud-message-policy.js src/ui-preferences.js tests/hud-message-policy.test.mjs tests/browser/hud-priority-compact.spec.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'chore(build): sync compact HUD source, tests and browser bundle'
            git push origin HEAD:feat/hud-priority-message-triage-20261104
          fi
