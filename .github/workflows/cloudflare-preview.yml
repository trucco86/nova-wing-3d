name: Deploy isolated web environments (Cloudflare Pages)

on:
  push:
    branches: [dev, hml]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # No secrets are exposed to forks. Never use the production github-pages environment.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: nova-preview
    steps:
      - uses: actions/checkout@v4
        with:
          # For conservative changed-file selection in the preview-only lane.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      # Preview is an experiment, not an approved release. Build current
      # sources directly so developers do not wait for a bot-synced index.html.
      # Main/release still require strict CI with the committed HTML.
      - name: Build current QA preview
        run: |
          npm run build
          npm run build:check
      - name: FAST source checks and impacted regression tests
        run: npm run test:fast -- --scope=auto
      - name: State fast-lane limitations
        run: echo 'Preview-only gate. Full Node and browser CI remain required before merge.'
      - name: Prepare static website
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          # Keep the release dashboard testable before main/production, if this
          # candidate includes it. Other PRs remain game-only.
          if [ -f docs/control-center/index.html ]; then
            mkdir -p dist/control-center
            cp docs/control-center/index.html dist/control-center/index.html
          fi
          touch dist/.nojekyll
          printf 'sha=%s\nref=%s\n' "$GITHUB_SHA" "$GITHUB_REF" > dist/BUILD.txt
      - name: Check Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo '::notice::Cloudflare deploy not configured. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable hosting.'
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
        id: credentials
      - name: Deploy to independent Cloudflare Pages project
        if: steps.credentials.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=nova-wing-preview --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirm deployment attempt
        if: steps.credentials.outputs.configured == 'true'
        run: echo 'Cloudflare deploy step completed for this SHA.'
