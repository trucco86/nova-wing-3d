name: Deploy isolated web environments (Cloudflare Pages)

on:
  push:
    branches: [dev, hml]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # No secrets are exposed to forks. Never use the production github-pages environment.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: nova-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build web
        run: npm run build:check
      - name: Reproduce verified web build
        run: npm run build
      - name: Validate source and generated output
        run: npm run validate
      - name: Prepare static website
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          touch dist/.nojekyll
          printf 'sha=%s\nref=%s\n' "$GITHUB_SHA" "$GITHUB_REF" > dist/BUILD.txt
      - name: Prepare environment-specific public Firebase and ranking config
        env:
          NOVA_ENV: ${{ github.event_name == 'pull_request' && 'preview' || github.ref_name }}
          NOVA_FIREBASE_CONFIG_JSON: ${{ github.ref_name == 'hml' && vars.NOVA_FIREBASE_HML_CONFIG_JSON || vars.NOVA_FIREBASE_DEV_CONFIG_JSON }}
          NOVA_RANKING_API_URL: ${{ github.ref_name == 'hml' && vars.NOVA_RANKING_HML_API_URL || vars.NOVA_RANKING_DEV_API_URL }}
        run: node tools/write-public-config.mjs dist/nova-config.json
      - name: Check Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo '::notice::Cloudflare deploy not configured. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable hosting.'
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
        id: credentials
      - name: Deploy to independent Cloudflare Pages project
        if: steps.credentials.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=nova-wing-preview --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirm deployment attempt
        if: steps.credentials.outputs.configured == 'true'
        run: echo 'Cloudflare deploy step completed for this SHA.'
      - name: Read-only HML deployment smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/hml' && steps.credentials.outputs.configured == 'true'
        run: node tools/verify-hml-deploy.mjs
