name: Deploy isolated flight preview PR 43

on:
  push:
    branches: [preview-pr-43-flight]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # No secrets are exposed to forks. Never use the production github-pages environment.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: nova-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build web
        run: npm run build
      # Experimental PR previews deliberately require only a reproducible build.
      # Full quality and browser gates still block merges and stable environments.
      - name: Verify experimental PR build
        if: github.ref_name == 'preview-pr-43-flight'
        run: npm run build:check
      - name: Validate stable DEV/HML build
        if: github.ref_name != 'preview-pr-43-flight'
        run: npm run validate
      - name: Prepare static website
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          touch dist/.nojekyll
          printf 'sha=%s\nref=%s\n' "$GITHUB_SHA" "$GITHUB_REF" > dist/BUILD.txt
          if [ "${{ github.ref_name }}" = 'preview-pr-43-flight' ]; then
            echo 'gate=EXPERIMENTAL_BUILD_ONLY' >> dist/BUILD.txt
          else
            echo 'gate=FULL_VALIDATION' >> dist/BUILD.txt
          fi
      - name: Check Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo '::notice::Cloudflare deploy not configured. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable hosting.'
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
        id: credentials
      - name: Deploy to independent Cloudflare Pages project
        if: steps.credentials.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=nova-wing-preview --branch=pr-43
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirm deployment attempt
        if: steps.credentials.outputs.configured == 'true'
        run: echo 'Cloudflare deploy step completed for this SHA.'
