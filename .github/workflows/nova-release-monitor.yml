name: Nova Wing release monitor (30 min)
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  issues: write
concurrency:
  group: nova-wing-release-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check CI, Pages deployment and actionable blockers
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = '[monitor] Nova Wing: bloqueio de release';
            const now = Date.now();
            const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const sha = branch.commit.sha;
            
            // This workflow must not mistake its own 30-minute runs for missing CI.
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'ci.yml', head_sha: sha, per_page: 20
            });
            const ci = runs.workflow_runs.find(run => run.head_sha === sha);
            const blockers = [];
            const incidentIds = [];
            const block = (id, message) => {
              incidentIds.push(id);
              blockers.push(message);
            };
            let pages = null;
            if (!ci) {
              block('ci-missing:' + sha, 'Nenhuma CI encontrada para HEAD main: ' + sha.slice(0, 12));
            } else {
              const ageMinutes = (now - Date.parse(ci.created_at)) / 60000;
              if (ci.status === 'completed' && ci.conclusion !== 'success') {
                block('ci-failed:' + ci.id + ':' + ci.conclusion,
                  'CI terminou com ' + ci.conclusion + ': ' + ci.html_url);
              } else if (ci.status !== 'completed' && ageMinutes > 90) {
                block('ci-timeout:' + ci.id,
                  'CI sem concluir há ' + Math.round(ageMinutes) + ' min: ' + ci.html_url);
              }
              const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                owner, repo, run_id: ci.id, per_page: 100
              });
              pages = jobs.jobs.find(job => job.name === 'pages') || null;
              if (ci.status === 'completed' && ci.conclusion === 'success') {
                if (pages?.status === 'completed' && pages.conclusion !== 'success') {
                  block('pages-failed:' + ci.id + ':' + pages.conclusion,
                    'CI aprovada, mas Pages terminou com ' + pages.conclusion + ': ' + ci.html_url);
                } else if ((!pages || pages.status !== 'completed') && ageMinutes > 90) {
                  block('pages-timeout:' + ci.id,
                    'Pages sem confirmação após ' + Math.round(ageMinutes) + ' min: ' + ci.html_url);
                }
              }
              const failed = jobs.jobs.filter(job => job.conclusion === 'failure');
              if (failed.length) {
                const names = failed.map(job => job.name).sort();
                block('failed-jobs:' + ci.id + ':' + names.join(','),
                  'Jobs falharam: ' + names.join(', '));
              }
            }
            let siteStatus = 'indisponível';
            let siteHealthy = false;
            try {
              const response = await fetch('https://trucco86.github.io/nova-wing-3d/', {
                signal: AbortSignal.timeout(12000),
                headers: { 'User-Agent': 'Nova-Wing-Release-Monitor' }
              });
              siteStatus = String(response.status);
              if (!response.ok) {
                block('site-http', 'Produção HTTP ' + response.status);
              } else {
                const html = await response.text();
                siteHealthy = html.includes('Nova Wing') || html.includes('NOVA WING');
                if (!siteHealthy) {
                  block('site-signature', 'Produção HTTP 200, mas assinatura Nova Wing ausente do HTML');
                }
              }
            } catch (error) {
              block('site-unreachable', 'Produção inacessível: ' + String(error.message).slice(0, 160));
            }
            
            // Targeted search avoids losing the tracking issue after 100 unrelated PRs/issues.
            async function findIssueByTitle(wanted) {
              const query = 'repo:' + owner + '/' + repo + ' is:issue in:title "' + wanted + '"';
              const { data } = await github.rest.search.issuesAndPullRequests({
                q: query, per_page: 100
              });
              return data.items.find(issue => issue.title === wanted && !issue.pull_request) || null;
            }
            const previous = await findIssueByTitle(title);
            // The incident key must not contain elapsed time or changing human-readable text.
            const fingerprint = incidentIds.sort().join(' | ');
            const encoded = Buffer.from(fingerprint).toString('base64');
            const body = [
              '@trucco86', '',
              'Monitor automático da release Nova Wing. Revisão humana necessária.',
              '',
              '**HEAD main:** ' + String.fromCharCode(96) + sha + String.fromCharCode(96),
              '**CI:** ' + (ci ? ci.html_url + ' (' + ci.status + ', ' + (ci.conclusion || 'pendente') + ')' : 'não encontrada'),
              '**Pages:** ' + (pages ? pages.conclusion || pages.status : 'sem confirmação'),
              '**Produção HTTP:** ' + siteStatus,
              '',
              '**Bloqueios:**',
              ...blockers.map(message => '- ' + message),
              '',
              '<!-- monitor-fingerprint:' + encoded + ' -->'
            ].join('\n');
            const healthy = Boolean(
              ci?.status === 'completed' && ci.conclusion === 'success' &&
              pages?.status === 'completed' && pages.conclusion === 'success' &&
              siteHealthy && blockers.length === 0
            );
            if (blockers.length) {
              if (!previous || previous.state === 'closed') {
                const created = await github.rest.issues.create({ owner, repo, title, body });
                core.warning('Novo bloqueio: ' + created.data.html_url);
              } else if (!previous.body?.includes('monitor-fingerprint:' + encoded)) {
                await github.rest.issues.update({ owner, repo, issue_number: previous.number, body });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: previous.number,
                  body: '@trucco86 Mudança nos bloqueios da release. Consulte a descrição atualizada.'
                });
                core.warning('Bloqueio atualizado: ' + previous.html_url);
              } else {
                core.info('Bloqueios conhecidos, sem nova notificação: ' + previous.html_url);
              }
            } else if (!healthy) {
              // Pending CI or queued Pages is not recovery and must not close a prior alert.
              core.info('Validação ainda em andamento; nenhum bloqueio resolvido ou release confirmada.');
            } else if (previous?.state === 'open') {
              await github.rest.issues.createComment({
                owner, repo, issue_number: previous.number,
                body: '@trucco86 Recuperação confirmada: CI e GitHub Pages aprovados, produção HTTP ' +
                  siteStatus + ', main ' + sha.slice(0, 12) + '.'
              });
              await github.rest.issues.update({
                owner, repo, issue_number: previous.number, state: 'closed'
              });
              core.info('Recuperação confirmada e issue fechada.');
            } else {
              const releaseTitle = '[monitor] Nova Wing: release concluída ' + sha.slice(0, 12);
              const alreadyNotified = await findIssueByTitle(releaseTitle);
              if (!alreadyNotified) {
                const created = await github.rest.issues.create({
                  owner, repo, title: releaseTitle,
                  body: [
                    '@trucco86 Release concluída: CI aprovada, Pages publicado e produção HTTP ' + siteStatus + '.',
                    '', 'SHA main: ' + sha, 'CI: ' + ci.html_url
                  ].join('\n')
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: created.data.number, state: 'closed'
                });
                core.info('Conclusão notificada: ' + created.data.html_url);
              } else {
                core.info('Release saudável; conclusão já registrada.');
              }
            }
