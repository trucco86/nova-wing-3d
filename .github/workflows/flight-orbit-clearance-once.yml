name: Prepare clean Earth horizon in orbital ascent (one-off)
on:
  push:
    branches: [feat/p0-sector-flight-orbit-dev-20261025]
    paths: ['.github/workflows/flight-orbit-clearance-once.yml']
permissions:
  contents: write
concurrency:
  group: orbital-clearance-prepare
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/visuals.js tests/flight-launch-visual.test.mjs tests/browser/dynamic.spec.mjs
      - run: npm run build
      - run: npm run validate
      - name: Commit generated web build and remove preparatory workflow
        run: |
          git rm .github/workflows/flight-orbit-clearance-once.yml
          git add src/visuals.js tests/flight-launch-visual.test.mjs tests/browser/dynamic.spec.mjs index.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(flight): prepare clear orbital horizon for isolated preview'
          git push origin HEAD:refs/heads/feat/p0-sector-flight-orbit-dev-20261025
