name: Synchronize drill boss weak-point release
on:
  push:
    branches:
      - feat/all-boss-signatures-v1278
      - feat/five-cats-universe-quest-foundation-v1279
    paths:
      - .github/workflows/sync-boss-drill.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/boss-signature.js tests/boss-signature.test.mjs
      - run: npm run build
      - run: npm run build:check
      - run: npm run validate
      - name: Commit only generated HTML and source changes
        run: |
          if git diff --quiet; then
            echo "Already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/boss-signature.js tests/boss-signature.test.mjs
          git commit -m "build(dev): synchronize generator-aware drill volley"
          git push origin HEAD:${GITHUB_REF_NAME}
