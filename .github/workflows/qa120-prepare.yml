name: QA120 prepare premium carrier and final worlds

on:
  push:
    branches:
      - feat/qa120-carrier-fleet-fortress-20261112
    paths:
      - .github/workflows/qa120-prepare.yml
      - src/mothership-interior.js
      - src/destination-landmarks.js
      - src/premium-landmark-hulls.js
      - tests/qa120-carrier-fleet-fortress.test.mjs
      - specs/qa120-carrier-fleet-fortress.md

permissions:
  contents: write

concurrency:
  group: qa120-prepare
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare isolated QA120 candidate, never publish to production
        run: npm run release:prepare -- 1.27.120
      - run: npm run format
      - run: npm run build
      - name: Validate premium carrier, grounded fleets and full destination regression
        run: node --test tests/qa120-carrier-fleet-fortress.test.mjs tests/mothership-interior-story.test.mjs tests/mothership-boarding.test.mjs tests/destination-landmarks.test.mjs tests/destination-arrival.test.mjs tests/qa118-premium-worlds.test.mjs
      - run: npm run validate
      - run: git diff --check
      - name: Commit tested and synchronized preview release only to QA branch
        run: |
          git add -u
          if [ -f releases/v1.27.120.md ]; then git add releases/v1.27.120.md; fi
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'QA120 candidate is synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(QA120): synchronize fully tested 1.27.120 preview'
          git fetch origin feat/qa120-carrier-fleet-fortress-20261112
          git rebase origin/feat/qa120-carrier-fleet-fortress-20261112
          git push origin HEAD:feat/qa120-carrier-fleet-fortress-20261112
