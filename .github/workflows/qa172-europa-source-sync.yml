name: QA172 Europa motion and claw source sync
on:
  push:
    branches:
      - feat/alien-worlds-visual-identity-20261120
    paths:
      - .github/workflows/qa172-europa-source-sync.yml
permissions:
  contents: write
jobs:
  source-and-browser-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/alien-worlds-visual-identity-20261120
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format, lint, run regression and rebuild the real game
        run: |
          npx prettier --write src/alien-architecture.js src/europa-crystal-canyon.js src/europa-surface.js src/europa-attack-vfx.js src/visuals.js src/game.js tests/alien-worlds-visual-identity.test.mjs tests/europa-crystal-canyon.test.mjs tests/europa-attack-vfx.test.mjs tests/browser/europa-motion-depth.spec.mjs tests/browser/europa-claw-strikes.spec.mjs tests/browser/qa168-alien-worlds.spec.mjs tests/dynamic-scene.js
          npm run lint
          node --test tests/alien-worlds-visual-identity.test.mjs tests/europa-crystal-canyon.test.mjs tests/europa-attack-vfx.test.mjs tests/europa-surface.test.mjs tests/boss-signature-scene.test.mjs
          npm run build
          npm run build:check
      - name: Commit only generated bundle and formatting on QA branch
        run: |
          git add -- index.html src/alien-architecture.js src/europa-crystal-canyon.js src/europa-surface.js src/europa-attack-vfx.js src/visuals.js src/game.js tests/alien-worlds-visual-identity.test.mjs tests/europa-crystal-canyon.test.mjs tests/europa-attack-vfx.test.mjs tests/browser/europa-motion-depth.spec.mjs tests/browser/europa-claw-strikes.spec.mjs tests/browser/qa168-alien-worlds.spec.mjs tests/dynamic-scene.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Already synchronized'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(europa): sync live canyon depth and continuous Colossus arms'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
