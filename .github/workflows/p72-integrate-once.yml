name: Integrate orbital base and run candidate checks (one-off)
on:
  push:
    branches: [feat/p0-mission-pacing-difficulty-20261025]
    paths: ['.github/workflows/p72-integrate-once.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Merge updated P0 orbital branch without rewriting history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin feat/p0-sector-flight-orbit-dev-20261025
          git merge --no-ff --no-edit -X ours origin/feat/p0-sector-flight-orbit-dev-20261025
          git rm .github/workflows/p72-integrate-once.yml
      - run: npm ci
      - run: npm run format
      - run: npm run build
      - name: Commit generated sources to isolated branch
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'build(balance): sync orbital parent and v1.24.6 formatted bundle'
          fi
          git push origin HEAD:refs/heads/feat/p0-mission-pacing-difficulty-20261025
      - name: Run unit, static, build and repository quality gates
        run: npm run validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p72-integrated-quality-evidence
          path: artifacts/
