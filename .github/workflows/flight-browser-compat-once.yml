name: Prepare BOOST browser regression compatibility (one-off)
on:
  push:
    branches: [feat/p0-sector-flight-orbit-dev-20261025]
    paths: ['.github/workflows/flight-browser-compat-once.yml']
permissions:
  contents: write
concurrency:
  group: flight-browser-compat-prepare
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/dynamic-scene.js tests/browser/orbital-journey.mjs tests/browser/mobile-hud-audit.spec.mjs tests/browser/web-v118.spec.mjs tests/browser/web-v120.spec.mjs tests/browser/dynamic.spec.mjs
      - run: npm run build
      - run: npm run validate
      - run: npm run build:check
      - name: Commit browser regressions and clean up temporary workflow
        run: |
          git rm .github/workflows/flight-browser-compat-once.yml
          git add tests/dynamic-scene.js tests/browser/orbital-journey.mjs tests/browser/mobile-hud-audit.spec.mjs tests/browser/web-v118.spec.mjs tests/browser/web-v120.spec.mjs tests/browser/dynamic.spec.mjs index.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test(browser): validate BOOST-driven HUD, boss, and hangar scenarios'
          git push origin HEAD:refs/heads/feat/p0-sector-flight-orbit-dev-20261025
