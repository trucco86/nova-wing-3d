name: Prepare mobile tap targets (one-off)
on:
  push:
    branches: [fix/p0-mobile-robot-button-20261025]
    paths: ['.github/workflows/mobile-taps-prepare-once.yml']
permissions:
  contents: write
concurrency:
  group: mobile-taps-prepare
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/styles.css
      - run: npm run build
      - run: npm run validate
      - name: Commit build and remove temporary workflow
        run: |
          git rm .github/workflows/mobile-taps-prepare-once.yml
          git add src/styles.css index.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(mobile): validate touch targets and generated web assets'
          git push origin HEAD:refs/heads/fix/p0-mobile-robot-button-20261025
