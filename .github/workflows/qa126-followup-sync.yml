name: QA126 temporary post-review bundle sync
on:
  push:
    branches:
      - feat/qa126-ally-continuity-ascent-combat-20261113
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format touched files and run regression tests
        run: |
          npx prettier --write src/game.js src/stage-one-pacing.js tests/qa126-ally-ascent.test.mjs
          node --test tests/qa126-ally-ascent.test.mjs
      - name: Build and check committed game
        run: |
          npm run build
          npm run build:check
      - name: Push synchronized output to experimental branch only
        run: |
          git add src/game.js src/stage-one-pacing.js tests/qa126-ally-ascent.test.mjs index.html
          if ! git diff --cached --quiet; then
            git -c user.name='Nova Wing QA Bot' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m 'build(QA126): align atmospheric combat and generated HTML'
            git push origin HEAD:feat/qa126-ally-continuity-ascent-combat-20261113
          fi
