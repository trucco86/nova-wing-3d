name: Europa tunnel end-to-end QA build sync
on:
  push:
    branches:
      - test/europa-tunnel-end-to-end-qa-20261105
permissions:
  contents: write
concurrency:
  group: europa-tunnel-e2e-sync
  cancel-in-progress: true
jobs:
  sync:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format QA source and tests
        run: |
          npx prettier --write src/developer-mode.js src/game.js tests/dynamic-scene.js tests/browser/europa-tunnel-end-to-end.spec.mjs tests/developer-mode.test.mjs tests/developer-scenarios.test.mjs
      - name: Validate scenario parser and real QA stage startup
        run: |
          node --test tests/developer-mode.test.mjs tests/developer-scenarios.test.mjs tests/europa-surface.test.mjs tests/europa-tunnel-breach.test.mjs
      - name: Prepare versioned QA build
        run: npm run release:prepare -- 1.27.87
      - name: Record test-only release notes and changelog
        run: |
          cat > releases/v1.27.87.md <<'NOTES'
          ## Nova Wing 3D v1.27.87 — Europa: QA de túnel ponta a ponta

          - Adicionado atalho **TÚNEL DE GELO / RUPTURA DA PAREDE** no menu de testes autorizado, exclusivo da fase 6. O teste é isolado, sem ranking nem gravação na campanha. Outros setores não podem usar este encontro.
          - O teste entra diretamente no túnel real, com o mesmo painel quebrável, colisões, partículas, inimigo e sistema de mundo da campanha.
          - Exposto diagnóstico de estado do túnel apenas no snapshot de QA para verificar, frame a frame, se o painel estava intacto, foi quebrado, os destroços caíram e o solo voltou ao final.
          - Novo teste Playwright em desktop/mobile testa e registra screenshots da parede intacta, ruptura, entrada do inimigo e retorno à superfície.
          - Mantém intactas as melhorias v1.27.86 de superfície e túnel e a v1.27.85 de garras do Colosso.

          **Somente QA; produção inalterada. Sem homologação visual manual em celular real.**
          NOTES
          python3 - <<'PY'
          from pathlib import Path
          path=Path("CHANGELOG.md")
          value=path.read_text()
          value=value.replace(
            "## 1.27.87 — Candidata em preparação\n\n- Candidata não homologada; preencher entregas e evidências antes da publicação.",
            "## 1.27.87 — Europa: validação ponta a ponta do túnel (QA)\n\n- Atalho de QA para a ruptura do túnel na fase 6, reutilizando o gameplay real.\n- Testes automatizados da parede intacta, rompimento, destroços, entrada de inimigo e saída para superfície.\n- Sem alterações em produção; homologação visual no celular real pendente."
          )
          path.write_text(value)
          PY
      - name: Commit source, tests and versioned web bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md releases/v1.27.87.md index.html src/developer-mode.js src/game.js tests/dynamic-scene.js tests/browser/europa-tunnel-end-to-end.spec.mjs tests/developer-mode.test.mjs tests/developer-scenarios.test.mjs
          if git diff --cached --quiet; then
            echo 'Versioned QA bundle already synchronized'
            exit 0
          fi
          git commit -m 'build(europa): add end-to-end tunnel QA candidate v1.27.87'
          git push origin HEAD:test/europa-tunnel-end-to-end-qa-20261105
