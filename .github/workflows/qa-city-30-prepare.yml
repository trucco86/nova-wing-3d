name: Prepare City 3.0 Boost Options Matrix QA
on:
  push:
    branches:
      - feat/city-30-boost-options-matrix-20261031
    paths:
      - .github/workflows/qa-city-30-prepare.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/city-30-boost-options-matrix-20261031
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.27.43
      - run: npm run format
      - run: npm run build
      - run: npm run build:check
      - run: npm run lint
      - run: npm run test
      - run: npm run validate
      - run: npm run check:repo
      - name: Commit synchronized QA build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj index.html src/game.js src/visuals.js src/styles.css src/city-30-district-life.js tests/graphics.test.mjs tests/browser/mobile-thumb-arcs.spec.mjs tests/browser/city-30-boost-options.spec.mjs tests/city-3-0-urban-renewal.test.mjs specs/city-3-0-boost-options-matrix.md CHANGELOG.md releases/v1.27.43.md
          if ! git diff --cached --quiet; then
            git commit -m "build(city): sync City 3.0 Matrix urban and mobile controls v1.27.43"
            git push origin HEAD:feat/city-30-boost-options-matrix-20261031
          fi
