name: QA102 prepare premium city environment release
on:
  push:
    branches: [feat/qa102-premium-city-life-20261107]
    paths: [.github/workflows/qa102-version-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/qa102-premium-city-life-20261107
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare exact v1.27.102 before visual source changes
        run: npm run release:prepare -- 1.27.102
      - name: Release notes and documented readiness
        run: |
          cat > releases/v1.27.102.md <<'NOTES'
          ## Nova Wing 3D v1.27.102 — Premium inhabited city (QA)

          - Building-anchored rooftop landing pads, directional runway rings and hazard lights enrich the skyline without floating objects.
          - Independent animated maintenance lifts, exterior guides and signaling create scale and motion along the existing avenue.
          - Industrial roof HVAC, microdetails and bounded steam plumes add a living third dimension to the city.
          - GPU instancing and High/Medium quality limits avoid per-frame mesh allocations and preserve mobile performance.
          - Gameplay physics, stage-one overpasses, falling obstacles, camera fade, ISS, Super Boost, ship and robot stay unchanged.

          **QA-only version. Visual WebGL, full browser gates and physical-device FPS review required before production.**
          NOTES
          python3 - <<'PY'
          from pathlib import Path
          f=Path('CHANGELOG.md'); s=f.read_text()
          at=s.index('## 1.27.102')
          marker='- Candidata não homologada; preencher entregas e evidências antes da publicação.'
          j=s.find(marker,at)
          if j<0: raise Exception('release placeholder not found')
          s=s[:j]+'- QA: novos detalhes industriais e heliportos nos telhados, elevadores de manutenção animados, placas de serviço e exaustão leve em High; física e câmera previamente homologadas preservadas; validação WebGL pendente.'+s[j+len(marker):]
          f.write_text(s)
          PY
      - name: Commit version metadata before source
        run: |
          git add -- package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md releases/v1.27.102.md index.html
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(QA102): prepare 1.27.102 before premium city environment changes'
          git push origin HEAD:feat/qa102-premium-city-life-20261107
