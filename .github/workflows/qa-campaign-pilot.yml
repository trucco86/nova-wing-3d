name: QA fresh campaign pilot
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-stage:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOVA_QA_CAMPAIGN: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test tests/gameplay-campaign-pilot.test.mjs
      - run: npm run build:check
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:browser -- gameplay-boss-reactive.spec.mjs --grep 'fresh campaign pilot'
      - name: Check formatting and print exact diff
        if: always()
        run: |
          npm run format
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fresh-campaign-evidence
          retention-days: 14
          path: |
            test-results/
            playwright-report/
