name: Prepare mobile orbit thumb dock v1.24.9
# Rebuild after the separate landscape thumb dock was corrected from Playwright evidence.
on:
  push:
    branches: [fix/p0-mobile-orbit-controls-radar-dock-20261025]
    paths: ['.github/workflows/orbit-thumb-release-prep.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.24.9
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Commit synchronized release artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md index.html releases/v1.24.9.md specs/orbit-thumb-controls-p0.md src/styles.css tests/browser/orbit-thumb-dock.spec.mjs
          git diff --cached --quiet && { echo 'No release diff'; exit 1; }
          git commit -m 'build(release): synchronize generated v1.24.9 thumb dock candidate'
          git push origin HEAD:fix/p0-mobile-orbit-controls-radar-dock-20261025
