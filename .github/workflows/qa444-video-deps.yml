name: QA444 provision portable FFmpeg
on:
  push:
    branches: [feat/gameplay-quality-agent-observer]
permissions:
  contents: write
jobs:
  provision:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install platform-resolved video binaries with lockfile
        run: npm install --save-dev @ffmpeg-installer/ffmpeg @ffprobe-installer/ffprobe
      - name: Verify portable executable paths
        run: |
          node --input-type=module -e "import ffmpeg from '@ffmpeg-installer/ffmpeg'; import ffprobe from '@ffprobe-installer/ffprobe'; console.log(ffmpeg.path, ffprobe.path)"
      - name: Commit pinned dependencies
        run: |
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(QA444): lock portable FFmpeg and FFprobe binaries for review clips'
          git push origin "HEAD:${GITHUB_REF_NAME}"
