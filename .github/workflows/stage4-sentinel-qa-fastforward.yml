name: Stage 04 responsive boss QA fast-forward sync
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/orbit9-devastador-art-pass-20261120
permissions:
  contents: write
jobs:
  sync:
    if: github.event.pull_request.head.ref == 'feat/devastador-reactor-integrated-access-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format and compile wall-sentinel browser evidence
        run: |
          npx prettier --write src/main.js
          npm run build
          npm run build:check
          node --test tests/devastador-reactor-defense.test.mjs tests/devastador-grand-hall.test.mjs
      - name: Commit release and remove helper
        run: |
          git config user.name "Nova Wing QA Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/main.js
          git rm .github/workflows/stage4-sentinel-qa-fastforward.yml
          git diff --cached --quiet || git commit -m "chore(stage4): faster deterministic browser capture of deploying sentinels"
          git pull --rebase origin feat/devastador-reactor-integrated-access-20261120
          npm run build:check
          git push origin HEAD:feat/devastador-reactor-integrated-access-20261120
