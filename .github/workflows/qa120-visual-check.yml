name: QA120 premium final-world WebGL audit

on:
  push:
    branches:
      - feat/qa120-carrier-fleet-fortress-20261112
    paths:
      - .github/workflows/qa120-visual-check.yml
      - src/premium-landmark-hulls.js
      - src/destination-landmarks.js
      - src/mothership-interior.js

permissions:
  contents: read

concurrency:
  group: qa120-premium-visual
  cancel-in-progress: true

jobs:
  visual:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - name: Validate all destination scenes and keep city GPU geometry below strict budget
        run: npx playwright test tests/browser/destination-journeys.spec.mjs tests/browser/qa114-silhouette-performance.spec.mjs --workers=2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qa120-premium-world-webgl-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
