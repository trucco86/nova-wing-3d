name: QA121 prepare Venus Neptune premium atmosphere

on:
  push:
    branches:
      - feat/qa121-venus-neptune-atmosphere-20261113
    paths:
      - .github/workflows/qa121-prepare.yml
      - src/premium-atmospheric-geology.js
      - src/destination-landmarks.js
      - tests/qa121-atmospheric-geology.test.mjs
      - specs/qa121-venus-neptune-atmospheres.md

permissions:
  contents: write

concurrency:
  group: qa121-prepare
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare version 1.27.121 in isolated QA branch
        run: npm run release:prepare -- 1.27.121
      - run: npm run format
      - run: npm run build
      - name: Run planetary PBR, rendering, pause and combat regression checks
        run: node --test tests/qa121-atmospheric-geology.test.mjs tests/destination-landmarks.test.mjs tests/destination-arrival.test.mjs tests/qa118-premium-worlds.test.mjs tests/qa120-carrier-fleet-fortress.test.mjs
      - run: npm run validate
      - run: git diff --check
      - name: Synchronize validated version and static HTML in QA branch only
        run: |
          git add -u
          if [ -f releases/v1.27.121.md ]; then git add releases/v1.27.121.md; fi
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'QA121 is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(QA121): sync fully validated 1.27.121 premium preview'
          git fetch origin feat/qa121-venus-neptune-atmosphere-20261113
          git rebase origin/feat/qa121-venus-neptune-atmosphere-20261113
          git push origin HEAD:feat/qa121-venus-neptune-atmosphere-20261113
