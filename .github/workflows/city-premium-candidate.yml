name: One-time city phase 1 physics and premium QA
on:
  pull_request:
  push:
    branches: [feat/mars-storm-moons-warp-exit]
    paths:
      - .github/workflows/city-premium-candidate.yml
permissions:
  contents: write
jobs:
  synchronize:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/mars-storm-moons-warp-exit
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.27.67
      - name: Record exact candidate scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          notes=Path("releases/v1.27.67.md")
          notes.write_text("""## Nova Wing 3D v1.27.67 — Stage 1 Concept Premium and Grounded Destruction

          - Estruturas da Cidade das Máquinas: outdoor que se solta, hovercar que despenca, fachada desabando, maglev com vagão suspenso e cabo visível.
          - Física de suporte ao solo da geometria rotacionada; rebote sempre acima do asfalto e distâncias para evitar objetos sobrepostos.
          - Colisão varrida integrada à nave e aos projéteis para a fachada e o trem pendurado; corredor lateral de fuga preservado.
          - Clarão, onda de choque e partículas instanciadas de impacto pré-alocadas (sem objetos por frame).
          - Nova camada de torres, fachadas envidraçadas, janelas ciano/âmbar, passarelas de várias alturas e anúncios da cidade seguindo a composição de referência.
          - High/Medium continuam com gradação de detalhes; alterações exclusivas da fase 1.

          **Apenas QA / PR draft:** requer screenshots desktop/mobile, revisão contra o concept e FPS em aparelho físico antes de qualquer merge/produção.
          """)
          ch=Path("CHANGELOG.md")
          s=ch.read_text()
          s=s.replace("## 1.27.67 — Candidata em preparação\n\n- Candidata não homologada; preencher entregas e evidências antes da publicação.",
            "## 1.27.67 — Candidata em preparação\n\n- Fase 1: destruição urbana roteirizada com física de solo, colisão de destroços, explosões pré-alocadas e skyline mais fiel ao concept; aprovação visual e FPS pendentes.")
          ch.write_text(s)
          PY
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - run: npm run build:check
      - name: Commit generated version and bundle only after tests pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md index.html package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj releases/v1.27.67.md src/city-catastrophe.js src/city-34-concept.js src/visuals.js src/game.js tests/city-catastrophe.test.mjs specs/city-phase1-premium-destruction.md
          if ! git diff --cached --quiet; then
            git commit -m "build(stage1): synchronize reproducible v1.27.67 urban destruction candidate"
            git fetch origin feat/mars-storm-moons-warp-exit
            git rebase origin/feat/mars-storm-moons-warp-exit
            git push origin HEAD:feat/mars-storm-moons-warp-exit
          fi
