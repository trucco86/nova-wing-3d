name: Build Graphics 2.3 QA artifact
on:
  push:
    branches: [feat/graphics-23-cinematic-city-v12729-qa-20261030]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  synchronize:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare version and validate source
        run: |
          npm run release:prepare -- 1.27.29
          npm run format
          npm run build
          npm run build:check
          npm run validate
      - name: Commit bundled browser artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/visuals.js src/premium-city-landmarks.js tests/graphics.test.mjs tests/premium-cinematic-city-v12729.test.mjs specs/premium-cinematic-city-v12729.md index.html package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md releases/v1.27.29.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'build(graphics): prepare v1.27.29 cinematic web QA'
          git push origin HEAD:feat/graphics-23-cinematic-city-v12729-qa-20261030
