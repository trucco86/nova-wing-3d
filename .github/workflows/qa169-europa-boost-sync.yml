name: QA169 Europa close-up chase build sync
on:
  push:
    branches:
      - feat/alien-worlds-visual-identity-20261120
    paths:
      - .github/workflows/qa169-europa-boost-sync.yml
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: feat/alien-worlds-visual-identity-20261120
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format and validate authored Europa changes
        run: |
          npx prettier --write src/europa-descent.js src/europa-surface.js src/europa-pursuit.js src/europa-enemy-ice-skin.js src/game.js src/hostile-projectile-pool.js tests/europa-descent.test.mjs tests/europa-surface.test.mjs tests/europa-pursuit.test.mjs tests/europa-super-boost-weather.test.mjs tests/destination-arrival.test.mjs tests/browser/qa168-alien-worlds.spec.mjs
          npm run lint
          node --test tests/europa-descent.test.mjs tests/europa-surface.test.mjs tests/europa-pursuit.test.mjs tests/europa-super-boost-weather.test.mjs tests/destination-arrival.test.mjs
          npm run build
          npm run build:check
      - name: Commit source and candidate HTML to isolated draft PR only
        run: |
          git add -- index.html src/europa-descent.js src/europa-surface.js src/europa-pursuit.js src/europa-enemy-ice-skin.js src/game.js src/hostile-projectile-pool.js tests/europa-descent.test.mjs tests/europa-surface.test.mjs tests/europa-pursuit.test.mjs tests/europa-super-boost-weather.test.mjs tests/destination-arrival.test.mjs tests/browser/qa168-alien-worlds.spec.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Europa web candidate already synchronized'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(europa): sync closer moon, short snow veil and real ice fighter pursuit'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

