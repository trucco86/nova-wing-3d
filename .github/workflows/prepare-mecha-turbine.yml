name: Prepare quieter mecha turbine candidate
on:
  push:
    branches:
      - fix/mecha-thruster-sound-20261028
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref_name == 'fix/mecha-thruster-sound-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Synchronize release 1.27.4
        run: npm run release:prepare -- 1.27.4
      - name: Format touched sources
        run: npx prettier --write src/mecha-thruster-audio.js tests/mecha-dual-aim-thruster.test.mjs
      - run: npm run build
      - run: npm run build:check
      - run: npm run validate
      - name: Commit candidate and generated bundle
        run: |
          if git diff --quiet; then
            echo 'Candidate synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj src/mecha-thruster-audio.js tests/mecha-dual-aim-thruster.test.mjs index.html
          git commit -m 'build(audio): prepare and verify Nova Wing v1.27.4'
          git push origin HEAD:fix/mecha-thruster-sound-20261028
