name: One-time Mars candidate release preparation
on:
  push:
    branches: [feat/mars-storm-moons-warp-exit]
    paths:
      - .github/workflows/mars-candidate-build.yml
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/mars-storm-moons-warp-exit
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.27.63
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Commit generated candidate and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md ios/App/App.xcodeproj/project.pbxproj releases/v1.27.63.md index.html src/mars-premium.js src/mars-sandstorm.js src/bosses.js src/game.js tests/mars-descent.test.mjs tests/mars-storm-evolution.test.mjs tests/boss-spectacle.test.mjs specs/mars-storm-warp-exit.md
          if ! git diff --cached --quiet; then
            git commit -m "build(mars): prepare v1.27.63 validated candidate"
            git push origin HEAD:feat/mars-storm-moons-warp-exit
          fi
