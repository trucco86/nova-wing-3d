name: Prepare web v1.15
on:
  push:
    branches:
      - feat/web-v1-15-hud-settings
permissions:
  contents: write
concurrency:
  group: prepare-web-v1-15
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format, build and validate on the feature branch
        run: |
          npm run format
          npm run build
          npm run validate
      - name: Preserve synchronized sources and generated HTML
        run: |
          git config user.name "nova-wing-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source and generated HTML already synchronized."
            exit 0
          fi
          git commit -m "chore(build): synchronize formatted v1.15 sources and web HTML"
          git push origin HEAD:refs/heads/feat/web-v1-15-hud-settings
