name: One-shot Boss Tactics QA release preparation
on:
  push:
    branches: [feat/boss-tactical-patterns-v12777-20261103]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.27.77
      - name: Write reviewed release documentation
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'CHANGELOG.md';
          let s = readFileSync(file, 'utf8');
          const old = '## 1.27.77 — Candidata em preparação\n\n- Candidata não homologada; preencher entregas e evidências antes da publicação.';
          const next = '## 1.27.77 — Boss Tactical Identity 1.0 (QA)\n\n- Rok: convergência de duas asas e investida frontal, com fuga por altitude ou lateral.\n- Stingray: tesoura vertical das asas e ferrão, com animações específicas e rota segura pelo radar.\n- Carbide: broca frontal ou varredura transversal; a própria broca inclina na preparação.\n- Orion: pulso gravitacional circular ou faixa estreita da íris, selecionados conforme órbita/altitude.\n- Radar compartilha geometria de colisão real com os oito golpes exclusivos e origem física do modelo, preservando o alvo travado no windup e as janelas de contra-ataque.\n- Testes Node e Playwright para quatro lutas reais, sem alterar Devastador, Phoenix, Europa, Hydra, Ômega, Marvin ou as baterias da v1.27.76.\n- QA apenas; falta homologação visual e desempenho em iPhone físico.';
          if (!s.includes(old)) throw new Error('Missing changelog heading placeholder');
          writeFileSync(file, s.replace(old, next));
          writeFileSync('releases/v1.27.77.md', '## Nova Wing 3D v1.27.77 — Boss Tactical Identity · QA\n\n- Oito golpes próprios distribuídos entre Rok, Stingray, Carbide e Orion; cada chefe responde a órbita, altitude e estilo de abordagem do jogador.\n- Padrões de dano e avisos do radar usam exatamente a mesma geometria física, com origem do ataque ancorada em peças visíveis do modelo.\n- Pinças, tesouras, broca e íris agora se preparam e executam movimentos próprios. Ataques travam alvo no windup e preservam contrajogo.\n- Versão empilhada em #265: armas legíveis v1.27.76 e todas as correções anteriores de Saturno/RPG continuam presentes.\n- Testes unitários e browser Playwright. Exige validação visual no iPhone e FPS Alto/Médio.\n\n**Somente QA. Não publicar em produção antes de homologação.**\n');
          NODE
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Commit generated artifacts
        run: |
          git config user.name 'nova-wing-qa-bot'
          git config user.email 'nova-wing-qa-bot@users.noreply.github.com'
          git add package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj index.html CHANGELOG.md releases/v1.27.77.md specs/boss-tactical-patterns-v12777.md src/boss-combat-ai.js src/boss-radar.js src/boss-signature.js src/bosses.js src/game.js tests/boss-tactical-patterns.test.mjs tests/browser/unique-boss-patterns.spec.mjs
          git commit -m 'chore(release): prepare tactical boss identities v1.27.77'
          git push origin HEAD:feat/boss-tactical-patterns-v12777-20261103
