name: Prepare Five Cats cockpit & relay QA v1.27.96
on:
  push:
    branches:
      - feat/cockpit-five-cats-relay-v12796-20261107
    paths:
      - .github/workflows/cockpit-relay-qa96-prepare.yml
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/cockpit-five-cats-relay-v12796-20261107
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare proper version and real release notes
        run: |
          npm run release:prepare -- 1.27.96
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          writeFileSync('releases/v1.27.96.md', [
            '## Nova Wing 3D v1.27.96 — Five Cats Cockpit & Rescue QA',
            '',
            '- 3D cockpit with two pilot-specific animated paws, size and fur color.',
            '- Real calculated speed, equipped weapon, shield, energy and location-based tactical radar.',
            '- Mid-combat cat commander / ship swap (M or touch), nine-second cooldown, preserves hull integrity ratio.',
            '- Damaged ship retreats rather than a cat dying; reserve commander takes control with distinct hull and stats.',
            '- Pilot and ship damage, speed, armor, energy and bomb multipliers applied in real gameplay.',
            '- Keeps the ten-sector QA integrated baseline and approved free-flight collision behavior.',
            '',
            '**QA candidate only: browser desktop/mobile, visual FPS and user sign-off required before production.**',
            '',
          ].join('\n'));
          let log = readFileSync('CHANGELOG.md', 'utf8');
          const marker = '- Candidata não homologada; preencher entregas e evidências antes da publicação.';
          const updated = '- Cockpit Five Cats com patas por piloto, telemetria real, radar e troca de comandante/nave; avaria retira a nave, não mata o gato. Habilidades e classes passam a impactar dano, velocidade e defesa; QA pendente.';
          const heading = log.indexOf('## 1.27.96');
          if (heading < 0) throw new Error('Missing release heading 1.27.96');
          const pos = log.indexOf(marker, heading);
          if (pos >= 0) log = log.slice(0, pos) + updated + log.slice(pos + marker.length);
          writeFileSync('CHANGELOG.md', log);
          NODE
      - name: Format, regenerate the distribution and check all Node gates
        run: |
          npm run format
          npm run build
          npm run build:check
          npm run validate
          git diff --check
      - name: Commit versioned and validated candidate only to isolated feature branch
        run: |
          git add -- package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md releases/v1.27.96.md index.html src/pilot-relay.js src/pilots.js src/cockpit.js src/game.js src/input.js src/shell.html src/styles.css tests/pilot-relay-cockpit.test.mjs tests/browser/pilot-relay-cockpit.spec.mjs specs/cockpit-five-cats-relay-v12796.md
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(qa96): version and synchronize pilot relay cockpit web bundle'
          git push origin HEAD:feat/cockpit-five-cats-relay-v12796-20261107
