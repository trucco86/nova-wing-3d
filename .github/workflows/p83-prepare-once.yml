name: Prepare v1.24.12 unified thumb-dock candidate once
on:
  push:
    branches: [feat/p0-orbit-right-radar-hud-unified-20261026]
    paths: ['.github/workflows/p83-prepare-once.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.24.12
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Commit metadata but exclude workflow edits
        run: |
          git restore --worktree .github/workflows
          git add -A -- . ':!.github/workflows/**'
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(release): prepare v1.24.12 unified right-thumb controls'
            git push origin HEAD:refs/heads/feat/p0-orbit-right-radar-hud-unified-20261026
          fi