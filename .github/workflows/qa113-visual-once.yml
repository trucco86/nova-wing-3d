name: QA113 targeted visual gate once
on:
  push:
    branches:
      - feat/qa113-city40-materials-detail-perf-20261111
    paths:
      - .github/workflows/qa113-visual-once.yml
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - name: Visual A/B desktop and portrait with pixel-delta gate
        run: npx playwright test tests/browser/qa112-graphics40-ab.spec.mjs tests/browser/qa113-premium-pbr-performance.spec.mjs --project=desktop --project=mobile --workers=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qa113-visual-targeted-evidence
          path: |
            test-results/
            playwright-report/

# Retry only after fixing real-scene selection against internal PMREM render passes.

# Retry QA fixture after identifying nested world and FogExp2 instead of direct city children.
