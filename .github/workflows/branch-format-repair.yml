name: Branch format repair
on:
  push:
    branches:
      - 'feat/nw24-robot-prototype'
    paths:
      - '.github/workflows/branch-format-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: format-repair-${{ github.ref }}
  cancel-in-progress: false
jobs:
  format:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format repository source and documentation
        run: npm run format
      - name: Commit only Prettier changes on this feature branch
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply repository Prettier formatting"
          git push origin HEAD:"${GITHUB_REF_NAME}"
