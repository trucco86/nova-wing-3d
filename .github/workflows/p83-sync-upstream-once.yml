name: Sync P83 right-thumb HUD against corrected subboss base
on:
  push:
    branches: [feat/p0-orbit-right-radar-hud-unified-20261026]
    paths: ['.github/workflows/p83-sync-upstream-once.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Integrate upstream lineage retaining validated thumb controls
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin feat/p0-unified-subboss-hud-dev-20261026
          git merge --no-ff --no-edit -X ours origin/feat/p0-unified-subboss-hud-dev-20261026
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Push validated game and generated bundle only
        run: |
          git restore --worktree .github/workflows
          git add -A -- . ':!.github/workflows/**'
          if ! git diff --cached --quiet; then
            git commit -m 'build(P83): reconcile right-thumb UI with latest subboss base'
          fi
          git push origin HEAD:refs/heads/feat/p0-orbit-right-radar-hud-unified-20261026