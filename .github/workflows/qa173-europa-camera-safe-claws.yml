name: QA173 Europa camera-safe Colossus claws
on:
  push:
    branches:
      - feat/alien-worlds-visual-identity-20261120
    paths:
      - .github/workflows/qa173-europa-camera-safe-claws.yml
permissions:
  contents: write
jobs:
  scale-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/alien-worlds-visual-identity-20261120
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Claw scale and full source validation
        run: |
          npx prettier --write src/europa-attack-vfx.js src/game.js tests/europa-attack-vfx.test.mjs tests/browser/europa-claw-strikes.spec.mjs
          npm run lint
          node --test tests/europa-attack-vfx.test.mjs tests/europa-boss-arena.test.mjs tests/boss-signature-scene.test.mjs
          npm run build
          npm run build:check
      - run: npx playwright install chromium
      - name: Real Colossus strike/return and frozen tower motion in desktop and mobile
        run: |
          npx playwright test tests/browser/europa-claw-strikes.spec.mjs tests/browser/europa-motion-depth.spec.mjs --project=desktop --project=mobile --workers=2 --retries=0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qa173-colossus-framing-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
      - name: Sync validated compiled game and formatted files to QA branch
        if: success()
        run: |
          git add -- index.html src/europa-attack-vfx.js src/game.js tests/europa-attack-vfx.test.mjs tests/browser/europa-claw-strikes.spec.mjs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(europa): sync camera-safe claws and focused WebGL QA'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

# QA173 retest: orbit-aware near-camera claw scaling after integrated WebGL gate
