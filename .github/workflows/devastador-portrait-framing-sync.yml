name: Devastador portrait follow camera final QA sync
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/orbit9-devastador-art-pass-20261120
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'feat/devastador-reactor-integrated-access-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format and rebuild responsive camera candidate
        run: |
          npx prettier --write src/orbit9-camera.js src/exploration-preview.js tests/orbit9-stage-art.test.mjs tests/browser/orbit9-stage-art.spec.mjs docs/qa/devastador-reactor-integrated-stage-20261120.md releases/v1.27.158.md
          npm run build
          npm run build:check
          node --test tests/orbit9-stage-art.test.mjs tests/orbit9-camera-and-dialogue.test.mjs tests/orbit9-free-roam.test.mjs tests/devastador-reactor-access.test.mjs
          npx eslint src/orbit9-camera.js src/exploration-preview.js
      - name: Commit synchronized build and remove temporary workflow
        run: |
          git config user.name "Nova Wing QA Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/orbit9-camera.js src/exploration-preview.js tests/orbit9-stage-art.test.mjs tests/browser/orbit9-stage-art.spec.mjs docs/qa/devastador-reactor-integrated-stage-20261120.md releases/v1.27.158.md
          git rm .github/workflows/devastador-portrait-framing-sync.yml
          git diff --cached --quiet || git commit -m "chore(stage4): synchronize responsive Devastador arrival camera"
          git push origin HEAD:feat/devastador-reactor-integrated-access-20261120
