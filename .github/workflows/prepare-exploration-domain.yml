name: Validate Five Cats exploration domain
on:
  push:
    branches: [feat/five-cats-exploration-core]
    paths: [.github/workflows/prepare-exploration-domain.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/exploration-quests.js tests/exploration-quests.test.mjs docs/design/FIVE-CATS-QUEST-FOUNDATION.md
      - run: npm run build:check
      - run: npm run validate
      - name: Persist only formatted exploration files
        run: |
          if git diff --quiet; then
            echo "No formatting drift"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/exploration-quests.js tests/exploration-quests.test.mjs docs/design/FIVE-CATS-QUEST-FOUNDATION.md
          git commit -m "style(explore): deterministic quest foundation and tests"
          git push origin HEAD:feat/five-cats-exploration-core
