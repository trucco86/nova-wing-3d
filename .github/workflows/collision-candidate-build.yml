name: One-time P0 collision bundle synchronization
on:
  push:
    branches: [fix/scene-collision-physics-p0]
    paths:
      - .github/workflows/collision-candidate-build.yml
permissions:
  contents: write
jobs:
  synchronize:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          ref: fix/scene-collision-physics-p0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Commit generated distribution and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/scene-collision.js src/encounters.js src/game.js tests/scene-collision.test.mjs specs/scene-collision-physics.md
          if ! git diff --cached --quiet; then
            git commit -m "build(physics): synchronize generated web bundle and formatting"
            git push origin HEAD:fix/scene-collision-physics-p0
          fi
