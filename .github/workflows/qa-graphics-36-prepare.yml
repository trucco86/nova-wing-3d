name: Prepare Graphics 3.6 Reflex Boost QA
on:
  push:
    branches:
      - feat/graphics-36-reflex-boost-vfx-20261031
    paths:
      - .github/workflows/qa-graphics-36-prepare.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/graphics-36-reflex-boost-vfx-20261031
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.27.41
      - run: npm run format
      - run: npm run build
      - run: npm run build:check
      - run: npm run lint
      - run: npm run test
      - run: npm run validate
      - run: npm run check:repo
      - name: Commit synced web QA build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj index.html src/game.js src/reflex-boost.js src/hero-weapon-vfx.js src/styles.css tests/reflex-boost-vfx.test.mjs CHANGELOG.md releases/v1.27.41.md specs/graphics-3-6-reflex-boost-and-muzzle-vfx.md
          if ! git diff --cached --quiet; then
            git commit -m "build(graphics): sync 1.27.41 Reflex Boost and muzzle flashes QA"
            git push origin HEAD:feat/graphics-36-reflex-boost-vfx-20261031
          fi
