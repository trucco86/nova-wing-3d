name: QA168 Europa visual smoke (desktop and mobile)
on:
  push:
    branches:
      - feat/alien-worlds-visual-identity-20261120
    paths:
      - .github/workflows/qa168-europa-visual-smoke-20261121.yml
permissions:
  contents: read
jobs:
  europa-real-canvas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [desktop, mobile]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:check
      - run: npx playwright install chromium
      - name: Capture real Europa orbit, super boost, frozen cave and boss
        run: npx playwright test tests/browser/qa168-alien-worlds.spec.mjs --project=${{ matrix.target }} --grep 'QA168 europa:|QA168 Europa:' --workers=1 --retries=0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qa168-europa-${{ matrix.target }}-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
