name: Orbit-9 camera-relative controls one-shot sync
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/orbit9-walk-and-gamepad-20261120
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'feat/orbit9-devastador-art-pass-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format and rebuild Orbit-9 controls
        run: |
          npx prettier --write src/orbit9-locomotion.js src/exploration-preview.js src/shell.html src/styles.css tests/orbit9-locomotion.test.mjs tests/browser/exploration-vertical-slice.spec.mjs docs/qa/orbit9-devastador-art-acceptance-20261120.md
          npm run build
          npm run build:check
          node --test tests/orbit9-locomotion.test.mjs tests/orbit9-stage-art.test.mjs
      - name: Commit synchronized QA game and remove temporary workflow
        run: |
          git config user.name "Nova Wing QA Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/orbit9-locomotion.js src/exploration-preview.js src/shell.html src/styles.css tests/orbit9-locomotion.test.mjs tests/browser/exploration-vertical-slice.spec.mjs docs/qa/orbit9-devastador-art-acceptance-20261120.md
          git rm .github/workflows/orbit9-camera-controls-sync.yml
          git diff --cached --quiet || git commit -m "chore(orbit9): synchronize camera-relative movement and thumb orbit QA build"
          git push origin HEAD:feat/orbit9-devastador-art-pass-20261120
