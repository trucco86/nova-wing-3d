name: QA124 temporary release synchronization
on:
  push:
    branches:
      - fix/qa124-boss-encounter-separation-20261113
permissions:
  contents: write
jobs:
  prepare-candidate:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare versioned candidate without deployment
        run: |
          npm run release:prepare -- 1.27.123
          npm run build:check
          node --test tests/encounter-separation.test.mjs
      - name: Commit release metadata and synchronized bundle
        shell: bash
        run: |
          git add package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md releases/v1.27.123.md index.html
          if ! git diff --cached --quiet; then
            git -c user.name='Nova Wing QA Bot' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m 'build(QA124): prepare non-production 1.27.123 candidate'
            git push origin HEAD:fix/qa124-boss-encounter-separation-20261113
          fi
