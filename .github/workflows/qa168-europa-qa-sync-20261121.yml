name: QA168 Europa visual fixes prepare
on:
  push:
    branches:
      - feat/alien-worlds-visual-identity-20261120
    paths:
      - .github/workflows/qa168-europa-qa-sync-20261121.yml
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: feat/alien-worlds-visual-identity-20261120
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format only Europa authored corrections and tests
        run: npx prettier --write src/europa-descent.js src/europa-ice-cavern.js src/encounters.js src/visuals.js tests/dynamic-scene.js tests/europa-descent.test.mjs tests/europa-surface.test.mjs tests/europa-ice-cavern-and-enemies.test.mjs tests/browser/qa168-alien-worlds.spec.mjs
      - name: Validate real Europa descent, cave, boost and world physics
        run: |
          npm run lint
          node --test tests/europa-descent.test.mjs tests/europa-ice-cavern-and-enemies.test.mjs tests/europa-super-boost-weather.test.mjs tests/europa-surface.test.mjs
      - name: Regenerate reproducible web candidate without publishing
        run: |
          npm run build
          npm run build:check
      - name: Commit scoped source and built web to PR head
        run: |
          git add -- index.html src/europa-descent.js src/europa-ice-cavern.js src/encounters.js src/visuals.js tests/dynamic-scene.js tests/europa-descent.test.mjs tests/europa-surface.test.mjs tests/europa-ice-cavern-and-enemies.test.mjs tests/browser/qa168-alien-worlds.spec.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Europa QA sources and web artifact already synchronized"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(europa): sync stage QA and natural ice cave'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

