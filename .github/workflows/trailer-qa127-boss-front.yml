name: QA127 | Front-facing boss arrival before one dramatic orbit
on:
  push:
    branches:
      - feat/qa127-trailer-boss-front-and-original-score-20261114
    paths:
      - trailer/capture-boss-intros-qa127.mjs
      - .github/workflows/trailer-qa127-boss-front.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nova-wing-trailer-qa127-boss-front-${{ github.ref }}
  cancel-in-progress: true
jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NOVA_VISUAL_TEST: '1'
      TRAILER_FPS: '30'
    steps:
      - name: Checkout immutable game source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build latest real game engine and local WebGL fixture
        run: |
          npm run build
          node tools/visual-fixture.mjs
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Install FFmpeg for 4K encoding
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -version | head -n 1
      - name: Serve game locally without public deploy
        run: |
          (npm run dev > /tmp/nova-wing-youtube-server.log 2>&1 &)
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4173/__dynamic.html?sector=0 > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nova-wing-youtube-server.log
          exit 1
      - name: Record all five boss arrivals head-on then Purple Core orbit
        run: node trailer/capture-boss-intros-qa127.mjs
      - name: Verify 5 front-first bosses in original WebGL, 720p30 for 20.5 seconds
        run: |
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,avg_frame_rate -of json artifacts/nova-wing-qa127-front-bosses/nova-wing-qa127-boss-front-720p30-20_5s.mp4
          node --input-type=module -e "import fs from 'node:fs';let d=JSON.parse(fs.readFileSync('artifacts/nova-wing-qa127-front-bosses/provenance.json'));if(d.scenes.length!==5||d.outputWidth!==1280||d.outputHeight!==720||d.outputFps!==30||d.nativeCaptureFps!==30||d.frames!==615||d.frameInterpolation.startsWith('FFmpeg')||d.upscaled)process.exit(1)"
      - name: Upload YouTube cut and capture provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nova-wing-qa127-boss-front-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/nova-wing-qa127-front-bosses/nova-wing-qa127-boss-front-720p30-20_5s.mp4
            artifacts/nova-wing-qa127-front-bosses/provenance.json
