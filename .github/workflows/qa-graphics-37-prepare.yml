name: Prepare Graphics 3.7 hero and mobile QA
on:
  push:
    branches:
      - feat/graphics-37-hero-detail-thumb-arc-20261031
    paths:
      - .github/workflows/qa-graphics-37-prepare.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/graphics-37-hero-detail-thumb-arc-20261031
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.27.42
      - run: npm run format
      - run: npm run build
      - run: npm run build:check
      - run: npm run lint
      - run: npm run test
      - run: npm run validate
      - run: npm run check:repo
      - name: Commit synchronized Graphics 3.7 candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj index.html src/game.js src/visuals.js src/styles.css src/premium-model-details.js tests/mecha-design.test.mjs tests/graphics-3-7-hero-and-mobile.test.mjs tests/browser/mobile-thumb-arcs.spec.mjs specs/graphics-3-7-hero-detail-and-mobile-arcs.md CHANGELOG.md releases/v1.27.42.md
          if ! git diff --cached --quiet; then
            git commit -m "build(graphics): sync v1.27.42 premium hero and mobile thumb arcs QA"
            git push origin HEAD:feat/graphics-37-hero-detail-thumb-arc-20261031
          fi
