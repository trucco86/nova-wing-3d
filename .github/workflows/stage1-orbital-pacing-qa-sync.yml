name: Stage 1 coherent orbital pacing QA build
on:
  push:
    branches:
      - fix/stage1-orbital-pacing-train-clean-route-20261106
permissions:
  contents: write
concurrency:
  group: stage1-orbital-pacing-qa-sync
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format pacing code and browser journeys
        run: |
          npx prettier --write src/stage-one-pacing.js src/game.js tests/stage-one-pacing.test.mjs tests/browser/stage1-orbit-encounter-pacing.spec.mjs
      - name: Verify phase gates, actual BOOST, and existing city and audio gameplay
        run: |
          node --test tests/stage-one-pacing.test.mjs tests/city-stage1-destruction.test.mjs tests/launch-pacing-and-fighters.test.mjs tests/immersive-audio.test.mjs
      - name: Build versioned isolated QA candidate
        run: npm run release:prepare -- 1.27.93
      - name: Release notes
        run: |
          cat > releases/v1.27.93.md <<'NOTES'
          ## Nova Wing 3D v1.27.93 — Fase 1: ritmo consistente entre trem, Super Boost e órbita · QA

          - A queda do trem se torna um encontro exclusivo: depois do aviso, nenhum obstáculo genérico nem novas ondas, subchefes, bases ou inimigos de chão podem atrapalhar a rota de desvio.
          - O Super Boost continua obrigatório. A longa travessia da atmosfera é intencionalmente cinematográfica, sem inimigos ou obstáculos inesperados que obscureçam a transformação do cenário.
          - Novas ondas de caça retornam somente cinco segundos depois de alcançar de fato a órbita terrestre; subchefe recebe entrada separada após 14 segundos na órbita; base-servidor aguarda 23 segundos e a derrota do subchefe, sem aparecer junto.
          - A regra de entrada de naves/tanques terrestres termina na cidade e nunca cria robôs de chão flutuando no espaço.
          - Outros setores, modo clássico e versões sem roteiro da cidade mantêm os encontros anteriores. Controle, áudio, colisões e energia do Super Boost não foram modificados.
          - Testes Node e Playwright verificam cronologia, colisão do trem, obrigação de esgotar o boost e janelas de encontros por fase de voo.

          **Somente QA. Aguarda CI completo e validação visual em celular/desktop; produção inalterada.**
          NOTES
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          s=p.read_text()
          s=s.replace(
            '## 1.27.93 — Candidata em preparação\n\n- Candidata não homologada; preencher entregas e evidências antes da publicação.',
            '## 1.27.93 — Fase 1: ritmo do trem, boost e órbita (QA)\n\n- Encerrada a sobreposição de base e subchefe com trem e travessia atmosférica.\n- Entrada de combate somente após recuperação orbital e com subchefe/base em momentos distintos.\n- Super Boost continua obrigatório; fases 2+ preservadas. Homologação manual pendente.',
          )
          p.write_text(s)
          PY
      - name: Commit synchronized build, tests and source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md releases/v1.27.93.md index.html src/stage-one-pacing.js src/game.js tests/stage-one-pacing.test.mjs tests/browser/stage1-orbit-encounter-pacing.spec.mjs
          if git diff --cached --quiet; then
            echo 'QA candidate already synchronized'
            exit 0
          fi
          git commit -m 'build(stage1): stage coherent train-to-orbit QA candidate v1.27.93'
          git push origin HEAD:fix/stage1-orbital-pacing-train-clean-route-20261106
