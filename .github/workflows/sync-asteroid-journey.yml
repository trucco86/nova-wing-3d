name: Sync asteroid journey preview
on:
  push:
    branches:
      - feat/p1-stage-journey-foundation-20261027
permissions:
  contents: write
concurrency:
  group: asteroid-sync-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sync:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Sync source format and committed web build
        run: |
          npm run format
          npm run build
          npm run validate
      - name: Commit validated source and generated web
        run: |
          git add -- src tests index.html
          if git diff --cached --quiet; then
            echo "Generated web artifact is already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(web): sync and validate mega-asteroid preview'
          git push origin "HEAD:${GITHUB_REF_NAME}"
