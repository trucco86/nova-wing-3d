name: QA182 stage4 source-sync and focused browser verification
on:
  push:
    branches:
      - integration/qa178-europa-premium-all-improvements-20261122
permissions:
  contents: write
concurrency:
  group: qa182-stage4-source-sync
  cancel-in-progress: false
jobs:
  normalize-and-test:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/qa178-europa-premium-all-improvements-20261122
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format updated code and generate actual browser bundle
        run: |
          npm run format
          npm run build
          npm run build:check
          npm run format:check
          node --test tests/orbit9-free-roam.test.mjs
      - name: Persist normalized QA182 source on candidate branch only
        run: |
          git add -- src/orbit9-free-roam.js src/exploration-preview.js src/styles.css tests/orbit9-free-roam.test.mjs index.html
          if ! git diff --cached --quiet; then
            git -c user.name='nova-wing-qa-bot' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(QA182): format and rebuild reactor candidate'
            git push origin HEAD:refs/heads/integration/qa178-europa-premium-all-improvements-20261122
          fi
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Targeted reactor viewport and physical-walk browser checks
        run: npx playwright test tests/browser/reactor-hud-lanes.spec.mjs tests/browser/exploration-vertical-slice.spec.mjs --project=desktop --project=mobile --workers=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa182-reactor-targeted-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
