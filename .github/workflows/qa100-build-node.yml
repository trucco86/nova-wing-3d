name: QA100 pooled upper skybridges Node validation and bundle
on:
  push:
    branches: [feat/qa100-upper-skybridges-20261107]
    paths: [.github/workflows/qa100-build-node.yml]
permissions:
  contents: write
jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/qa100-upper-skybridges-20261107
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format, build, check release invariants and run full Node suite
        run: |
          npm run format
          npm run build
          npm run check:repo
          npm run build:check
          npm run validate
          git diff --check
      - name: Commit only generated HTML and formatted source and tests
        run: |
          git add -- src/city-upper-bridges.js src/city-local-solids.js src/city-collision.js src/visuals.js src/game.js tests/game.test.mjs tests/qa99-vertical-overpass.test.mjs tests/qa100-upper-bridges.test.mjs tests/browser/qa99-open-flight-and-viaduct.spec.mjs tests/browser/qa100-upper-bridge-approach.spec.mjs tests/browser/web-v120.spec.mjs specs/qa100-playable-upper-skybridges.md index.html
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(QA100): validated accessible skybridges, physical upper route and generated HTML'
          git push origin HEAD:feat/qa100-upper-skybridges-20261107
