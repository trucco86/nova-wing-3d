name: Native 4K60 phase 8 frontal recapture
on:
  push:
    branches: [media/gameplay-10min-revision-v4]
    paths:
      - 'tools/media-capture-phase8-frontal.mjs'
      - '.github/workflows/gameplay-phase8-frontal-recapture.yml'
permissions:
  contents: read
concurrency:
  group: gameplay-phase8-frontal-recapture
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SOURCE_COMMIT: 613f0ff30cfe971259184ad062a8fdb3e882e80e
      SAMPLE_SECONDS: 30
      WARMUP_SECONDS: 0
      SECTOR: 7
      BOSS: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Verify gameplay source provenance
        run: git diff --exit-code "$SOURCE_COMMIT" HEAD -- src package.json package-lock.json tests/dynamic-scene.js tools/visual-fixture.mjs
      - run: npm ci
      - run: npm run agent:context -- --mapa
      - run: node --check tools/media-capture-phase8-frontal.mjs
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: node tools/visual-fixture.mjs
      - name: Capture deterministic frontal boss gameplay
        run: |
          NOVA_VISUAL_TEST=1 node tools/serve.mjs --port 4187 > /tmp/nova-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4187/__dynamic.html -o /dev/null; then break; fi
            sleep 1
          done
          node tools/media-capture-phase8-frontal.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v4-phase8-boss-frontal-safe-arc
          path: |
            artifacts/native-4k60-phase8-frontal/*.mp4
            artifacts/native-4k60-phase8-frontal/*.json
            artifacts/native-4k60-phase8-frontal/*.png
          retention-days: 14
