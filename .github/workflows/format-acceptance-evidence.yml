name: Format DEV acceptance evidence
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/format-acceptance-evidence.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/case/EVIDENCIAS.md
      - run: npm run validate
      - name: Commit formatted evidence
        run: |
          if git diff --quiet -- docs/case/EVIDENCIAS.md; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/case/EVIDENCIAS.md
          git commit -m "style(docs): format DEV acceptance evidence"
          git push origin HEAD:dev
