name: Prepare Omega v1.27.73 QA release
on:
  push:
    branches: [fix/omega-rear-delay-stationary-saturn-20261102]
    paths: ['.github/workflows/omega-v12773-qa-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/omega-rear-delay-stationary-saturn-20261102
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare semver and user-facing release notes
        run: |
          npm run release:prepare -- 1.27.73
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          t=p.read_text()
          t=t.replace('## 1.27.73 — Candidata em preparação', '## 1.27.73 — Ômega: giro após retaguarda sustentada, Saturno estático (QA)')
          t=t.replace('- Candidata não homologada; preencher entregas e evidências antes da publicação.', '- Fase 8: nave/câmera orbitam o Ômega mantendo Saturno, anéis e a arena estacionários.\n- Ômega só gira o próprio casco após o jogador permanecer 1,8 s atrás dele; sair antes reinicia a percepção. Ao encarar a nave, encerra o rastreamento até nova incursão traseira.\n- Preservados ataques, módulos destrutíveis, pontos fracos, UI e gameplay específico do núcleo da fase 4.\n- Testes de duração da retaguarda, reinício, giro limitado, órbita da nave e invariância do planeta. Em QA; não publicar sem homologação visual e FPS Alto/Médio.')
          p.write_text(t)
          Path('releases/v1.27.73.md').write_text('## Nova Wing 3D v1.27.73 — candidata QA\n\n- Fase 8: Saturno e anéis não giram com a câmera; nave orbita o Ômega com a arena fixa.\n- O chefe percebe o jogador após 1,8 s contínuos na retaguarda e gira o próprio casco gradualmente para encará-lo.\n- Sair da retaguarda antes do gatilho cancela a reação; os geradores traseiros permanecem alcançáveis.\n- Sem mudanças na mecânica especial da fase 4, progresso, saves ou produção.\n- Testes Node e CI, preview visual mobile/desktop e medições FPS Alto/Médio são critérios para aprovação.\n\n**Candidata para homologação; não publicar diretamente em produção.**\n')
          PY
      - name: Validate and build synchronized web candidate
        run: |
          npm run format
          npm run build
          npm run validate
      - name: Commit prepared release without deploying main
        run: |
          git add -- package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md releases/v1.27.73.md index.html src/omega-hunt.js src/game.js tests/omega-hunt.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Release candidate synchronized'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(release): prepare Omega static arena QA v1.27.73'
            git push origin HEAD:fix/omega-rear-delay-stationary-saturn-20261102
          fi
