name: Stage 04 complete gate synchronization
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/orbit9-devastador-art-pass-20261120
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'feat/devastador-reactor-integrated-access-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format, build and run ALL validation checks
        run: |
          npx prettier --write src/game.js
          npm run build
          npm run build:check
          npm run validate
      - name: Commit verified candidate and self-remove
        run: |
          git config user.name "Nova Wing QA Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/game.js
          git rm .github/workflows/stage4-import-gate-sync.yml
          git diff --cached --quiet || git commit -m "chore(stage4): validate and sync complete reactor access release"
          git push origin HEAD:feat/devastador-reactor-integrated-access-20261120
