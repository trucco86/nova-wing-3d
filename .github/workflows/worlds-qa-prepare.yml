name: Synchronize Worlds QA preview bundle
on:
  push:
    branches: [feat/world-motion-identity-20261102]
    paths:
      - src/living-world-depth.js
      - tests/living-world-depth.test.mjs
      - .github/workflows/worlds-qa-prepare.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          ref: feat/world-motion-identity-20261102
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format and generate canonical HTML
        run: |
          npm run format
          npm run build
          npm run validate
      - name: Commit source formatting and generated bundle
        run: |
          git add -- src/living-world-depth.js tests/living-world-depth.test.mjs index.html
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(qa): format and synchronize world identities'
            git push origin HEAD:feat/world-motion-identity-20261102
          fi
