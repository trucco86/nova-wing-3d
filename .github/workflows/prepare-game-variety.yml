name: Prepare Nova Wing v1.27.6 game design candidate
on:
  push:
    branches:
      - feat/stage-diversity-boss-combat-v1276
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref_name == 'feat/stage-diversity-boss-combat-v1276'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Synchronize v1.27.6
        run: npm run release:prepare -- 1.27.6
      - name: Format implementation and documentation
        run: |
          npx prettier --write src/stage-variety.js src/boss-director.js src/visuals.js src/flight.js src/game.js src/combat.js src/bosses.js src/encounters.js tests/stage-variety.test.mjs tests/boss-director.test.mjs tests/stage-combat-variety.test.mjs tests/tactics.test.mjs tests/boss-spectacle.test.mjs docs/design/FIVE-CATS-UNIVERSE.md CHANGELOG.md releases/v1.27.6.md
      - run: npm run build
      - run: npm run build:check
      - run: npm run validate
      - name: Versioned source plus bundle
        run: |
          if git diff --quiet; then
            echo "All sources and generated bundle already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj src tests/stage-variety.test.mjs tests/boss-director.test.mjs tests/stage-combat-variety.test.mjs tests/tactics.test.mjs tests/boss-spectacle.test.mjs docs/design/FIVE-CATS-UNIVERSE.md CHANGELOG.md releases/v1.27.6.md index.html
          git commit -m "build(dev): verify v1.27.6 authored worlds and boss combat"
          git push origin HEAD:feat/stage-diversity-boss-combat-v1276
