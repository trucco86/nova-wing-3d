name: Rebuild Mecha visibility preview after P0 correction
on:
  push:
    branches: [feat/mecha2-clean-dev-v1250-20261027]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.repository == 'trucco86/nova-wing-3d' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Commit synchronized P0 mecha fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html src/game.js tests/mecha-design.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'build(P0/mecha): sync visibility fix and tests in v1.25.0'
            git push origin HEAD:feat/mecha2-clean-dev-v1250-20261027
          fi
