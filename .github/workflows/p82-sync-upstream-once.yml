name: Sync P82 subboss HUD with verified P81 ancestry
on:
  push:
    branches: [feat/p0-unified-subboss-hud-dev-20261026]
    paths: ['.github/workflows/p82-sync-upstream-once.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Merge upstream while preserving P82 retreat contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin feat/p0-hud-impact-subboss-edge-20261025
          git merge --no-ff --no-edit -X ours origin/feat/p0-hud-impact-subboss-edge-20261025
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Save validated bundle without workflow changes
        run: |
          git restore --worktree .github/workflows
          git add -A -- . ':!.github/workflows/**'
          if ! git diff --cached --quiet; then
            git commit -m 'build(P82): reconcile retreat and upstream HUD gates'
          fi
          git push origin HEAD:refs/heads/feat/p0-unified-subboss-hud-dev-20261026