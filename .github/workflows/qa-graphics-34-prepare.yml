name: Prepare Graphics 3.4 clean fighter QA
on:
  push:
    branches:
      - feat/graphics-34-clean-nova7-mecha-20261031
    paths:
      - .github/workflows/qa-graphics-34-prepare.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/graphics-34-clean-nova7-mecha-20261031
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.27.38
      - run: npm run format
      - run: npm run build
      - run: npm run build:check
      - run: npm run lint
      - run: npm run test
      - run: npm run validate
      - name: Commit generated HTML and release metadata to draft branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj index.html src/visuals.js src/game.js src/premium-model-details.js tests/graphics-3-3-premium-models.test.mjs CHANGELOG.md releases/v1.27.38.md specs/graphics-3-4-clean-hero-mecha.md
          if ! git diff --cached --quiet; then
            git commit -m "build(graphics): prepare 1.27.38 clean futuristic fighter and mecha QA"
            git push origin HEAD:feat/graphics-34-clean-nova7-mecha-20261031
          fi
