name: Prepare isolated compact menu production release
on:
  push:
    branches: [release/compact-menus-main-20261102]
    paths: [.github/workflows/prepare-compact-menu-production.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'trucco86/nova-wing-3d' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.27.62
      - run: npm run format
      - run: npm run build
      - name: Commit synchronized release artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src tests specs docs releases index.html package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "build: prepare compact menus v1.27.62 from main"
            git push origin HEAD:release/compact-menus-main-20261102
          fi
      - run: npm run validate
