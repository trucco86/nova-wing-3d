name: QA444 temporary formatting repair
on:
  push:
    branches: [feat/gameplay-quality-agent-observer]
permissions:
  contents: write
jobs:
  formatter:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format only QA444 changed sources
        run: |
          npx prettier --write \
            tests/browser/gameplay-quality-observer.spec.mjs \
            tests/gameplay-quality-report.mjs \
            tools/gameplay-observer-summary.mjs \
            tests/gameplay-observer-summary.test.mjs \
            docs/GAMEPLAY-QUALITY-AGENT.md \
            .github/workflows/gameplay-observer.yml
      - name: Commit scoped formatting
        run: |
          git add -- \
            tests/browser/gameplay-quality-observer.spec.mjs \
            tests/gameplay-quality-report.mjs \
            tools/gameplay-observer-summary.mjs \
            tests/gameplay-observer-summary.test.mjs \
            docs/GAMEPLAY-QUALITY-AGENT.md \
            .github/workflows/gameplay-observer.yml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(QA444): format observer, summary and scheduled workflow'
          git push origin "HEAD:${GITHUB_REF_NAME}"
