name: One-shot formatting repair for Europa camera regression
on:
  push:
    branches: [fix/europa-boss-clear-arena-20261104]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/flight-cameras.test.mjs
      - run: npm run format:check
      - run: npm run build:check
      - name: Commit reproducible formatting only
        run: |
          git config user.name 'nova-wing-qa-bot'
          git config user.email 'nova-wing-qa-bot@users.noreply.github.com'
          git add tests/flight-cameras.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'style(test): format stage 6 portrait FOV regression'
            git push origin HEAD:fix/europa-boss-clear-arena-20261104
          fi
