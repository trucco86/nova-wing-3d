name: Rebuild sector palette index from verified source
on:
  push:
    branches: [feat/p0-sector-palettes-clean-v12420-20261027]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.repository == 'trucco86/nova-wing-3d' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate
      - name: Commit generated web artifact only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(P0/arte): restore generated v1.24.20 web artifact'
            git push origin HEAD:feat/p0-sector-palettes-clean-v12420-20261027
          fi
