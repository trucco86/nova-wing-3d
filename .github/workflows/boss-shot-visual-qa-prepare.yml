name: One-shot Boss Shot Visual QA release preparation
on:
  push:
    branches: [feat/boss-muzzle-shot-link-20261104]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.27.78
      - name: Write validated candidate release notes
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'CHANGELOG.md';
          const s = readFileSync(file, 'utf8');
          const old = '## 1.27.78 — Candidata em preparação\n\n- Candidata não homologada; preencher entregas e evidências antes da publicação.';
          const next = '## 1.27.78 — Boss Shot Readability 2.0 (QA)\n\n- Canhões de dez chefes com boca física de alto contraste, halo de preparação proporcional à carga e flash luminoso quando o canhão dispara.\n- Projéteis de chefes agora exibem ligação luminosa temporária de até 0,42 segundo entre o ponto real de saída e o projétil; conexão reutilizada com pooling e removida depois do disparo.\n- Materiais, projéteis, colisões, dano, homing, velocidade, limite de projéteis e cadência preservados. Baterias destruídas não brilham nem disparam.\n- Testes unitários validam alinhamento de bocal, flash, reciclagem de projéteis e duração do efeito. Playwright captura tiros reais de Europa e Ômega.\n- Avaliação visual no iPhone físico e FPS Alto/Médio permanecem obrigatórios antes de produção.';
          if (!s.includes(old)) throw new Error('Missing changelog placeholder');
          writeFileSync(file, s.replace(old, next));
          writeFileSync('releases/v1.27.78.md',
            '## Nova Wing 3D v1.27.78 — Boss Shot Readability 2.0 · QA\n\n' +
            '- Bocais mais claros, charge-up por bateria e flashes reais de disparo em dez chefes.\n' +
            '- Uma ligação luminosa curta revela a trajetória entre canhão e projétil na saída, sem mexer em física e dano.\n' +
            '- Limite temporal de 0,42 segundo e reutilização dos meshes reduzem ruído e custo no mobile.\n' +
            '- Preserva as estratégias de Rok, Stingray, Carbide e Órion 1.27.77, a fase 8 e os controles RPG/ORBITAR anteriores.\n' +
            '- Testes Node e Playwright para canhões destruídos e disparos reais, com QA visual e performance física pendentes.\n\n' +
            '**Somente QA. Não publicar em produção antes de homologação.**\n');
          NODE
      - run: npm run format
      - run: npm run build
      - run: npm run validate
      - name: Commit generated QA artifacts
        run: |
          git config user.name 'nova-wing-qa-bot'
          git config user.email 'nova-wing-qa-bot@users.noreply.github.com'
          git add package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj index.html CHANGELOG.md releases/v1.27.78.md specs/boss-muzzle-shot-link-v12778.md src/boss-weapon-vfx.js src/hostile-projectile-pool.js src/game.js tests/boss-weapon-vfx.test.mjs tests/hostile-projectile-pool.test.mjs tests/browser/boss-physical-muzzle-link.spec.mjs
          git commit -m 'chore(release): prepare boss shot readability v1.27.78'
          git push origin HEAD:feat/boss-muzzle-shot-link-20261104
