name: Compile isolated sector waves bundle
on:
  push:
    branches: ['feat/nova-wing-sector-wave-director-v12714']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nova-sector-wave-compiler-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-bundle:
    if: github.repository == 'trucco86/nova-wing-3d' && github.ref == 'refs/heads/feat/nova-wing-sector-wave-director-v12714'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/nova-wing-sector-wave-director-v12714
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generate deterministic WebGL bundle
        run: npm run build
      - name: Commit generated index on feature branch only
        run: |
          git add index.html
          if git diff --cached --quiet; then
            echo 'Bundle synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(waves): regenerate WebGL feature bundle'
          git push origin HEAD:refs/heads/feat/nova-wing-sector-wave-director-v12714
