name: QA102 premium inhabited city build and Node gate
# Rerun after aligning instance-matrix assertions to Float32 precision.
# Rerun after removing unused model allocation bindings reported by strict lint.
on:
  push:
    branches: [feat/qa102-premium-city-life-20261107]
    paths: [.github/workflows/qa102-build-node.yml]
permissions:
  contents: write
jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/qa102-premium-city-life-20261107
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format and build, then run full Node and repository gates
        run: |
          npm run format
          npm run build
          npm run check:repo
          npm run build:check
          npm run validate
          git diff --check
      - name: Commit only formatted source tests and generated web bundle
        run: |
          git add -- src/city-35-lived-in.js src/visuals.js src/game.js tests/city-35-lived-in.test.mjs tests/browser/qa102-premium-city-life.spec.mjs specs/qa102-premium-city-life.md index.html
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(QA102): validate and compile premium inhabited city details'
          git push origin HEAD:feat/qa102-premium-city-life-20261107
