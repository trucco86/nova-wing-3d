name: Graphics 6 P0 release preparation
on:
  pull_request:
    branches:
      - feat/graphics-5-pbr-assets-p0-20261030
permissions:
  contents: write
concurrency:
  group: graphics-6-p0-prepare
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Release, format and validate
        run: |
          npm run release:prepare -- 1.27.30
          npm run format
          npm run build
          npm run validate
      - name: Write accurate QA notes
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const nl = String.fromCharCode(10);
          const changelog = 'CHANGELOG.md';
          const old = readFileSync(changelog, 'utf8');
          const placeholder = [
            '## 1.27.30 — Candidata em preparação', '',
            '- Candidata não homologada; preencher entregas e evidências antes da publicação.'
          ].join(nl);
          if (!old.includes(placeholder)) throw new Error('Expected changelog placeholder not found');
          const next = [
            '## 1.27.30 — Cinematic Flagship, IBL and Boost VFX (QA)', '',
            '- Devastador com casco original, asas, motores e hangar de lançamento no perfil Alto.',
            '- PMREM com luzes de estúdio originais para reflexo PBR, calculado uma vez e desligado em Médio.',
            '- Boost de nave e robô com plasma e halo animados de acordo com o comando BOOST.',
            '- Hitboxes, boss emergence, menus, save e progressão sem alterações.',
            '- QA visual/FPS real ainda necessários, sem promoção DEV/HML/PROD.'
          ].join(nl);
          writeFileSync(changelog, old.replace(placeholder, next));
          const notes = [
            '## Nova Wing 3D v1.27.30 — Candidata QA isolada', '',
            '- Novo casco Devastador esculpido e diferenciado no perfil Alto.',
            '- Iluminação PBR cinematográfica derivada de softboxes originais, sem serviços externos.',
            '- Plasma de boost e turbina para caça e robô, sem alterar gameplay.',
            '- Modo Médio utiliza renderização anterior e evita custos adicionais de GPU.',
            '- 4 shards Playwright, validação perceptiva e FPS real ainda obrigatórios para liberar.',
            '',
            '**Não publicar sem aceite dos gates.**',
            ''
          ].join(nl);
          writeFileSync('releases/v1.27.30.md', notes);
          NODE
          npm run format
          npm run build
          npm run validate
      - name: Commit build and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/graphics-6-prepare.yml
          git add -A
          git commit -m "chore(graphics6): prepare QA release 1.27.30 [graphics6-built]"
          git push
