name: QA128 temporary map candidate synchronization
on:
  push:
    branches:
      - feat/qa128-galaxy-campaign-map-premium-20261114
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format and test the premium campaign map
        run: |
          npx prettier --write src/campaign-map.js src/campaign-map-art.js src/styles.css src/shell.html tests/qa128-galaxy-campaign-map.test.mjs
          node --test tests/qa128-galaxy-campaign-map.test.mjs
      - name: Prepare candidate without a production deploy
        run: |
          npm run release:prepare -- 1.27.127
          npm run build:check
      - name: Commit formatted map, bundle and release metadata
        shell: bash
        run: |
          git add src/campaign-map.js src/campaign-map-art.js src/styles.css src/shell.html tests/qa128-galaxy-campaign-map.test.mjs package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md releases/v1.27.127.md index.html
          if ! git diff --cached --quiet; then
            git -c user.name='Nova Wing QA Bot' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m 'build(QA128): package premium galactic campaign map candidate'
            git push origin HEAD:feat/qa128-galaxy-campaign-map-premium-20261114
          fi
