name: Prepare updated scatter and briefing candidate
on:
  push:
    branches: [feat/p1-scatter-cannon-hangar-20261027]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'trucco86/nova-wing-3d' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare -- 1.24.19
      - run: npm run format
      - run: npm run validate
      - name: Commit synchronized web bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json CHANGELOG.md releases/v1.24.19.md index.html ios/App/App.xcodeproj/project.pbxproj src/styles.css tests/browser/scatter-hangar.spec.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'build(armory): synchronize v1.24.19 after mobile briefing fix'
            git push origin HEAD:feat/p1-scatter-cannon-hangar-20261027
          fi
