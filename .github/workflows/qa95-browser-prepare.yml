name: Prepare Nova Wing QA v1.27.95 browser repair release
on:
  push:
    branches:
      - fix/qa94-browser-gates-and-dash-20261107
    paths:
      - .github/workflows/qa95-browser-prepare.yml
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/qa94-browser-gates-and-dash-20261107
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare release v1.27.95 with verifiable change notes
        run: |
          npm run release:prepare -- 1.27.95
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const notes = [
            '## Nova Wing 3D v1.27.95 — QA integrada, correções de navegador',
            '',
            '- Preserva a campanha integrada de dez setores da QA v1.27.94.',
            '- Hangar compacto: abas PILOTOS, NAVES e ARSENAL escondem o conteúdo de outras abas e conservam o preview 360°.',
            '- Tela QA compacta: painel de configuração recolhido por padrão, botão VOLTAR alcançável.',
            '- Robô: DASH por toque/Z, com joystick neutro, usa a última direção lateral; nave mantém o giro.',
            '- Regressões Berserk/QA abrem o painel explicitamente; teste isolado do subchefe antigo não desativa o roteiro orbital da campanha real.',
            '',
            '**Somente QA. Requer Playwright desktop/mobile, validação visual e FPS reais antes de qualquer produção.**',
            ''
          ].join('\n');
          writeFileSync('releases/v1.27.95.md', notes);
          let log = readFileSync('CHANGELOG.md', 'utf8');
          const old = '- Candidata não homologada; preencher entregas e evidências antes da publicação.';
          const entry = '- QA integrada 1.27.95: corrigidos hangar/QA compactos, direção do DASH e regressões do navegador, preservando todos os setores e o ritmo orbital. Homologação pendente.';
          const position = log.indexOf('## 1.27.95');
          if (position >= 0) {
            const placeholder = log.indexOf(old, position);
            if (placeholder >= 0) log = log.slice(0, placeholder) + entry + log.slice(placeholder + old.length);
          }
          writeFileSync('CHANGELOG.md', log);
          NODE
      - name: Format, build and validate exact release source
        run: |
          npm run format
          npm run build
          npm run build:check
          npm run validate
          git diff --check
      - name: Commit versioned candidate on QA repair branch only
        run: |
          git add -- package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md releases/v1.27.95.md index.html
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(qa95): version repaired integrated candidate and sync single-file game'
          git push origin HEAD:fix/qa94-browser-gates-and-dash-20261107
