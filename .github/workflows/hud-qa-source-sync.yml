name: HUD QA generated build sync
on:
  push:
    branches:
      - feat/hud-priority-message-triage-20261104
permissions:
  contents: write
concurrency:
  group: hud-qa-source-sync
  cancel-in-progress: true
jobs:
  sync:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format only changed HUD and regression files
        run: |
          npx prettier --write src/game.js src/hud-message-policy.js src/styles.css tests/browser/boss-combat-qa-chain.spec.mjs tests/hud-message-policy.test.mjs
      - name: Rebuild committed web bundle from source
        run: npm run build
      - name: Commit generated HTML and explicit HUD source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html src/game.js src/hud-message-policy.js src/styles.css tests/browser/boss-combat-qa-chain.spec.mjs tests/hud-message-policy.test.mjs
          if git diff --cached --quiet; then
            echo 'HUD source and generated web already synchronized.'
            exit 0
          fi
          git commit -m 'build(hud): sync v1.27.83 browser bundle and regression fixes'
          git push origin HEAD:feat/hud-priority-message-triage-20261104
