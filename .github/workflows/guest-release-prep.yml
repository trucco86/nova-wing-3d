name: Prepare guest-session candidate (one-off)
on:
  push:
    branches: [fix/guest-signout-1-24-3]

permissions:
  contents: write

concurrency:
  group: guest-release-candidate-1-24-3
  cancel-in-progress: false

jobs:
  prepare:
    if: "!contains(github.event.head_commit.message, '[skip prep]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare coordinated candidate release
        run: npm run release:prepare -- 1.24.3
      - name: Update release evidence and notes
        run: |
          cat > releases/v1.24.3.md <<'EOF'
          ## Nova Wing 3D v1.24.3 — candidata DEV

          - Corrige a transição para visitante: Firebase signOut confirmado antes de ocultar o painel.
          - Aguarda inicialização do Firebase ao trocar de conta e impede indicação falsa de logout.
          - Inclui testes de sessão persistente simulada, erro e corrida de inicialização.
          - **Não homologada:** popup, redirect, reload e logout real exigem teste no domínio DEV.

          **Não publicar em HML ou PROD antes dos gates e do aceite funcional.**
          EOF
          node --input-type=module - <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'CHANGELOG.md';
          const content = readFileSync(file, 'utf8');
          const expected = '- Candidata não homologada; preencher entregas e evidências antes da publicação.';
          if (!content.includes(expected)) throw new Error('Release changelog placeholder missing');
          const next = content.replace(expected, '- Firebase Authentication: transição para modo visitante aguarda signOut e mantém status fiel; validação OAuth real pendente.');
          writeFileSync(file, next);
          JS
      - name: Format source and docs
        run: npm run format
      - name: Validate generated candidate
        run: npm run validate
      - name: Commit prepared version and remove one-off workflow
        run: |
          git rm .github/workflows/guest-release-prep.yml
          git add src/ tests/ docs/ package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md releases/v1.24.3.md index.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(release): prepare guest logout v1.24.3 [skip prep]'
          git push origin HEAD:refs/heads/fix/guest-signout-1-24-3
