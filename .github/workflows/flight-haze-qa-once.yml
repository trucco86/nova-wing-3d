name: QA gradual atmospheric glow and renew isolated orbital preview (one-off)
on:
  push:
    branches: [feat/p0-sector-flight-orbit-dev-20261025]
    paths: ['.github/workflows/flight-haze-qa-once.yml']
permissions:
  contents: write
jobs:
  haze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: nova-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/visuals.js tests/flight-launch-visual.test.mjs tests/browser/launch-orbit.spec.mjs
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build:check
      - name: Test launch and atmospheric shade state machine
        run: node --test tests/orbital-launch.test.mjs tests/flight-launch-visual.test.mjs tests/launch-pacing-and-fighters.test.mjs
      - run: npx playwright install chromium
      - name: Regress launch, atmosphere and orbit on desktop/mobile
        run: npx playwright test tests/browser/launch-orbit.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boost-orbit-haze-webgl-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
      - name: Build isolated review package
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          touch dist/.nojekyll
          printf 'sha=%s\nsource=atmospheric-haze-targeted-qa\n' "$GITHUB_SHA" > dist/BUILD.txt
      - name: Require separate preview credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: test -n "$CF_TOKEN" && test -n "$CF_ACCOUNT"
      - name: Deploy only PR-71 preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=nova-wing-preview --branch=pr-71
      - name: Remove temporary QA workflow, commit built content
        run: |
          git rm .github/workflows/flight-haze-qa-once.yml
          git add src/visuals.js tests/flight-launch-visual.test.mjs tests/browser/launch-orbit.spec.mjs index.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(flight): atmospheric haze QA and synchronized preview'
          git push origin HEAD:refs/heads/feat/p0-sector-flight-orbit-dev-20261025
