name: Source repair check
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  repair-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format and build in isolated runner
        run: |
          npm run format
          npm run build
      - name: Show generated changes
        run: git status --short
      - name: Display Prettier repair patch
        run: git diff -- src/game.js
      - name: Validate repaired workspace
        run: npm run validate
      - name: Upload generated index for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: generated-index
          path: index.html
