name: Source repair check
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  repair-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format and build in isolated runner
        run: |
          npm run format
          npm run build
      - name: Show generated changes
        run: git status --short
      - name: Show automated source formatting patch
        run: git diff -- src tools tests specs docs skills .github README.md
      - name: Validate repaired workspace
        run: npm run validate
      - name: Upload generated index for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: generated-index
          path: index.html

  sync-qa175-generated-index:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 425 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'integration/qa175-reactor-full-vertical-slice-20261121' }}
    needs: repair-diagnostics
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact QA175 head branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Download validated generated HTML
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: generated-index
          path: .
      - name: Commit generated HTML only if branch is unchanged
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git diff --check -- index.html
          if git diff --quiet -- index.html; then
            echo 'Generated HTML already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'build(QA175): synchronize generated HTML'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH" --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD"
