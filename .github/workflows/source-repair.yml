name: Source repair check
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: write
jobs:
  repair-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format and build in isolated runner
        run: |
          npm run format
          npm run build
      - name: Show generated changes
        run: git status --short
      - name: Show automated source formatting patch
        run: git diff -- src tools tests specs docs skills .github README.md
      - name: Validate repaired workspace
        run: npm run validate
      - name: Upload generated index for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: generated-index
          path: index.html

  sync-i18n-branch:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 258 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/i18n-compact-menu-20261102' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated bundle only
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'build(web): synchronize generated i18n bundle'
          git push origin HEAD:fix/i18n-compact-menu-20261102
