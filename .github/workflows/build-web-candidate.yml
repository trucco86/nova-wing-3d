name: Build web candidate once
on:
  push:
    branches:
      - feat/nw24-robot-prototype
    paths:
      - .github/workflows/build-web-candidate.yml
      - src/styles.css
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run format:check
      - name: Commit generated web bundle
        run: |
          if git diff --quiet -- index.html; then
            echo "Bundle already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "build(web): generate v1.24.1 candidate bundle"
          git push origin HEAD:"${GITHUB_REF_NAME}"
