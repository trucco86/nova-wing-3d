name: Prepare Graphics 3.0 wet city QA
on:
  push:
    branches: [feat/graphics-30-wet-neon-city-v12732-qa-20261030]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  synchronize:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare version, format, build and verify Web package
        run: |
          npm run release:prepare -- 1.27.32
          npm run format
          npm run build
          npm run build:check
          npm run validate
      - name: Commit exact browser bundle with release notes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/premium-wet-road.js src/premium-road-dressing.js src/visuals.js tests/graphics.test.mjs tests/graphics-30-wet-city-v12732.test.mjs tests/browser/graphics-30-city-light.spec.mjs tests/browser/mission-balance.spec.mjs specs/graphics-30-wet-neon-city-v12732.md index.html package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj CHANGELOG.md releases/v1.27.32.md
          if git diff --cached --quiet; then
            echo 'Source and bundle already synchronized'
            exit 0
          fi
          git commit -m 'build(graphics): prepare v1.27.32 wet city QA package'
          git push origin HEAD:feat/graphics-30-wet-neon-city-v12732-qa-20261030
