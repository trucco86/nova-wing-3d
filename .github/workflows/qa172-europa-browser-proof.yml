name: QA172 Europa depth and boss claw real browser proof
on:
  push:
    branches:
      - feat/alien-worlds-visual-identity-20261120
    paths:
      - .github/workflows/qa172-europa-browser-proof.yml
permissions:
  contents: read
jobs:
  live-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [desktop, mobile]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/alien-worlds-visual-identity-20261120
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:check
      - run: npx playwright install chromium
      - name: Verify actual stage movement and persistent boss claws
        run: >-
          npx playwright test tests/browser/europa-motion-depth.spec.mjs tests/browser/europa-claw-strikes.spec.mjs
          --project=${{ matrix.target }} --workers=1 --retries=0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qa172-motion-claws-${{ matrix.target }}-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
