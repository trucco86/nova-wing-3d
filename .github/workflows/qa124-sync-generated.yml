name: QA124 temporary bundle sync
on:
  push:
    branches:
      - fix/qa124-boss-encounter-separation-20261113
permissions:
  contents: write
jobs:
  sync-generated:
    if: github.repository == 'trucco86/nova-wing-3d'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply repository formatting
        run: npx prettier --write src/game.js tests/encounter-separation.test.mjs
      - name: Generate and verify gameplay bundle
        run: |
          npm run build
          npm run build:check
          node --test tests/encounter-separation.test.mjs
      - name: Commit generated index and formatting on QA branch only
        shell: bash
        run: |
          git add src/game.js tests/encounter-separation.test.mjs index.html
          if ! git diff --cached --quiet; then
            git -c user.name='Nova Wing QA Bot' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m 'build(QA124): format and sync generated gameplay bundle'
            git push origin HEAD:fix/qa124-boss-encounter-separation-20261113
          fi
