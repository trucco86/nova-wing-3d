name: One-time unified QA branch merge
on:
  pull_request:
    paths:
      - .github/workflows/unified-merge-conflicts-qa.yml
permissions:
  contents: write
jobs:
  integration:
    if: github.event.pull_request.number == 287
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: qa/integrated-premium-v12794-20261107
          persist-credentials: true
      - name: Merge both QA lines, preserve latest ten-stage conflict choices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/mars-storm-moons-warp-exit
          git merge --no-ff -X ours origin/feat/mars-storm-moons-warp-exit -m "merge(qa): integrate 10-phase cinematic campaign with Mars/Mecha/City v1.27.69"
          git push origin HEAD:qa/integrated-premium-v12794-20261107
          echo "QA_MERGED_COMMIT=$(git rev-parse HEAD)"
          echo "QA_INTEGRATION_UNVALIDATED=true"
