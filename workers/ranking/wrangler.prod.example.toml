# Separate PROD Worker, Firebase project and D1 database. Never use nova-wing-dev.
# The score submission gate stays disabled until replay/anti-abuse review and acceptance.
name = "nova-wing-ranking-prod"
main = "src/index.js"
compatibility_date = "2026-10-27"
workers_dev = true

[vars]
FIREBASE_PROJECT_ID = "REPLACE_PROD_FIREBASE_PROJECT_ID"
ALLOWED_ORIGINS = "https://trucco86.github.io"
RANKING_SEASON = "current"
SCORE_WRITE_ENABLED = "false"

[[d1_databases]]
binding = "DB"
database_name = "nova-wing-ranking-prod"
database_id = "REPLACE_PROD_DATABASE_ID"
migrations_dir = "migrations"
